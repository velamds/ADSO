<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POO con C# 14 y Java 25: guía práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;500;700&family=Literata:opsz,wght@7..72,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5FA;--surface:#FFFFFF;--ink:#1A1C29;--muted:#596079;--line:#DADDEA;
  --cs:#6B3FA0;--cs-soft:#EEE7F8;--java:#AC4A00;--java-soft:#FCEBD8;
  --ok:#17744A;--ok-soft:#DDF3E7;--bad:#B3261E;--bad-soft:#FBE3E1;
  --code-bg:#EEF0F7;--on-cs:#FFFFFF;
  --k:#B0306A;--t:#0B7683;--s:#2B7A30;--n:#9A5200;--c:#737A93;--f:#3558C9;--a:#7F6500;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12131B;--surface:#1B1D29;--ink:#E9EBF5;--muted:#9EA3BC;--line:#2D3043;
    --cs:#BC9BF2;--cs-soft:#2B2242;--java:#F2A653;--java-soft:#3A2A15;
    --ok:#5FD39A;--ok-soft:#173528;--bad:#FF8F86;--bad-soft:#3D1D1B;
    --code-bg:#0E0F16;--on-cs:#1B1030;
    --k:#FF7FAF;--t:#5FD0D8;--s:#92D898;--n:#F2B466;--c:#7D839E;--f:#82A5FF;--a:#E3C763;
  }
}
:root[data-theme="dark"]{
  --bg:#12131B;--surface:#1B1D29;--ink:#E9EBF5;--muted:#9EA3BC;--line:#2D3043;
  --cs:#BC9BF2;--cs-soft:#2B2242;--java:#F2A653;--java-soft:#3A2A15;
  --ok:#5FD39A;--ok-soft:#173528;--bad:#FF8F86;--bad-soft:#3D1D1B;
  --code-bg:#0E0F16;--on-cs:#1B1030;
  --k:#FF7FAF;--t:#5FD0D8;--s:#92D898;--n:#F2B466;--c:#7D839E;--f:#82A5FF;--a:#E3C763;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--serif);-webkit-text-size-adjust:100%}
a{color:var(--cs)}
:focus-visible{outline:2px solid var(--cs);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:304px minmax(0,1fr)}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:24px 16px 20px;display:flex;flex-direction:column;gap:18px;font-family:var(--sans)}
.brand{font:800 1.3rem/1.15 var(--display);letter-spacing:-.01em;padding:0 8px}
.brand small{display:block;margin-top:6px;font:500 .82rem/1.4 var(--sans);color:var(--muted);letter-spacing:0}
.pills{display:flex;gap:6px;padding:0 8px;flex-wrap:wrap}
.pill{font:700 .74rem var(--sans);padding:3px 9px;border-radius:99px}
.pill.cs{background:var(--cs-soft);color:var(--cs)}
.pill.java{background:var(--java-soft);color:var(--java)}
.prog{padding:0 8px;font:500 .8rem var(--sans);color:var(--muted)}
.prog .track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog .track i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font:500 .92rem/1.3 var(--sans)}
.nav a:hover{background:var(--bg)}
.nav a[aria-current="page"]{background:var(--cs-soft);color:var(--cs);font-weight:700}
.nav .n{min-width:1.5em;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .d{margin-left:auto;font:600 .75rem var(--mono);color:var(--muted)}
.nav .d.full{color:var(--ok)}
.side-foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;padding:0 8px}
.side-foot .btn{flex:1 1 auto}
.topbar{display:none}

main{padding:44px clamp(18px,4vw,56px) 90px;max-width:1100px;width:100%}
.mh{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:36px;align-items:start}
h1{font:800 clamp(2.1rem,4.6vw,3.3rem)/1.04 var(--display);letter-spacing:-.028em;margin:0 0 16px}
.lead{font-size:1.15rem;line-height:1.6;color:var(--muted);max-width:60ch;margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;font:600 .88rem var(--sans)}
.chips a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink);background:var(--surface)}
.chips a:hover{border-color:var(--cs);color:var(--cs)}

.uml{border:1.5px solid var(--ink);border-radius:4px;background:var(--surface);font:500 .82rem/1.55 var(--mono)}
.uml>div{padding:8px 12px}
.uml>div+div{border-top:1.5px solid var(--ink)}
.uml .nm{text-align:center;font-weight:700;font-size:.92rem}
.uml .cs14{color:var(--cs)}
.uml .j25{color:var(--java)}

section{margin-top:58px}
h2{font:700 1.75rem/1.2 var(--display);letter-spacing:-.015em;margin:0 0 20px;padding-bottom:10px;border-bottom:1px solid var(--line)}
h3{font:700 1.25rem/1.3 var(--display);margin:34px 0 8px}
h4{font:700 1.05rem/1.3 var(--display);margin:22px 0 8px}
.theory>*{max-width:72ch}
.theory>.tw{max-width:none}
.theory p{margin:0 0 14px}
.theory ul{margin:0 0 14px;padding-left:1.3em}
.theory li{margin:5px 0}
code{font:500 .86em var(--mono);background:var(--code-bg);padding:.12em .38em;border-radius:5px;word-break:break-word}
.co{margin:18px 0;padding:12px 16px;border-left:4px solid var(--muted);background:var(--surface);border-radius:0 8px 8px 0;font:400 .95rem/1.6 var(--sans)}
.co b{display:block;margin-bottom:2px}
.co.cs{border-color:var(--cs)}.co.cs b{color:var(--cs)}
.co.java{border-color:var(--java)}.co.java b{color:var(--java)}
.co.tip{border-color:var(--ok)}.co.tip b{color:var(--ok)}
.co.ojo{border-color:var(--bad)}.co.ojo b{color:var(--bad)}
.tw{overflow-x:auto;margin:16px 0 22px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font:400 .9rem/1.5 var(--sans);min-width:560px}
th,td{padding:9px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-weight:700;background:var(--bg)}
th.cs{color:var(--cs);background:var(--cs-soft)}
th.java{color:var(--java);background:var(--java-soft)}
td code{font-size:.84em}

.cmpwrap{margin:30px 0}
.cmpwrap h4{margin-top:0}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg)}
.col+.col{border-left:1px solid var(--line)}
.lab{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font:700 .82rem var(--sans)}
.col.cs .lab{background:var(--cs-soft);color:var(--cs)}
.col.java .lab{background:var(--java-soft);color:var(--java)}
.cp{font:600 .76rem var(--sans);border:0;background:transparent;color:inherit;cursor:pointer;padding:3px 8px;border-radius:6px;text-decoration:underline}
.cb{margin:0;padding:14px 16px;overflow-x:auto;font:400 13px/1.6 var(--mono);tab-size:4;color:var(--ink)}
.cb code{background:none;padding:0;font:inherit;word-break:normal}
.note{font:400 .93rem/1.55 var(--sans);color:var(--muted);margin:10px 0 0;max-width:80ch}
.k{color:var(--k);font-weight:500}.t{color:var(--t)}.s{color:var(--s)}.n{color:var(--n)}.c{color:var(--c);font-style:italic}.f{color:var(--f)}.a{color:var(--a)}

.ex{margin:24px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ex-h{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);font-family:var(--sans)}
.ex-h h3{margin:0;font-size:1.05rem}
.kind{font:500 .8rem var(--sans);color:var(--muted);margin-right:8px}
.badge{flex:none;font:700 .75rem var(--sans);padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.ex-b{padding:16px 18px 18px;font-family:var(--sans)}
.ex-desc{font-size:.96rem;line-height:1.6;margin-bottom:12px}
.ex-desc p{margin:0 0 8px}
.ex-desc ul{margin:0 0 8px;padding-left:1.2em}
.ed{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ed-hl,.ed-ta{margin:0;padding:14px 16px 28px;border:0;font:400 13.5px/1.6 var(--mono);letter-spacing:0;tab-size:4;white-space:pre;word-spacing:0}
.ed-hl{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--ink)}
.ed-hl code{background:none;padding:0;font:inherit;word-break:normal}
.ed-ta{position:relative;display:block;width:100%;min-height:160px;resize:none;background:transparent;color:transparent;caret-color:var(--ink);overflow-x:auto;overflow-y:hidden;outline:none;overflow-wrap:normal}
.ed:focus-within{border-color:var(--cs);box-shadow:0 0 0 2px var(--cs-soft)}
.ed-ta::selection{background:rgba(120,110,255,.3)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.btn{font:600 .86rem var(--sans);padding:8px 14px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--cs);color:var(--cs)}
.btn.pri{background:var(--cs);color:var(--on-cs);border-color:var(--cs)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-cs)}
.hint{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--cs-soft);font-size:.92rem;line-height:1.55}
.res{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:5px;font-size:.92rem;line-height:1.5}
.res li{display:flex;gap:9px;align-items:flex-start;padding:6px 10px;border-radius:7px}
.res li.ok{background:var(--ok-soft);color:var(--ok)}
.res li.no{background:var(--bad-soft);color:var(--bad)}
.res li b{flex:none;min-width:5.2em}
.res li.msg{background:var(--bg);color:var(--ink)}
.outbox{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.outlab{padding:5px 12px;font:700 .78rem var(--sans);background:var(--bg);color:var(--muted)}
.outbox .cb{background:var(--code-bg)}
details.sol{margin-top:14px}
details.sol summary{cursor:pointer;font:600 .9rem var(--sans);color:var(--cs)}
details.sol .solbox{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);overflow:hidden}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:64px;padding-top:24px;border-top:1px solid var(--line);font-family:var(--sans)}
.pager a{display:block;padding:12px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none;font:600 .95rem/1.3 var(--sans);max-width:48%}
.pager a small{display:block;font:500 .78rem var(--sans);color:var(--muted);margin-bottom:2px}
.pager a:hover{border-color:var(--cs)}
.pager .nx{margin-left:auto;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 .88rem var(--sans);padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(86vw,320px);height:auto;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);visibility:hidden;transition:transform .22s,visibility .22s}
  .side.open{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;display:none}
  .scrim.on{display:block}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-family:var(--sans)}
  .topbar b{font:700 .98rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .pg{margin-left:auto;font:600 .8rem var(--mono);color:var(--muted);flex:none}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
  .mh{grid-template-columns:minmax(0,1fr);gap:24px}
  .uml{max-width:340px}
}
@media (max-width:760px){
  body{font-size:16.5px}
  .cmp{grid-template-columns:minmax(0,1fr)}
  .col+.col{border-left:0;border-top:1px solid var(--line)}
  .ed-hl,.ed-ta{font-size:16px}
  .pager a{max-width:none;flex:1}
  .pager{flex-direction:column}
}
</style>
</head>
<body>
<div class="topbar"><button class="btn" id="openNav" aria-label="Abrir lista de módulos">Módulos</button><b id="tbTitle"></b><span class="pg" id="tbProg"></span></div>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="side" id="side" aria-label="Módulos de la guía">
    <div class="brand">Programación orientada a objetos<small>Guía con ejercicios en el navegador</small></div>
    <div class="pills"><span class="pill cs">C# 14 · .NET 10</span><span class="pill java">Java 25</span></div>
    <div class="prog"><span id="progTxt"></span><div class="track"><i id="progBar"></i></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><button class="btn" id="themeBtn">Cambiar tema</button><button class="btn" id="resetBtn">Borrar progreso</button></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const R = String.raw;
const MODS = [];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ---------- almacenamiento (siempre con try/catch) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('poo:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('poo:' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('poo:' + k); } catch (e) {} }
};
let done = new Set(store.get('done', []));

/* ---------- resaltado de sintaxis ---------- */
const KWS = {
  cs: new Set('abstract as base bool break byte case catch char checked class const continue decimal default delegate do double else enum event explicit extension extern false field finally float for foreach goto if implicit in init int interface internal is lock long namespace new null object operator out override params partial private protected public readonly record ref required return sbyte sealed short static string struct switch this throw true try typeof uint ulong unchecked ushort using var virtual void volatile when where while with yield async await get set nameof'.split(' ')),
  java: new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new null package private protected public return short static strictfp super switch synchronized this throw throws transient true false try var void volatile while record sealed permits yield'.split(' '))
};
const TOKSRC = String.raw`(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("""[\s\S]*?"""|\$@?"(?:[^"\\\n]|\\.)*"|@"(?:[^"]|"")*"|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)+')|(@[A-Za-z_]\w*)|(\b\d[\d_]*(?:\.\d+)?(?:[fFdDmMLlUu]+)?\b)|([A-Za-z_]\w*)`;
function hl(code, lang) {
  const kws = KWS[lang] || KWS.cs, re = new RegExp(TOKSRC, 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    const t = m[0];
    if (m[1]) out += `<span class="c">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="s">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="a">${esc(t)}</span>`;
    else if (m[4]) out += `<span class="n">${esc(t)}</span>`;
    else {
      let cls = '';
      if (kws.has(t)) cls = 'k'; else if (code[last] === '(') cls = 'f'; else if (/^[A-Z]/.test(t)) cls = 't';
      out += cls ? `<span class="${cls}">${t}</span>` : t;
    }
  }
  return out + esc(code.slice(last));
}
function strip(code) {
  return code.replace(new RegExp(TOKSRC, 'g'), (m, c1, c2) => c1 ? ' ' : c2 ? '""' : m);
}

/* ---------- mini-markup para la teoría ---------- */
function inline(s) {
  return esc(s).split(/(§[^§]+§)/).map(p => p.startsWith('§') ? '<code>' + p.slice(1, -1) + '</code>'
    : p.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[\s(])\*(?=\S)([^*\n]*?\S)\*(?=[\s).,;:]|$)/g, '$1<em>$2</em>')).join('');
}
const CO = { cs: 'C# 14', java: 'Java 25', tip: 'Consejo', ojo: 'Ojo' };
function md(src) {
  let out = '';
  for (const b of src.trim().split(/\n\s*\n/)) {
    const lines = b.split('\n').map(l => l.trim()), f = lines[0];
    if (f.startsWith('## ')) out += `<h3>${inline(f.slice(3))}</h3>`;
    else if (f.startsWith('### ')) out += `<h4>${inline(f.slice(4))}</h4>`;
    else if (f.startsWith('|')) {
      const rows = lines.filter(l => l.startsWith('|')).map(l => l.split('|').slice(1, -1).map(c => c.trim()))
        .filter(r => !r.every(c => /^:?-{2,}:?$/.test(c)));
      const th = rows[0].map(c => `<th class="${/^C#/.test(c) ? 'cs' : /^Java/.test(c) ? 'java' : ''}">${inline(c)}</th>`).join('');
      const body = rows.slice(1).map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('');
      out += `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
    } else if (f.startsWith('- ')) {
      const items = []; for (const l of lines) { if (l.startsWith('- ')) items.push(l.slice(2)); else items[items.length - 1] += ' ' + l; }
      out += '<ul>' + items.map(i => `<li>${inline(i)}</li>`).join('') + '</ul>';
    } else if (f.startsWith('> ')) {
      let t = lines.map(l => l.replace(/^>\s?/, '')).join(' '), k = 'tip';
      const m = t.match(/^\[(cs|java|tip|ojo)\]\s*/); if (m) { k = m[1]; t = t.slice(m[0].length); }
      out += `<aside class="co ${k}"><b>${CO[k]}</b>${inline(t)}</aside>`;
    } else out += `<p>${inline(lines.join(' '))}</p>`;
  }
  return out;
}

/* ---------- bloques de código estáticos ---------- */
const clean = c => c.replace(/^\n/, '').replace(/\s+$/, '');
const pre = (code, lang) => `<pre class="cb"><code>${hl(clean(code), lang)}</code></pre>`;
function compare(c) {
  return `<div class="cmpwrap"><h4>${esc(c.t)}</h4><div class="cmp">
    <div class="col cs"><div class="lab">C# 14<button class="cp" data-copy>Copiar</button></div>${pre(c.cs, 'cs')}</div>
    <div class="col java"><div class="lab">Java 25<button class="cp" data-copy>Copiar</button></div>${pre(c.java, 'java')}</div>
  </div>${c.note ? `<p class="note">${inline(c.note)}</p>` : ''}</div>`;
}

/* ---------- utilidades ---------- */
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1600); }
function copy(text) {
  const fb = () => { const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Copiado'); } catch (e) { toast('No se pudo copiar'); } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Copiado'), fb); else fb();
}
function balanced(s) {
  const st = [], p = { ')': '(', ']': '[', '}': '{' };
  for (const ch of s) { if ('([{'.includes(ch)) st.push(ch); else if (')]}'.includes(ch) && st.pop() !== p[ch]) return false; }
  return st.length === 0;
}

/* ---------- editor de código ---------- */
function makeEditor(host, value, onChange) {
  host.classList.add('ed');
  host.innerHTML = '<pre class="ed-hl" aria-hidden="true"><code></code></pre><textarea class="ed-ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Editor de código C#. Pulsa Escape y luego Tab para salir del editor."></textarea>';
  const code = $('code', host), pr = $('pre', host), ta = $('textarea', host);
  let escaped = false;
  const sync = () => {
    code.innerHTML = hl(ta.value, 'cs') + '\n';
    ta.style.height = 'auto';
    ta.style.height = Math.max(ta.scrollHeight + 4, 160) + 'px';
    pr.scrollLeft = ta.scrollLeft;
  };
  const insert = t => {
    ta.focus();
    if (!document.execCommand('insertText', false, t)) { ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
  };
  ta.value = value; sync();
  ta.addEventListener('input', () => { sync(); onChange && onChange(ta.value); });
  ta.addEventListener('scroll', () => { pr.scrollLeft = ta.scrollLeft; });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab' && escaped) { escaped = false; return; }
    escaped = e.key === 'Escape';
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); insert('    '); }
    else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
      const before = ta.value.slice(0, ta.selectionStart), line = before.slice(before.lastIndexOf('\n') + 1);
      let ind = line.match(/^\s*/)[0]; if (/\{\s*$/.test(line)) ind += '    ';
      e.preventDefault(); insert('\n' + ind);
    }
  });
  window.addEventListener('resize', sync);
  return { get: () => ta.value, set: v => { ta.value = v; sync(); onChange && onChange(v); } };
}

}

function wireEx(root, ex, onProgress) {
  const draft = store.get('code:' + ex.id, null);

  theory: R`
## ¿Qué es la programación orientada a objetos?

La POO organiza un programa como un conjunto de **objetos** que guardan datos (**estado**) y saben hacer cosas con ellos (**comportamiento**). Un objeto es una instancia concreta de una **clase**, que funciona como plano o molde.

Cuatro ideas sostienen el paradigma:

- **Abstracción**: modelar solo lo relevante de un concepto. Una cuenta bancaria tiene saldo y titular; no necesita su color.
- **Encapsulamiento**: ocultar el estado interno y exponer operaciones controladas, para que el objeto nunca quede en un estado inválido.
- **Herencia**: una clase especializada reutiliza y extiende a otra (relación "es un").
- **Polimorfismo**: tratar objetos distintos a través de un contrato común y que cada uno responda a su manera.

A estas se suma una práctica que verás en el módulo 6: preferir **composición** (relación "tiene un") antes que herencia.

## Dos lenguajes, un mismo paradigma

C# y Java comparten un linaje muy parecido: ambos son de tipado estático, compilan a un lenguaje intermedio, tienen recolector de basura y una sintaxis derivada de C. Por eso la mayoría de los conceptos se transfieren casi tal cual. Donde difieren es en los **detalles de diseño**, y esos detalles son lo que esta guía pone en paralelo.

| Aspecto | C# 14 / .NET 10 | Java 25 |
|---|---|---|
| Plataforma de ejecución | CLR (.NET 10, LTS) | JVM (JDK 25, LTS) |
| Código intermedio | IL dentro de ensamblados .dll | Bytecode en archivos .class / .jar |
| Agrupar tipos | §namespace§ | §package§ |
| Gestor de paquetes | NuGet | Maven Central con Maven o Gradle |
| Archivo de proyecto | §.csproj§ | §pom.xml§ o §build.gradle§ |
| Ejecutar rápido | §dotnet run§ | §java Archivo.java§ |

> [tip] Esta guía usa C# como lenguaje principal. Cada concepto se explica en C# y luego se muestra el equivalente en Java 25 para que veas qué se parece y qué cambia.

## Cómo usar esta guía

Cada módulo sigue el mismo orden: **teoría**, **comparativa C# frente a Java**, una **práctica guiada** y varios **retos** cortos. En la práctica y en los retos hay un editor donde escribes C#.

  theory: R`
## Clase y objeto

Una **clase** describe qué datos tiene un tipo de cosa y qué operaciones admite. Un **objeto** es una instancia concreta creada con §new§. Muchas instancias de la misma clase comparten estructura pero tienen su propio estado.

Los miembros principales son:

- **Campos**: variables que guardan el estado de cada objeto.
- **Métodos**: funciones que operan sobre ese estado.
- **Constructores**: código que se ejecuta al crear el objeto y deja su estado inicial válido.
- **§this§**: referencia al objeto actual, útil para distinguir un parámetro de un campo con el mismo nombre.

## Tipos por referencia

Tanto en C# como en Java, una variable de tipo clase **no contiene el objeto, sino una referencia** a él. Dos consecuencias importantes:

- Asignar §var b = a;§ copia la referencia, no el objeto. Ambas variables apuntan al mismo objeto, y un cambio hecho por una se ve en la otra.
- §null§ significa "no apunta a ningún objeto". Usar un miembro de una referencia nula lanza una excepción (§NullReferenceException§ en C#, §NullPointerException§ en Java).

La memoria de los objetos la administra el **recolector de basura**: cuando ya nada los referencia, se liberan solos.

## Constructores en C#

Puedes definir varios constructores (sobrecarga) y encadenarlos con §: this(...)§ para no repetir lógica. Además, C# 12 añadió los **constructores primarios**: los parámetros se declaran en la cabecera de la clase y quedan disponibles en todo su cuerpo.

C# también permite **inicializadores de objeto**: §new Persona { Nombre = "Ana" }§, que asignan propiedades justo después de construir.

> [ojo] En una clase con constructor primario, los parámetros **no son campos ni propiedades** automáticamente: son valores capturados. Si quieres exponerlos, declara una propiedad inicializada con ellos (lo verás en el módulo 2).

> [java] Java no tiene constructores primarios ni inicializadores de objeto. Para lo primero se usan constructores explícitos (o un §record§ si los datos son inmutables); para lo segundo, setters o el patrón *builder*. El encadenamiento se escribe §this(...)§ como primera instrucción del constructor.

  lead: 'Proteger el estado de un objeto con modificadores de acceso y propiedades. Aquí aparece la primera novedad de C# 14: la palabra clave field.',
  uml: { name: 'Encapsulamiento', items: ['private / public', 'propiedades', 'init / required', 'invariantes'], cs: 'palabra clave field', java: 'getters y setters' },
  theory: R`
## Ocultar el estado, exponer el comportamiento

Si cualquiera puede escribir en cualquier campo, nadie puede garantizar que el objeto sea coherente. El **encapsulamiento** consiste en hacer privado el estado y dejar que los cambios pasen por métodos o propiedades que validan. Una cuenta no debería permitir un saldo negativo por accidente: la regla vive **dentro** de la clase, en un solo lugar.

## Modificadores de acceso

| Nivel | C# 14 | Java 25 |
|---|---|---|
| Visible en todas partes | §public§ | §public§ |
| Solo dentro de la clase | §private§ (es el valor por defecto de un miembro) | §private§ |
| Clase y derivadas | §protected§ | §protected§ (además, todo el paquete) |
| Mismo proyecto o ensamblado | §internal§ | No existe. Lo más cercano es acceso de paquete |
| Mismo paquete (sin escribir nada) | No existe | Acceso de paquete: es el valor por defecto |
| Derivadas dentro del mismo ensamblado | §private protected§ | No existe |
| Mismo ensamblado o derivadas | §protected internal§ | No existe |
| Solo en el archivo actual | §file§ (tipos) | No existe |

## Propiedades

En C# una **propiedad** parece un campo desde fuera, pero por dentro son dos métodos (§get§ y §set§). Permiten validar sin cambiar la forma de uso. Variantes habituales:

- **Autopropiedad**: §public int Edad { get; set; }§. El compilador crea el campo oculto.
- **Solo lectura desde fuera**: §{ get; private set; }§.
- **Solo en construcción**: §{ get; init; }§. Se asigna al crear el objeto y después es inmutable.
- **§required§**: obliga a quien construye a asignar esa propiedad.
- **Calculada**: §public double Area => ancho * alto;§.

## La palabra clave field (C# 14)

Antes, para añadir validación a una autopropiedad había que declarar a mano un campo de respaldo. Con C# 14 puedes escribir la lógica en un accessor y referirte al campo oculto con **§field§**, sin declararlo. Así conservas la sintaxis corta y solo escribes lo que cambia.

> [cs] §public string Nombre { get; set => field = value.Trim(); }§ . El §get§ sigue siendo automático y el §set§ usa §field§.

> [ojo] Si ya tenías una variable llamada §field§ en una clase, dentro de un accessor la palabra clave tiene prioridad. Puedes escribir §@field§ o §this.field§ para referirte a la tuya.

## Y en Java

Java no tiene propiedades. La convención es campo privado más **getter** y **setter**. Para inmutabilidad se usan campos §final§ asignados en el constructor, o un §record§. No existe equivalente de §init§ ni de §required§ en el lenguaje.

MODS.push({
  title: 'Herencia',
  lead: 'Reutilizar y especializar clases con la relación "es un". Incluye una diferencia sutil en el orden de construcción y una novedad de Java 25.',
  uml: { name: 'Herencia', items: ['clase base y derivada', 'base(...)', 'protected', 'sealed', 'object'], cs: 'class B : A', java: 'class B extends A' },
  theory: R`
## La relación "es un"

Una clase **derivada** hereda los miembros accesibles de una clase **base** y puede añadir los suyos. Un §Auto§ **es un** §Vehiculo§. La herencia sirve para compartir comportamiento común y para habilitar polimorfismo (módulo 4).

Reglas comunes a C# y Java:

- Una clase puede heredar de **una sola** clase base, pero implementar **varias** interfaces.
- Toda clase termina heredando de una raíz común: §object§ en C#, §java.lang.Object§ en Java. De ahí vienen §ToString§, §Equals§ y §GetHashCode§ (en Java, §toString§, §equals§ y §hashCode§).
- El constructor de la derivada debe llamar a uno de la base. Si no lo escribes, se invoca el constructor sin parámetros.

## Sintaxis

- C#: §class Auto : Vehiculo§ y la llamada a la base con §: base(...)§ en la cabecera del constructor, o §: Vehiculo(placa)§ si usas constructor primario.
- Java: §class Auto extends Vehiculo§ y la llamada con §super(...)§ dentro del cuerpo.

Para impedir que una clase se extienda se usa **§sealed§** en C# y **§final§** en Java. También puedes sellar un solo método ya sobrescrito.

## Orden de construcción: una diferencia real

Cuando creas un objeto derivado, ambos lenguajes inicializan la base antes de ejecutar el **cuerpo** del constructor de la derivada. Pero difieren en cuándo corren los **inicializadores de campos** de la derivada:

- **C#**: los inicializadores de campo de la derivada se ejecutan **antes** que el constructor de la base.
- **Java**: se ejecutan **después** de que termine el constructor de la base.

Esto importa si el constructor de la base llama a un método sobrescrito: en Java ese método verá los campos de la derivada todavía con su valor por defecto.

> [java] Java 25 finaliza los **cuerpos de constructor flexibles** (JEP 513): puedes escribir instrucciones antes de §super(...)§, por ejemplo para validar argumentos, siempre que no uses §this§. Antes, la llamada a §super§ tenía que ser la primera línea.

> [cs] En C# la validación previa se hace con una función estática dentro de la llamada: §: base(Validar(id))§.

## Cuándo no heredar

Herencia crea un acoplamiento fuerte: un cambio en la base afecta a todas las derivadas. Úsala cuando la relación "es un" sea genuina y estable. Si solo quieres reutilizar código, la composición (módulo 6) suele ser mejor.

## Muchas formas, un contrato

El **polimorfismo** permite escribir código contra un tipo general (una clase base o una interfaz) y que, en ejecución, se invoque la versión del objeto concreto. Una lista de §Figura§ puede contener círculos y rectángulos, y al pedir el área de cada uno se ejecuta el cálculo correcto.

Hay varias formas, conviene distinguirlas:

- **Polimorfismo de subtipos** (por herencia o interfaces): se decide en **ejecución** según el tipo real. Es el protagonista de este módulo.
- **Sobrecarga**: varios métodos con el mismo nombre y distintos parámetros. Se decide en **compilación**.
- **Paramétrico** (genéricos): el mismo código sirve para muchos tipos. Módulo 8.

## Despacho dinámico: virtual y override

Aquí C# y Java piensan distinto:

- En **C#**, un método **no es sobrescribible por defecto**. La clase base debe marcarlo §virtual§ (o §abstract§) y la derivada debe marcarlo §override§. Es una decisión explícita.
- En **Java**, todo método de instancia no privado, no estático y no §final§ **ya es virtual**. La anotación §@Override§ es opcional, pero el compilador la verifica y conviene usarla siempre.

Para llamar a la implementación de la base desde un override se usa §base.Metodo()§ en C# y §super.metodo()§ en Java.

> [ojo] Ocultar no es sobrescribir. Con §Base b = new Derivada();§, una llamada a un método oculto ejecuta el de **Base**; con override ejecutaría el de **Derivada**.

  theory: R`
## Abstraer es decidir qué importa

Una abstracción expone **qué** hace algo y esconde **cómo**. En código se materializa de dos maneras.

## Clase abstracta

Es una clase que **no se puede instanciar** y que puede mezclar miembros ya implementados con otros **abstractos** (sin cuerpo) que las derivadas están obligadas a implementar. Sirve cuando varias clases comparten **estado** y parte del comportamiento. Es la base del patrón *método plantilla*: la base define el algoritmo y las derivadas rellenan los pasos.

Se declara con §abstract§ en ambos lenguajes.

## Interfaz

Una interfaz es un **contrato**: lista de miembros que una clase se compromete a ofrecer. Una clase puede implementar **muchas** interfaces. Describe una capacidad ("se puede comparar", "se puede pagar") más que una identidad.

Diferencias de diseño:

- **C#**: los miembros de una interfaz son públicos por defecto. Convención: el nombre empieza con **I** (§IPagable§). Admite miembros **por defecto** con cuerpo, miembros **estáticos** y **§static abstract§** (para contratos sobre el tipo, útiles en genéricos).
- **Java**: la clase usa §implements§. Admite métodos §default§, §static§ y §private§. Los campos de una interfaz son constantes. Las interfaces pueden ser §sealed§ con §permits§ para limitar quién las implementa.
- **Implementación explícita (solo C#)**: §void IA.Hacer()§ implementa un miembro de interfaz que solo se ve a través de esa interfaz. Resuelve conflictos de nombres entre dos interfaces.

## ¿Abstracta o interfaz?

- Usa **clase abstracta** si hay estado compartido o una relación "es un" fuerte con código común.
- Usa **interfaz** para capacidades transversales que clases sin parentesco pueden ofrecer. Como solo puedes heredar de una clase, las interfaces son tu vía de "herencia múltiple" de comportamiento.

> [ojo] En C#, un método por defecto de una interfaz **no es visible desde la clase** que la implementa. Para invocarlo necesitas una variable del tipo de la interfaz: §IDescontable d = new Camiseta(...);§.

> [java] En Java las interfaces **sealed** cierran la jerarquía: §sealed interface Forma permits Circulo, Cuadrado§. Combinadas con §switch§ por patrones, el compilador verifica que cubras todos los casos. C# 14 no tiene jerarquías cerradas equivalentes.

MODS.push({
  title: 'Composición y asociaciones',
  lead: 'La relación "tiene un": construir objetos complejos a partir de objetos simples, e inyectar dependencias por constructor.',
  uml: { name: 'Composición', items: ['asociación', 'agregación', 'composición', 'inyección de dependencias'], cs: 'IReadOnlyList<T>', java: 'List.copyOf' },
  theory: R`
## "Tiene un" en lugar de "es un"

Un §Pedido§ **tiene** líneas; un §Auto§ **tiene** un motor. Cuando un objeto guarda referencias a otros y les delega trabajo, hablamos de **composición** en sentido amplio. El principio de diseño clásico es: **favorece la composición sobre la herencia**, porque es más flexible (puedes cambiar las piezas en ejecución) y menos acoplada.

Se suele distinguir el grado de dependencia:

- **Asociación**: un objeto conoce a otro y lo usa. Ninguno es dueño del otro.
- **Agregación**: un objeto agrupa a otros, pero estos pueden existir por separado (un equipo y sus jugadores).
- **Composición**: el objeto contenedor es dueño del ciclo de vida de sus partes; si desaparece, las partes también (un pedido y sus líneas).

## Delegación e inyección de dependencias

En lugar de que una clase cree sus colaboradores con §new§, **los recibe por el constructor**, idealmente como interfaces. Así puedes sustituirlos por otros o por dobles de prueba. Esto es **inyección de dependencias** y es la base de los contenedores de DI de .NET y de Spring.

## Proteger las colecciones internas

Si una clase expone su lista directamente, cualquiera puede modificarla y romper tus invariantes. Opciones:

- **C#**: guarda un §List<T>§ privado y expón §IReadOnlyList<T>§ (o §IEnumerable<T>§). Los literales de colección §[a, b, c]§ llegaron con C# 12.
- **Java**: guarda una §List<T>§ privada y devuelve una vista de solo lectura con §Collections.unmodifiableList(...)§ o una copia con §List.copyOf(...)§. Los literales inmutables se crean con §List.of(...)§.

> [ojo] §IReadOnlyList<T>§ es una **vista**: si el que la recibe hace un cast a §List<T>§, podría modificarla. Si necesitas blindaje real, devuelve una copia inmutable.

> [tip] Pregúntate: ¿estas dos clases son realmente "es un"? Si dudas, usa composición. Es más fácil pasar de composición a herencia que al revés.
`,

    public IReadOnlyList<Item> Items => items;

  theory: R`
## Record: datos con igualdad por valor

Un **record** es una forma corta de declarar un tipo cuyo propósito es **transportar datos**. El compilador genera por ti constructor, propiedades, igualdad **por valor**, §ToString§ legible y un método de copia.

En C#, §record Punto(int X, int Y);§ crea un tipo por referencia, con propiedades **init**. Dos records con los mismos valores son iguales con §==§. La expresión §with§ crea una copia cambiando solo lo que indiques: §p with { Y = 9 }§.

En Java, §record Punto(int x, int y) {}§ genera campos privados finales, constructor, accesores (§p.x()§), §equals§, §hashCode§ y §toString§. **No existe §with§**: para copiar con cambios escribes un método tú mismo.

## Struct: tipo por valor (solo C#)

Un §struct§ es un **tipo por valor**: la variable contiene los datos directamente y asignarla **copia** el contenido. Es ideal para tipos pequeños e inmutables (coordenadas, dinero, fechas). No admite herencia de clases, aunque sí implementa interfaces.

- §readonly struct§: garantiza inmutabilidad.
- §record struct§ y §readonly record struct§: structs con las ventajas de los records.

> [java] Java 25 **no tiene structs ni tipos por valor definidos por el usuario**. Todo objeto es por referencia. El proyecto Valhalla trabaja en "clases de valor", pero no forman parte de la característica estándar de Java 25.

## Enum

En **C#**, un §enum§ es un conjunto de **constantes con nombre** respaldadas por un entero. No puede tener campos ni métodos propios; el comportamiento se pone aparte (un método estático, un §switch§ o un método de extensión). Con §[Flags]§ y potencias de dos se combinan valores con §|§.

En **Java**, un §enum§ es una **clase completa**: cada constante es una instancia única que puede tener campos, constructor, métodos y hasta cuerpo propio. Para combinaciones se usa §EnumSet§.

## Igualdad: ten claro qué compara cada cosa

| Tipo | C# 14 | Java 25 |
|---|---|---|
| Clase normal con == | Compara **referencias** (salvo que se sobrecargue §==§) | Compara **referencias** siempre |
| Contenido de dos objetos | §Equals§ y §GetHashCode§ | §equals§ y §hashCode§ |
| string con == | Compara **contenido** | Compara **referencia** (usa §equals§) |
| record | Igualdad **por valor** automática | Igualdad **por valor** automática |

> [ojo] En Java, §"a" == new String("a")§ es falso. Usa siempre §.equals()§ para comparar contenido.

## Parametrizar por tipo

Un tipo o método **genérico** recibe uno o más **parámetros de tipo** (por convención §T§) que se concretan al usarlo. §List<string>§ es una lista de textos y §List<int>§ una de enteros, con la seguridad de tipos comprobada en compilación y sin conversiones manuales.

## Restricciones

A veces necesitas exigir algo del tipo, por ejemplo que se pueda comparar o que tenga constructor sin parámetros.

- **C#**: cláusula §where§ al final: §where T : IComparable<T>§, §where T : class§, §where T : struct§, §where T : new()§, §where T : notnull§. Se pueden combinar.
- **Java**: límite superior en la declaración: §<T extends Comparable<T>>§. Para varios límites se usa §&§.

## La diferencia profunda: reificación frente a borrado

- **C# reifica los genéricos**: el tipo concreto existe en ejecución. Por eso puedes escribir §typeof(T)§, §new T()§ (con restricción §new()§) o saber que una lista es §List<int>§. Además, §List<int>§ almacena enteros sin **boxing**.
- **Java borra los tipos** en compilación (*type erasure*): en ejecución una §List<String>§ es solo una §List§. Consecuencias: no puedes hacer §new T()§, §T.class§, ni §instanceof List<String>§, y los genéricos **no admiten primitivos** (§List<int>§ no existe; se usa §List<Integer>§ con boxing).

## Varianza

Una §List<Perro>§ **no es** una §List<Animal>§ en ninguno de los dos lenguajes, porque permitiría insertar un gato. Para casos de solo lectura o solo escritura:

- **C#** declara la varianza en la interfaz: §out T§ (covariante, solo produce) e §in T§ (contravariante, solo consume). §IEnumerable<out T>§ permite pasar §IEnumerable<Perro>§ donde se pide §IEnumerable<Animal>§.
- **Java** la declara en el **uso** con comodines: §List<? extends Animal>§ (solo lectura) y §List<? super Perro>§ (solo escritura).

> [cs] C# 14 mantiene todo esto; además, como parte de su trabajo con §Span<T>§, mejoró las conversiones implícitas entre arreglos y spans, útil en código genérico de alto rendimiento.

> [java] Java 25 sigue sin tipos genéricos sobre primitivos. Es uno de los objetivos del proyecto Valhalla, todavía no disponible como función estándar.

/* ===================== 9. ESTÁTICOS, EXTENSIÓN, OPERADORES ===================== */
MODS.push({
  title: 'Estáticos, extensión y operadores',
  lead: 'Miembros que pertenecen al tipo, nuevas capacidades para tipos existentes y operadores propios. Aquí C# 14 trae los extension members.',
  uml: { name: 'Miembros de tipo', items: ['static', 'const / readonly', 'extension methods', 'operator +', 'indexadores'], cs: 'extension(...) { }', java: 'clase de utilidades' },
  theory: R`
## Miembros estáticos

Un miembro §static§ pertenece al **tipo**, no a cada objeto. Existe una sola copia y se accede con el nombre del tipo: §Math.Max(...)§. Úsalos para utilidades sin estado, contadores compartidos o constantes.

- Una **clase estática** (§static class§ en C#) no se puede instanciar ni heredar y solo contiene miembros estáticos.
- En C# hay **constructores estáticos** (§static Clase() { }§) que inicializan el tipo una vez. En Java son los **bloques** §static { }§.
- Constantes: §const§ y §static readonly§ en C#; §static final§ en Java.

> [ojo] El estado estático es global y compartido. Si varios hilos lo modifican, necesitas sincronización. Evítalo para datos de negocio.

## Métodos de extensión y extension members (C# 14)

C# permite **añadir miembros a un tipo existente** sin modificarlo ni heredar de él. Históricamente eran solo **métodos** de extensión (§this§ en el primer parámetro). **C# 14** introduce los **bloques §extension§**, que además permiten **propiedades** de extensión y miembros **estáticos** de extensión, con una sintaxis más natural:

§extension(string texto) { public bool EsVacio => texto.Length == 0; }§

El parámetro entre paréntesis es el **receptor**: el objeto sobre el que se invoca.

  theory: R`
## Delegados: funciones como valores

Un **delegado** es un tipo que representa una referencia a un método con cierta firma. Permite pasar comportamiento como argumento, guardarlo o devolverlo. En la práctica casi nunca declaras uno propio, porque la biblioteca trae los genéricos:

- §Action<T>§: recibe parámetros y no devuelve nada.
- §Func<T, R>§: recibe parámetros y devuelve un valor (el último tipo es el de retorno).
- §Predicate<T>§: devuelve bool.

En Java no hay delegados: se usan **interfaces funcionales** (con un solo método abstracto) como §Runnable§, §Supplier<T>§, §Function<T,R>§, §Consumer<T>§ o §Predicate<T>§ del paquete §java.util.function§.

## Lambdas y closures

Una **lambda** es una función anónima: §x => x * x§ en C#, §x -> x * x§ en Java. Puede **capturar** variables de su entorno (*closure*). En Java, las variables capturadas deben ser **efectivamente finales**; en C# pueden cambiar.

Java además ofrece **referencias a métodos** con §::§ (§String::length§); C# usa **grupos de métodos** (§Console.WriteLine§ pasado directamente).

> [cs] C# 14 permite **modificadores en parámetros de lambda sin escribir los tipos**: §(texto, out resultado) => int.TryParse(texto, out resultado)§. Antes tenías que declarar el tipo de cada parámetro cuando usabas §out§, §ref§ o §in§.

## Eventos: el patrón Observador integrado

Un **evento** permite que un objeto (**publicador**) avise a otros (**suscriptores**) cuando algo ocurre, sin conocerlos. En C#:

- el publicador declara §public event EventHandler<T>? Cambio;§,
- los suscriptores usan §+=§ para registrarse y §-=§ para salir,
- el publicador lo dispara con §Cambio?.Invoke(this, datos)§. El §?.§ evita fallar si nadie escucha.

Desde fuera, un evento **solo** puede suscribirse o desuscribirse; solo la clase dueña puede dispararlo. Eso lo hace más seguro que exponer un delegado público.

> [java] Java no tiene la palabra clave §event§. Se implementa con una **lista de oyentes** (interfaces) y métodos §agregarOyente§ / §quitarOyente§, o se usan utilidades como §PropertyChangeSupport§. La idea es la misma con más código manual.

> [ojo] Un suscriptor que no se da de baja mantiene viva la referencia a su objeto: es una fuga de memoria típica en eventos de larga vida.

  lead: 'Qué hacer cuando algo sale mal y cómo liberar recursos con seguridad. Java obliga a declarar ciertas excepciones; C# no.',
  uml: { name: 'Fallos y ciclo de vida', items: ['try / catch / finally', 'excepciones propias', 'IDisposable', 'recolector de basura'], cs: 'using + filtros when', java: 'try-with-resources' },
  theory: R`
## Excepciones

Una **excepción** es un objeto que representa un error y que interrumpe el flujo normal hasta que alguien lo captura. Estructura común a ambos lenguajes:

- §try§: código que puede fallar.
- §catch§: maneja un tipo de excepción. Pon los más específicos primero.
- §finally§: se ejecuta **siempre**, haya o no error. Ideal para limpiar.
- §throw§: lanza una excepción.

Para errores de dominio crea tu **excepción propia** heredando de §Exception§ (o de una subclase más específica).

## La gran diferencia: checked frente a unchecked

- **Java** distingue excepciones **comprobadas** (§Exception§ y derivadas, salvo §RuntimeException§): el compilador **obliga** a capturarlas o declararlas con §throws§ en la firma. Y **no comprobadas** (§RuntimeException§, §Error§).
- **C#** **no tiene** excepciones comprobadas. Cualquier excepción puede lanzarse sin declararlo; la documentación indica cuáles esperar.

Cada enfoque tiene defensores: Java hace visibles los fallos posibles en el contrato; C# evita firmas ruidosas y cambios en cascada.

## Extras de C#

- **Filtros de excepción**: §catch (HttpException e) when (e.Codigo == 404)§ solo captura si se cumple la condición, sin perder la pila de llamadas.
- **Expresión throw**: §var x = valor ?? throw new ArgumentNullException(nameof(valor));§.

## Liberar recursos

Archivos, conexiones y sockets son recursos **no administrados** que el recolector de basura no cierra a tiempo. Hay que liberarlos de forma determinista:

- **C#**: la clase implementa §IDisposable§ con un método §Dispose()§ y se usa con **§using§**. La forma de declaración §using var c = new Conexion();§ libera al salir del ámbito.
- **Java**: la clase implementa §AutoCloseable§ con §close()§ y se usa con **try-with-resources**: §try (var c = new Conexion()) { ... }§.

En ambos casos el cierre ocurre aunque haya excepción. Evita los **finalizadores** (§~Clase()§ en C#, §finalize()§ en Java, ya marcado para eliminación): son impredecibles y costosos.

> [tip] Regla práctica: si tu clase crea o recibe algo que se cierra, tu clase probablemente también debe ser desechable.

  theory: R`
## Los cinco principios SOLID

No son reglas del lenguaje, sino guías de diseño. Funcionan igual en C# y Java.

- **S, responsabilidad única**: una clase debe tener **una sola razón para cambiar**. Si §Pedido§ calcula totales, imprime facturas y guarda en base de datos, son tres razones.
- **O, abierto a extensión y cerrado a modificación**: añade comportamiento nuevo creando clases nuevas, no editando las existentes. El patrón *Strategy* (una interfaz con varias implementaciones) es el ejemplo típico.
- **L, sustitución de Liskov**: una derivada debe poder usarse donde se espera la base **sin romper nada**. Si §Pinguino§ hereda de §Ave§ y lanza error al llamar a §Volar()§, la jerarquía está mal.
- **I, segregación de interfaces**: mejor varias interfaces pequeñas y cohesivas que una enorme. Nadie debe depender de métodos que no usa.
- **D, inversión de dependencias**: los módulos de alto nivel dependen de **abstracciones**, no de clases concretas. Se logra inyectando interfaces por constructor (módulo 6).

## Tabla resumen: C# 14 frente a Java 25

| Concepto | C# 14 | Java 25 |
|---|---|---|
| Heredar | §class B : A§ | §class B extends A§ |
| Implementar interfaz | §class B : IA§ | §class B implements A§ |
| Llamar a la base | §base.M()§, §: base(...)§ | §super.m()§, §super(...)§ |
| Método sobrescribible | Solo si es §virtual§ / §abstract§ | Por defecto (salvo §final§) |
| Sellar | §sealed§ | §final§ y §sealed ... permits§ |
| Propiedades | Sí (§get§, §set§, §init§, §field§) | No: getters y setters |
| Inmutables compactos | §record§, §record struct§ | §record§ |
| Tipos por valor propios | §struct§ | No en Java 25 |
| Enum | Constantes numéricas | Clase completa |
| Genéricos | Reificados | Borrado de tipos |
| Sobrecarga de operadores | Sí | No |
| Métodos de extensión | Sí (y miembros en C# 14) | No |
| Eventos | Palabra clave §event§ | Oyentes manuales |
| Excepciones comprobadas | No | Sí |
| Liberar recursos | §IDisposable§ y §using§ | §AutoCloseable§ y try-with-resources |
| Nulabilidad | Tipos de referencia anulables (§string?§) | Sin sistema nativo (anotaciones y §Optional§) |
| Clases parciales | §partial§ | No |

## Para seguir aprendiendo

- Practica los patrones *Strategy*, *Observer*, *Factory* y *Decorator* en ambos lenguajes.
- Explora en C# el *pattern matching* avanzado, LINQ y los tipos anulables.
- Explora en Java las jerarquías selladas con *switch* exhaustivo y los records anidados.
- Escribe pruebas unitarias: la inyección de dependencias existe precisamente para facilitarlas.

record Producto(string Nombre, decimal Precio);

interface IDescuento
{

class Pedido(IDescuento descuento)
{
    private readonly List<(Producto Producto, int Cantidad)> lineas = [];

    public void Agregar(Producto producto, int cantidad) =>
        lineas.Add((producto, cantidad));

    public decimal Total()
    {
        var subtotal = lineas.Sum(l => l.Producto.Precio * l.Cantidad);
        return descuento.Aplicar(subtotal);
    }
}
