<script>
const R = String.raw;
const STEPS = [];

/* ---------- almacenamiento ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('tienda:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tienda:' + k, JSON.stringify(v)); } catch (e) {} },

let cur = 0;

/* ---------- resaltado: el texto vive en atributos data-t y se dibuja con CSS ---------- */
const KW = {
  csharp: new Set('abstract as async await base bool break case catch char checked class const continue decimal default delegate do double else enum event explicit extern false field finally float for foreach get if implicit in init int interface internal is lock long namespace new null object operator out override params partial private protected public readonly record ref required return sealed set short static string struct switch this throw true try typeof using value var virtual void when where while with yield'.split(' ')),

const METHODS = new Set(['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS', 'HEAD']);
const STR = String.raw`"(?:[^"\\\n]|\\.)*"`;
const RULES = {
  csharp: [['c', /\/\/[^\n]*|\/\*[\s\S]*?\*\//y], ['s', /"""[\s\S]*?"""|\$@?"(?:[^"\\\n]|\\.)*"|@\$?"(?:[^"]|"")*"|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)+'/y], ['n', /\d[\d_]*(?:\.\d+)?[fFdDmMuUlL]*\b/y]],
  json: [['s', new RegExp(STR, 'y')], ['n', /-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/y]],
  yaml: [['c', /#[^\n]*/y], ['s', /"(?:[^"\\\n]|\\.)*"|'[^'\n]*'/y], ['n', /\d+(?:\.\d+)?\b/y]],
  xml: [['c', /<!--[\s\S]*?-->/y], ['s', /"[^"\n]*"/y], ['k', /<\/?[\w.:-]+|\/?>/y]],
  html: [['c', /<!--[\s\S]*?-->/y], ['s', /"[^"\n]*"|'[^'\n]*'/y], ['k', /<!?\/?[\w.:-]+|\/?>/y]],
  bash: [['c', /#[^\n]*/y], ['s', /"(?:[^"\\\n]|\\.)*"|'[^'\n]*'/y], ['p', /--?[A-Za-z][\w-]*/y]],
  sql: [['c', /--[^\n]*/y], ['s', /'(?:[^']|'')*'/y], ['n', /\d+/y]],
  http: [['c', /#[^\n]*/y], ['s', new RegExp(STR, 'y')], ['n', /\b\d+(?:\.\d+)?\b/y]],
  text: []

const WORD = { bash: /[A-Za-z_.\/][\w.\/-]*/y, yaml: /[\w.-]+/y, xml: /[\w:.-]+/y, html: /[\w:.-]+/y, http: /[A-Za-z][\w\/.-]*/y };
const DEFWORD = /[A-Za-z_]\w*/y;
const LINEWISE = new Set(['bash', 'http', 'yaml', 'text']);

function tokenizeChunk(code, lang) {
  const rules = RULES[lang] || [], out = [];
  const push = (c, t) => { const l = out[out.length - 1]; if (l && l[0] === c) l[1] += t; else out.push([c, t]); };
  let i = 0, cmdStart = true, lineStart = true;
  while (i < code.length) {
    let hit = null;
    for (const [c, re] of rules) { re.lastIndex = i; const m = re.exec(code); if (m) { hit = [c, m[0]]; break; } }
    if (hit) {
      let [c, t] = hit; i += t.length;
      if (lang === 'json' && c === 's' && /^\s*:/.test(code.slice(i, i + 6))) c = 'ty';
      push(c, t); cmdStart = false; lineStart = false; continue;
    }
    const ch = code[i];
    if (ch === '\n') { push('', ch); i++; cmdStart = true; lineStart = true; continue; }
    if (lang === 'bash' && (code.startsWith('&&', i) || ch === '|' || ch === ';')) { const n = ch === '&' ? 2 : 1; push('', code.substr(i, n)); i += n; cmdStart = true; continue; }
    const wre = WORD[lang] || DEFWORD; wre.lastIndex = i;
    const m = wre.exec(code);
    if (m) {
      const w = m[0]; i += w.length; const nxt = code[i], after = code.slice(i, i + 3);
      let c = '';
      if (lang === 'csharp' || lang === 'sql') {
        const key = lang === 'sql' ? w.toLowerCase() : w;
        if (KW[lang].has(key)) c = 'k'; else if (nxt === '(') c = 'f'; else if (/^[A-Z]/.test(w)) c = 'ty';
      } else if (lang === 'json') { if (LITS.has(w)) c = 'k'; }
      else if (lang === 'yaml') { if (LITS.has(w)) c = 'k'; else if (/^\s*:/.test(after) || nxt === ':') c = 'ty'; }

      else if (lang === 'http') { if (lineStart && (METHODS.has(w) || /^HTTP\//.test(w))) c = 'k'; else if (lineStart && nxt === ':') c = 'ty'; }

    }

}
function tokenize(code, lang) {
  if (!LINEWISE.has(lang)) return tokenizeChunk(code, lang);
  const out = [];
  code.split('\n').forEach((ln, idx) => { if (idx) out.push(['', '\n']); out.push(...tokenizeChunk(ln, lang)); });
  return out;
}
function splitLines(tokens) {
  const lines = [[]];
  for (const [c, t] of tokens) t.split('\n').forEach((part, idx) => { if (idx) lines.push([]); if (part) lines[lines.length - 1].push([c, part]); });
  return lines;
}
function lineHTML(toks, cls) {
  return `<div class="ln${cls ? ' ' + cls : ''}"><span class="no"></span><span class="src">` +
    toks.map(([c, t]) => `<span class="t${c ? ' ' + c : ''}" data-t="${escAttr(t)}"></span>`).join('') + '</span></div>';
}
function codeBox(kind, lang, rawBody, tagHtml, path, extra) {
  let body = rawBody.slice(); while (body.length && !body[0].trim()) body.shift(); while (body.length && !body[body.length - 1].trim()) body.pop();

# Teoría: qué es una API REST

Una **API** (interfaz de programación de aplicaciones) es un contrato: dice qué peticiones acepta un programa y qué respuestas devuelve. **REST** es un estilo para diseñar APIs sobre HTTP. Sus ideas principales son:

- **Recursos con dirección propia.** Todo lo que la API maneja (una categoría, un producto, un pedido) es un recurso con una URL. Se nombran con sustantivos en plural: §/api/productos§, no §/api/obtenerProductos§.
- **Los verbos HTTP dicen la acción.** §GET§ lee, §POST§ crea o ejecuta una acción, §PUT§ reemplaza los datos de un recurso, §PATCH§ cambia solo una parte y §DELETE§ elimina.
- **Sin estado (stateless).** El servidor no recuerda quién eres entre una petición y la siguiente. Cada petición trae todo lo necesario. Por eso más adelante la identidad viajará dentro de un token JWT en cada petición.
- **Representaciones.** El cliente y el servidor intercambian una representación del recurso, casi siempre JSON.
- **Códigos de estado.** La respuesta empieza con un número que resume el resultado.

| Código | Significado | Dónde lo usaremos |
|---|---|---|
| 200 OK | La petición funcionó y hay contenido | Consultas y actualizaciones |
| 201 Created | Se creó un recurso, con su URL en la cabecera §Location§ | Todos los POST que crean |
| 204 No Content | Funcionó y no hay nada que devolver | DELETE |
| 400 Bad Request | La petición está mal formada o no pasa la validación | Datos inválidos |
| 401 y 403 | No identificado y sin permiso | Material de JWT |
| 404 Not Found | El recurso no existe | Id inexistente |
| 409 Conflict | Choca con el estado actual | SKU repetido, stock insuficiente |
| 422 Unprocessable Content | Datos bien formados que incumplen una regla de negocio | Precio negativo |
| 500 Internal Server Error | Falló algo inesperado en el servidor | Errores no controlados |

> [info] Un método es **seguro** si no cambia nada en el servidor (GET) y es **idempotente** si repetirlo da el mismo resultado final (GET, PUT, DELETE). POST no es idempotente: dos POST iguales crean dos pedidos. Esa diferencia importa cuando una petición se reintenta por una falla de red.

Estas son las entidades que guardaremos. Las líneas indican relaciones: **1** a **N** significa que un registro de un lado se relaciona con muchos del otro. Usuario aparece punteado porque se crea en el paso 17 como preparación para JWT.

# La arquitectura en capas

El código se reparte en cuatro proyectos. La regla de oro es la **dirección de las dependencias**: las capas internas no conocen a las externas.

::diagram capas
::

- **Domain** contiene las entidades y sus reglas. No depende de nada: ni de la base de datos, ni de ASP.NET, ni de EF Core. Es el corazón del negocio.
- **Application** define los casos de uso (servicios) y los **contratos** (interfaces) que necesita, por ejemplo "un repositorio de productos". Depende solo de Domain.
- **Infrastructure** implementa esos contratos con tecnología concreta: EF Core y PostgreSQL. Si mañana cambias de base de datos, solo cambia esta capa.
- **Api** recibe las peticiones HTTP, llama a los servicios y devuelve respuestas. También es el **raíz de composición**: el único lugar donde se conectan las interfaces con sus implementaciones.

> [oop Inversión de dependencias] Application declara la interfaz §IProductoRepositorio§ y Infrastructure la implementa. Es la capa de arriba (de negocio) la que dicta el contrato y la capa de abajo (técnica) la que se adapta. El proyecto Domain ni siquiera tiene una referencia a EF Core, así que es imposible mezclar la lógica de negocio con la base de datos por descuido: el compilador lo impide.

# Mapa de principios de POO

Este material no enseña POO en abstracto: la usa para resolver problemas reales. Esta tabla te indica dónde aparece cada principio. En cada paso verás recuadros morados con el principio que se está aplicando.

| Principio | Qué significa | Dónde lo verás | Pasos |
|---|---|---|---|
| Abstracción | Modelar solo lo relevante y esconder el detalle | Entidades del dominio, interfaces de repositorio | 4, 8 |
| Encapsulamiento | El estado solo cambia por métodos que lo protegen | Setters privados y reglas dentro de las entidades | 4, 5, 6 |
| Herencia | Reutilizar lo común en una clase base | §Entidad§, jerarquía de excepciones, §RepositorioBase§ | 4, 10 |
| Polimorfismo | Un mismo contrato, varias implementaciones | §IRepositorio§ y sus clases, §IExceptionHandler§ | 8, 10, 12 |
| Composición | Un objeto contiene a otros | §Pedido§ tiene §LineaPedido§, servicios reciben repositorios | 6, 15 |
| S: responsabilidad única | Una clase tiene una sola razón para cambiar | Una configuración por entidad, controladores delgados | 10, 12 |
| O: abierto y cerrado | Se extiende sin modificar lo que ya funciona | Nuevas excepciones o configuraciones sin tocar las existentes | 10, 12 |
| L: sustitución de Liskov | Una subclase puede usarse donde se espera la base | Repositorios específicos usados como §IRepositorio§ | 8, 10 |
| I: segregación de interfaces | Interfaces pequeñas y específicas | Un contrato por servicio y por repositorio | 8 |
| D: inversión de dependencias | Depender de abstracciones | Servicios que reciben interfaces por constructor | 8, 10, 12 |

# Teoría

- **Solución (solution).** Es un contenedor que agrupa proyectos para compilarlos juntos. En .NET 10, §dotnet new sln§ crea un archivo **§.slnx§**, un formato XML corto y legible que reemplaza al antiguo §.sln§. Si necesitas el viejo, se pide con §--format sln§.
- **Proyecto.** Cada carpeta con un archivo **§.csproj§**. Un proyecto se compila en un **ensamblado** (un §.dll§). El §.csproj§ es XML y declara el tipo de proyecto, la versión de .NET y sus dependencias.
- **Referencia de proyecto.** Un proyecto puede usar los tipos públicos de otro solo si declara una referencia. Eso es lo que hace cumplir la regla de dependencias que viste en el paso 0.
- **Paquete NuGet.** Una librería externa que se descarga y se referencia por nombre y versión.
- **Target Framework Moniker (TFM).** §net10.0§ indica que el proyecto se compila para .NET 10.

> [oop Encapsulamiento] Los modificadores de acceso funcionan en dos niveles. §private§ protege los miembros dentro de una clase. §internal§ protege los tipos dentro de un proyecto: una clase §internal§ de Application es invisible para Api. La frontera de un proyecto es la forma más fuerte de encapsulamiento que existe, y la usaremos para esconder detalles que nadie fuera de la capa necesita ver.

## Centralizar la configuración común

Los cinco proyectos comparten ajustes. En vez de repetirlos en cada §.csproj§, créalos una vez en un archivo §Directory.Build.props§ en la raíz. MSBuild lo lee automáticamente para todos los proyectos que estén debajo.

::code xml nuevo Directory.Build.props
<Project>

  <PropertyGroup>
    <TargetFramework>net10.0</TargetFramework>
    <LangVersion>14</LangVersion>
    <Nullable>enable</Nullable>
    <ImplicitUsings>enable</ImplicitUsings>
  </PropertyGroup>

</Project>
::

- §LangVersion 14§ fija C# 14. Con .NET 10 ya es el valor por defecto, pero escribirlo hace explícita la decisión.
- §Nullable enable§ activa el análisis de nulos: el compilador avisa cuando algo que puede ser §null§ se usa sin comprobar. Evita la mayoría de los errores de referencia nula.
- §ImplicitUsings enable§ agrega automáticamente los §using§ más comunes (§System§, §System.Linq§, §System.Collections.Generic§...), así que no los repetiremos en cada archivo.

Las plantillas ya traían estas propiedades dentro de cada §.csproj§. Si quedan repetidas no pasa nada, pero conviene limpiar las tres bibliotecas de clases para que hereden todo del archivo común. Reemplaza el contenido completo de cada uno de estos tres archivos: §src/Tienda.Domain/Tienda.Domain.csproj§, §src/Tienda.Application/Tienda.Application.csproj§ y §src/Tienda.Infrastructure/Tienda.Infrastructure.csproj§.

<Project Sdk="Microsoft.NET.Sdk" />

# Teoría

## Cómo arranca una aplicación ASP.NET Core

Una API web es un programa de consola que levanta un servidor HTTP. El servidor se llama **Kestrel** y viene incluido. Todo el arranque está en un único archivo, §Program.cs§, que tiene dos fases:

1. **Construir (builder).** Con §WebApplication.CreateBuilder(args)§ se obtiene un constructor donde se **registran servicios** (§builder.Services§) y se lee la **configuración** (§builder.Configuration§).
2. **Armar el pipeline (app).** Con §builder.Build()§ se obtiene la aplicación, y sobre ella se declara el **pipeline de middleware**: la cadena de pasos por la que pasa cada petición.

## El pipeline de middleware

Un **middleware** es un componente que recibe la petición, hace algo, y decide si pasarla al siguiente. Cuando el último termina, la respuesta regresa por el mismo camino. **El orden en el que los declaras es el orden en el que se ejecutan**, y por eso importa tanto. Este es el pipeline que tendrá la API al final del material:

::diagram pipeline
::

## Inyección de dependencias (DI)

Una clase casi nunca crea los objetos que necesita: los **recibe**. ASP.NET Core trae un **contenedor de DI**. Tú registras "cuando alguien pida §IProductoRepositorio§, entrega un §ProductoRepositorio§", y el framework construye los objetos y los entrega por el constructor. Cada servicio se registra con un **ciclo de vida**:

| Ciclo de vida | Cuándo se crea | Úsalo para |
|---|---|---|
| Singleton | Una vez para toda la aplicación | Cachés, configuración, servicios sin estado |
| Scoped | Una vez por petición HTTP | DbContext, repositorios, servicios de aplicación |
| Transient | Cada vez que se pide | Objetos ligeros y sin estado |

> [oop Inversión de dependencias] Un controlador que declara §IHostEnvironment entorno§ en su constructor no sabe ni le importa quién lo creó ni cómo. Depende de una **abstracción**. En las pruebas puedes entregarle una versión falsa, y en producción la real. Esta técnica atraviesa todo el proyecto.

## Configuración por capas

La configuración se lee de varias fuentes, y las últimas ganan sobre las primeras: §appsettings.json§ (valores base), §appsettings.{Entorno}.json§ (ajustes del entorno), **user-secrets** (secretos de tu máquina, que usaremos en el paso 9), variables de entorno y argumentos de línea de comandos. El entorno actual está en la variable §ASPNETCORE_ENVIRONMENT§ (§Development§, §Staging§, §Production§).

## Controladores y rutas

Un **controlador** es una clase que hereda de §ControllerBase§. Sus métodos públicos marcados con §[HttpGet]§, §[HttpPost]§ y similares son los **endpoints**. El atributo §[ApiController]§ activa comportamientos útiles: respuesta 400 automática si la validación falla, lectura del cuerpo JSON sin atributos extra y más. La ruta §api/[controller]§ usa el nombre de la clase sin la palabra "Controller".

> [oop Herencia] §ControllerBase§ ya sabe leer la petición, construir respuestas (§Ok()§, §NotFound()§, §CreatedAtAction()§) y acceder al usuario. Tu controlador hereda todo eso y solo agrega lo que lo hace único.

## OpenAPI y Scalar

**OpenAPI** es un estándar para describir una API en un documento JSON: rutas, parámetros, formas de los datos. .NET 10 genera ese documento con el paquete §Microsoft.AspNetCore.OpenApi§, ya incluido en la plantilla. **Scalar** es una interfaz web que lee ese documento y te deja probar la API desde el navegador. Es un paquete de terceros que sustituye a Swagger UI, que la plantilla ya no incluye.

# Teoría

## Qué es el dominio

El **dominio** es el problema del negocio que resuelve el software: en una tienda, productos con precio y existencias, clientes, pedidos que se pagan o se cancelan. El **modelo de dominio** son las clases que representan esos conceptos y **las reglas que los gobiernan**. Una regla de negocio es, por ejemplo, "no se puede vender más unidades de las que hay en stock" o "un producto no puede tener precio negativo".

Hay dos maneras de escribir un modelo:

- **Modelo anémico:** las clases son bolsas de datos con propiedades públicas, y las reglas viven dispersas en servicios. Es fácil de escribir, pero cualquier parte del código puede dejar un objeto en un estado inválido, por ejemplo con §producto.Precio = -5§.
- **Modelo rico:** las clases guardan su estado de forma privada y exponen **métodos con nombre de negocio** (§CambiarPrecio§, §ReducirStock§) que validan antes de cambiar nada. Un objeto nunca está en estado inválido.

Este material construye un **modelo rico**, porque es la forma más directa de ver encapsulamiento en acción.

> [oop Encapsulamiento] Encapsular no es solo poner §private§ a los campos. Es garantizar los **invariantes** del objeto: condiciones que siempre deben ser verdaderas (un producto siempre tiene precio mayor que cero). Se logra con tres piezas: estado privado, constructor que valida, y métodos que cambian el estado validando. Quien use la clase no puede romper el invariante aunque quiera.

## Entidad y objeto de valor

- Una **entidad** tiene identidad propia: dos productos con el mismo nombre y precio siguen siendo productos distintos si tienen **Id** distinto. Sus datos pueden cambiar y sigue siendo el mismo.
- Un **objeto de valor** no tiene identidad: se define por sus datos. Dos direcciones con la misma calle y ciudad son intercambiables. Lo verás con §Direccion§ en el paso 6.

## Por qué una clase base abstracta

Todas las entidades necesitan un §Id§ y fechas de auditoría. En lugar de repetir esas propiedades en cada clase, se declaran una vez en una clase base. Se marca §abstract§ porque no tiene sentido crear "una entidad" a secas: solo existen productos, clientes, pedidos. El compilador impide hacer §new Entidad()§.

> [oop Herencia] La herencia se justifica cuando existe una relación "es un" genuina: un producto **es una** entidad. Úsala para compartir comportamiento común que de verdad es común. Si solo quieres reutilizar código sin esa relación, la composición suele ser mejor.

## Excepciones de negocio

Cuando se rompe una regla, el dominio lanza una **excepción**. Creamos una jerarquía propia en vez de usar §Exception§ directamente, para que la capa de la API pueda decidir el código HTTP según el **tipo** del error, sin leer el texto del mensaje.

| Excepción | Cuándo se lanza | Código HTTP que le asignaremos |
|---|---|---|
| ReglaDeNegocioException | Un dato incumple una regla (precio negativo, nombre vacío) | 422 |
| NoEncontradoException | Se pidió algo que no existe | 404 |
| ConflictoException | La operación choca con el estado actual (SKU repetido) | 409 |
| StockInsuficienteException | Caso particular de conflicto: no hay existencias | 409 |

El dominio **no sabe nada de HTTP**. Solo describe qué pasó. Traducirlo a un código es responsabilidad de la capa Api (paso 12).

## El ayudante Guard

Validar texto y números se repetirá en muchas entidades. §Guard§ concentra esa lógica en un solo lugar (responsabilidad única) y las entidades solo lo invocan.

::code csharp nuevo src/Tienda.Domain/Common/Guard.cs
using Tienda.Domain.Exceptions;

namespace Tienda.Domain.Common;

public static class Guard
{
    public static string TextoRequerido(string? valor, string campo, int longitudMaxima)
    {
        if (string.IsNullOrWhiteSpace(valor))
            throw new ReglaDeNegocioException($"{campo} es obligatorio.");

        var limpio = valor.Trim();
        if (limpio.Length > longitudMaxima)
            throw new ReglaDeNegocioException($"{campo} no puede superar {longitudMaxima} caracteres.");

        return limpio;
    }

    public static string? TextoOpcional(string? valor, string campo, int longitudMaxima) =>
        string.IsNullOrWhiteSpace(valor) ? null : TextoRequerido(valor, campo, longitudMaxima);

    public static decimal MayorQueCero(decimal valor, string campo) =>
        valor > 0 ? valor : throw new ReglaDeNegocioException($"{campo} debe ser mayor que cero.");

    public static int MayorQueCero(int valor, string campo) =>
        valor > 0 ? valor : throw new ReglaDeNegocioException($"{campo} debe ser mayor que cero.");

    public static int NoNegativo(int valor, string campo) =>
        valor >= 0 ? valor : throw new ReglaDeNegocioException($"{campo} no puede ser negativo.");
}
::

- §static class§ no se puede instanciar ni heredar: solo agrupa métodos que no necesitan estado.
- El parámetro §string? valor§ acepta nulos. Tras la comprobación §IsNullOrWhiteSpace§ el compilador **sabe** que ya no es nulo, y por eso §valor.Trim()§ no genera aviso.
- §throw§ también puede usarse como **expresión** dentro de un operador ternario (§cond ? valor : throw ...§).
- §MayorQueCero§ existe en dos versiones (§decimal§ e §int§). Es **sobrecarga**: C# elige la correcta según el tipo del argumento.

{

# Teoría

## Qué modelamos y qué dejamos fuera

Modelar es elegir. Un producto real tiene color, peso, fotos, proveedores y cien datos más. Para esta API solo importan los que participan en reglas o en consultas: nombre, SKU, precio, stock, si está activo y a qué categoría pertenece. Esto es **abstracción**: quedarse con lo esencial y descartar el resto.

> [oop Abstracción] Una buena abstracción responde a "¿qué necesita saber el sistema de esto?", no a "¿qué características tiene en la realidad?". Si mañana la tienda necesita el peso para calcular envíos, se agrega entonces. Un modelo con datos que nadie usa es ruido que hay que mantener.

## Reglas del catálogo

- El nombre de una categoría y de un producto es obligatorio y tiene un largo máximo.
- El **SKU** (código interno único del producto) es obligatorio y se guarda en mayúsculas.
- El precio siempre es mayor que cero. El stock nunca es negativo.
- Un producto no se borra: se **desactiva**. Los pedidos antiguos lo siguen necesitando, y esto se llama **borrado lógico**.
- No se puede vender más de lo que hay en stock.

## Dinero: decimal y no double

Los tipos §float§ y §double§ guardan números en binario y no pueden representar con exactitud valores como 0,1. Sumar 0,1 tres veces da 0,30000000000000004. Para dinero se usa siempre **§decimal§**, que trabaja en base diez y no pierde centavos.

| Tipo | Sirve para | Ejemplo del problema |
|---|---|---|
| double | Mediciones científicas, gráficos | 0.1 + 0.2 da 0.30000000000000004 |
| decimal | Dinero y cantidades exactas | 0.1m + 0.2m da exactamente 0.3 |

## El constructor privado sin parámetros

Entity Framework reconstruye un objeto leído de la base de datos usando reflexión. Necesita un constructor que pueda llamar sin datos. Si lo declaras §private§, EF puede usarlo pero el resto del código no: **nadie puede crear un producto vacío e inválido**. El único constructor público es el que valida.

> [info] El operador §null!§ en §= null!§ le dice al compilador "confía en mí, esto no será nulo". Se usa en propiedades que EF llenará al leer de la base de datos. Se escribe una sola vez en el constructor privado; el público siempre las asigna.

## Propiedades de navegación

§Categoria? Categoria§ en §Producto§ es una **propiedad de navegación**: permite pasar de un producto a su categoría sin escribir una consulta. §CategoriaId§ es la **clave foránea**: el número que se guarda en la base de datos. EF mantiene sincronizadas las dos. Es nulable (§?§) porque no siempre se carga la categoría junto con el producto.

public class StockInsuficienteException(string producto, int solicitado, int disponible)
    : ConflictoException($"Stock insuficiente de '{producto}': se pidieron {solicitado} y quedan {disponible}.")
{
    public string Producto { get; } = producto;
    public int Solicitado { get; } = solicitado;
    public int Disponible { get; } = disponible;
}
::

Es una subclase de una subclase: §StockInsuficienteException§ **es una** §ConflictoException§, que **es una** §ExcepcionDeDominio§, que **es una** §Exception§. Un bloque §catch (ConflictoException)§ la atrapa también. Eso es polimorfismo por herencia, y lo aprovecharemos en el manejo de errores.

using Tienda.Domain.Common;
using Tienda.Domain.Exceptions;

namespace Tienda.Domain.Entities;

public class Producto : Entidad
{
    public const int LongitudMaximaNombre = 150;
    public const int LongitudMaximaSku = 40;
    public const int LongitudMaximaDescripcion = 1000;

    private Producto() { }

    public Producto(string nombre, string sku, decimal precio, int stock, int categoriaId, string? descripcion = null)
    {
        Sku = Guard.TextoRequerido(sku, "El SKU", LongitudMaximaSku).ToUpperInvariant();
        Precio = Guard.MayorQueCero(precio, "El precio");
        Stock = Guard.NoNegativo(stock, "El stock");
        Activo = true;
        ActualizarDatos(nombre, descripcion, categoriaId);
    }

    public string Nombre { get; private set; } = null!;

    public string Sku { get; private set; } = null!;

    public string? Descripcion { get; private set; }

    public decimal Precio { get; private set; }

    public int Stock { get; private set; }

    public bool Activo { get; private set; }

    public int CategoriaId { get; private set; }

    public Categoria? Categoria { get; private set; }

    public void ActualizarDatos(string nombre, string? descripcion, int categoriaId)
    {
        Nombre = Guard.TextoRequerido(nombre, "El nombre", LongitudMaximaNombre);
        Descripcion = Guard.TextoOpcional(descripcion, "La descripción", LongitudMaximaDescripcion);
        CategoriaId = Guard.MayorQueCero(categoriaId, "La categoría");
    }

    public void CambiarPrecio(decimal nuevoPrecio)
    {
        Precio = Guard.MayorQueCero(nuevoPrecio, "El precio");
    }

    public void AumentarStock(int cantidad)
    {
        Stock += Guard.MayorQueCero(cantidad, "La cantidad");
    }

    public void ReducirStock(int cantidad)
    {
        Guard.MayorQueCero(cantidad, "La cantidad");

        if (cantidad > Stock)
            throw new StockInsuficienteException(Nombre, cantidad, Stock);

        Stock -= cantidad;
    }

    public void Activar() => Activo = true;

    public void Desactivar() => Activo = false;
}
::

Cómo leerlo:

- Todas las propiedades tienen §private set§. La **única** forma de cambiar el precio es §CambiarPrecio§, que valida antes. No existe ninguna forma de dejar el producto con precio cero.
- §descripcion = null§ es un **parámetro opcional**: se puede llamar al constructor sin ese argumento.
- §ToUpperInvariant()§ pasa a mayúsculas sin depender del idioma del equipo (el "invariante de cultura" evita sorpresas, por ejemplo con la letra i en turco).
- §ReducirStock§ primero valida que la cantidad sea positiva y luego que alcance. Si no alcanza lanza §StockInsuficienteException§ **sin tocar** el stock: la operación es todo o nada.
- Los nombres de los métodos hablan el lenguaje del negocio (§Desactivar§, §ReducirStock§), no el de la base de datos (§SetActivo§, §UpdateStock§).

> [oop Encapsulamiento] Compara con el modelo anémico, donde §Stock§ sería un número público que cualquiera modifica. Allí la regla "no vender más de lo que hay" tendría que repetirse en cada lugar que toque el stock, y bastaría un olvido para venderlo de menos. Aquí la regla vive **una sola vez, dentro de §ReducirStock§**, y es imposible esquivarla.

# Teoría

## Objetos de valor y records

**Dirección** es un objeto de valor: no tiene identidad, se define por sus datos. Se modela mejor como un **record**, un tipo de C# pensado para eso. Un record recibe en un solo renglón sus propiedades, es **inmutable** (no cambia después de crearse), compara por **valor** (dos records con los mismos datos son iguales) y permite crear copias modificadas con §with§.

| | class | record |
|---|---|---|
| Igualdad (§==§, §Equals§) | Por referencia: son iguales solo si son el mismo objeto | Por valor: son iguales si todos sus datos coinciden |
| Uso típico | Entidades con identidad y comportamiento | Valores y datos que viajan (DTOs) |
| Copia con cambios | Manual | §direccion with { Ciudad = "Cali" }§ |

> [oop Abstracción] No toda cosa que modelas necesita identidad. Distinguir entidad de objeto de valor simplifica el diseño: los valores no se rastrean ni se actualizan, se **reemplazan** por otro valor.

## El pedido como agregado

Un pedido y sus líneas forman una unidad. Una línea no existe sin su pedido, y nadie debería modificar una línea por su cuenta, porque eso podría dejar el total incoherente. Por eso el pedido es la **raíz del agregado**: toda operación sobre las líneas pasa por él.

Esto se logra con tres decisiones de código:

- La lista de líneas es **privada** (§_lineas§). Hacia afuera solo se expone como §IReadOnlyCollection§, que se puede recorrer pero no modificar.
- El constructor de §LineaPedido§ es §internal§: solo el código dentro del proyecto Domain puede crear líneas, y el único que lo hace es §Pedido§.
- §Total§ no se guarda: se **calcula** a partir de las líneas cada vez. Así nunca puede quedar desfasado.

> [oop Composición] La relación entre §Pedido§ y §LineaPedido§ es composición: el pedido **tiene** líneas y es dueño de su ciclo de vida. Si se borra el pedido, desaparecen sus líneas. En cambio el pedido **no contiene** al cliente, solo guarda su §ClienteId§: el cliente existe por sí mismo. Entre agregados distintos se referencia por identificador, no por objeto.

## Copia del nombre y del precio

§LineaPedido§ guarda §NombreProducto§ y §PrecioUnitario§ copiados del producto en el momento de la compra. Si luego el producto sube de precio, el pedido ya hecho no cambia. Este patrón se llama **instantánea** (snapshot) y es la forma correcta de guardar históricos.

## El ciclo de vida del pedido

Un pedido pasa por estados y solo algunos cambios son válidos. Esto se llama **máquina de estados**, y se implementa con un enum y métodos que comprueban el estado actual antes de actuar.

| Desde | Acción | Resultado | Efecto en el stock |
|---|---|---|---|
| Pendiente | AgregarLinea | Sigue Pendiente | Descuenta las unidades |
| Pendiente | MarcarComoPagado | Pagado | Ninguno |
| Pendiente | Cancelar | Cancelado | Devuelve las unidades |
| Pagado o Cancelado | Cualquier acción | Error 409 | Ninguno |

Para estos errores usamos §ConflictoException§ (409): la petición es válida, pero choca con el estado actual del pedido.

::code csharp nuevo src/Tienda.Domain/Entities/Cliente.cs
using Tienda.Domain.Common;
using Tienda.Domain.Exceptions;

namespace Tienda.Domain.Entities;

public class Cliente : Entidad
{
    public const int LongitudMaximaNombre = 120;
    public const int LongitudMaximaEmail = 200;
    public const int LongitudMaximaTelefono = 30;

    private Cliente() { }

    public Cliente(string nombre, string email, string? telefono, Direccion direccion)
    {
        Email = NormalizarEmail(email);
        ActualizarDatos(nombre, telefono, direccion);
    }

    public string Nombre { get; private set; } = null!;

    public string Email { get; private set; } = null!;

    public string? Telefono { get; private set; }

    public Direccion Direccion { get; private set; } = null!;

    public void ActualizarDatos(string nombre, string? telefono, Direccion direccion)
    {
        Nombre = Guard.TextoRequerido(nombre, "El nombre", LongitudMaximaNombre);
        Telefono = Guard.TextoOpcional(telefono, "El teléfono", LongitudMaximaTelefono);
        Direccion = ValidarDireccion(direccion);
    }

    private static string NormalizarEmail(string email)
    {
        var limpio = Guard.TextoRequerido(email, "El correo", LongitudMaximaEmail).ToLowerInvariant();
        var arroba = limpio.IndexOf('@');

        if (arroba <= 0 || arroba != limpio.LastIndexOf('@') || !limpio[(arroba + 1)..].Contains('.'))
            throw new ReglaDeNegocioException("El correo no tiene un formato válido.");

        return limpio;
    }

    private static Direccion ValidarDireccion(Direccion? direccion)
    {
        ArgumentNullException.ThrowIfNull(direccion);

        return new Direccion(
            Guard.TextoRequerido(direccion.Linea, "La dirección", Direccion.LongitudMaximaLinea),
            Guard.TextoRequerido(direccion.Ciudad, "La ciudad", Direccion.LongitudMaximaCiudad),
            Guard.TextoRequerido(direccion.Departamento, "El departamento", Direccion.LongitudMaximaDepartamento),
            Guard.TextoRequerido(direccion.CodigoPostal, "El código postal", Direccion.LongitudMaximaCodigoPostal));
    }
}
::

- El correo se normaliza a minúsculas para que §Ana@Correo.com§ y §ana@correo.com§ sean la misma persona. La validación es sencilla a propósito: exactamente una arroba, algo antes y un punto después. Verificar que el buzón exista solo se logra enviando un mensaje.
- §limpio[(arroba + 1)..]§ es un **rango**: toma el texto desde la posición siguiente a la arroba hasta el final.
- Dentro de §Cliente§, el nombre §Direccion§ designa a la vez la propiedad y el tipo. C# lo permite cuando coinciden; §Direccion.LongitudMaximaLinea§ se resuelve como el tipo.
- §ValidarDireccion§ devuelve una dirección nueva con los textos limpios (sin espacios sobrantes), en vez de modificar la recibida: los records son inmutables.
- §ArgumentNullException.ThrowIfNull§ lanza una excepción clara si alguien pasa §null§ por error de programación (no es una regla de negocio, es un bug).

## La entidad Pedido

::code csharp nuevo src/Tienda.Domain/Entities/Pedido.cs
using Tienda.Domain.Common;
using Tienda.Domain.Exceptions;

namespace Tienda.Domain.Entities;

public class Pedido : Entidad
{
    private readonly List<LineaPedido> _lineas = [];

    private Pedido() { }

    public Pedido(int clienteId)
    {
        ClienteId = Guard.MayorQueCero(clienteId, "El cliente");
        Estado = EstadoPedido.Pendiente;
    }

    public int ClienteId { get; private set; }

    public EstadoPedido Estado { get; private set; }

    public IReadOnlyCollection<LineaPedido> Lineas => _lineas;

    public decimal Total => _lineas.Sum(l => l.Subtotal);

    public void AgregarLinea(Producto producto, int cantidad)
    {
        ArgumentNullException.ThrowIfNull(producto);
        ExigirEstado(EstadoPedido.Pendiente, "agregar productos a");

        if (!producto.Activo)
            throw new ReglaDeNegocioException($"El producto '{producto.Nombre}' no está disponible.");

        producto.ReducirStock(cantidad);

        var existente = _lineas.FirstOrDefault(l => l.Producto == producto);
        if (existente is null)
            _lineas.Add(new LineaPedido(producto, cantidad));
        else
            existente.AumentarCantidad(cantidad);
    }

    public void MarcarComoPagado()
    {
        ExigirEstado(EstadoPedido.Pendiente, "pagar");

        if (_lineas.Count == 0)
            throw new ReglaDeNegocioException("Un pedido sin productos no se puede pagar.");

        Estado = EstadoPedido.Pagado;
    }

    public void Cancelar()
    {
        ExigirEstado(EstadoPedido.Pendiente, "cancelar");

        foreach (var linea in _lineas)
        {
            var producto = linea.Producto
                ?? throw new InvalidOperationException("Carga los productos de las líneas antes de cancelar el pedido.");
            producto.AumentarStock(linea.Cantidad);
        }

        Estado = EstadoPedido.Cancelado;
    }

    private void ExigirEstado(EstadoPedido esperado, string accion)
    {
        if (Estado != esperado)
            throw new ConflictoException($"No se puede {accion} un pedido en estado {Estado}.");
    }
}
::

Puntos para leer con calma:

- §private readonly List<LineaPedido> _lineas = [];§ usa una **expresión de colección** (§[]§, C# 12) para crear la lista vacía. §readonly§ significa que la variable no se puede reasignar; la lista sí puede cambiar por dentro.
- §IReadOnlyCollection<LineaPedido> Lineas => _lineas;§ devuelve la misma lista, pero vista como solo lectura. Desde fuera no existe §Lineas.Add(...)§.
- §AgregarLinea§ primero valida estado y disponibilidad, **después** descuenta stock y por último modifica las líneas. Ninguna validación ocurre después de un cambio, de modo que un error nunca deja el pedido a medias.
- §l.Producto == producto§ compara **referencias**: es el mismo objeto. Dentro de una misma operación, Entity Framework entrega siempre la misma instancia para un mismo producto, así que sirve para detectar que la línea ya existe y sumar la cantidad en lugar de repetirla.
- En §Cancelar§ el operador §??§ con §throw§ significa "usa el valor, y si es nulo lanza esta excepción". Cancelar necesita los productos para devolverles el stock; si no se cargaron, es un error del programador (§InvalidOperationException§) y no una regla de negocio.
- §Estado§ en el mensaje de §ExigirEstado§ se imprime con el nombre del valor del enum ("Pagado").

> [oop Encapsulamiento] Observa que el agregado protege **colecciones** además de valores sueltos. Si §Lineas§ devolviera una §List§ pública, cualquier código podría agregar una línea sin descontar stock. Exponer una vista de solo lectura y obligar a pasar por §AgregarLinea§ es lo que mantiene el invariante "el stock siempre refleja los pedidos".

# Teoría

## Para qué sirven las pruebas unitarias

Una **prueba unitaria** es un pequeño programa que ejecuta una pieza de código con datos conocidos y comprueba que el resultado es el esperado. Te dan tres cosas: confianza para cambiar el código sin miedo a romper algo, una especificación ejecutable de las reglas del negocio y un diagnóstico inmediato cuando algo falla.

Las pruebas del dominio son las más baratas y rápidas de escribir, porque el dominio no depende de nada externo: se ejecutan en milisegundos, sin base de datos y sin servidor.

## Cómo se escribe una prueba

- Cada prueba es un método marcado con **§[Fact]§** (una prueba con datos fijos) o **§[Theory]§** con **§[InlineData(...)]§** (la misma prueba repetida con varios datos).
- Todas siguen el patrón **Preparar, Actuar, Comprobar** (en inglés *Arrange, Act, Assert*): armar los objetos, ejecutar la operación y verificar el resultado con métodos §Assert§.
- El nombre dice qué se prueba y qué se espera: §Metodo_Condicion_Resultado§. Cuando una prueba falla, el nombre ya te dice qué regla se rompió.

| Verificación | Qué comprueba |
|---|---|
| §Assert.Equal(esperado, actual)§ | Que dos valores sean iguales |
| §Assert.True(condicion)§ | Que algo sea verdadero |
| §Assert.Throws<T>(accion)§ | Que se lance una excepción **exactamente** del tipo T |
| §Assert.ThrowsAny<T>(accion)§ | Que se lance T **o cualquier subclase** de T |
| §Assert.Empty(coleccion)§ | Que una colección no tenga elementos |

> [oop Polimorfismo] §Assert.Throws<ConflictoException>§ **fallaría** si se lanza una §StockInsuficienteException§, porque pide el tipo exacto. §Assert.ThrowsAny<ConflictoException>§ pasa, porque una subclase puede usarse donde se espera la base. Esa es la sustitución de Liskov expresada en una prueba.

# Teoría

## Qué hace la capa Application

La capa **Application** contiene los **casos de uso**: "crear un pedido", "cambiar el precio de un producto", "buscar productos por texto". Cada caso de uso es una pequeña secuencia: buscar lo que se necesita, pedirle al dominio que haga el trabajo y guardar. Esa secuencia se escribe en **servicios de aplicación**. Los servicios no contienen reglas de negocio (esas viven en las entidades) ni detalles técnicos (esos viven en Infrastructure): solo **coordinan**.

Para buscar y guardar, un servicio necesita acceso a datos, pero no debe saber que existe PostgreSQL. Por eso Application declara **interfaces** que describen lo que necesita y deja que otra capa las implemente.

## Interfaz: un contrato sin implementación

Una **interfaz** lista métodos sin cuerpo. Quien la implemente se **compromete** a ofrecer todos. Quien la use solo conoce el contrato.

> [oop Inversión de dependencias] Sin inversión, el flujo sería: servicio de negocio, depende de repositorio de EF Core, depende de PostgreSQL. Lo de abajo dicta las reglas a lo de arriba. Con inversión, el servicio depende de §IProductoRepositorio§, **una interfaz que pertenece a su misma capa**, y es el repositorio de EF el que depende de ella para implementarla. La flecha se invierte. Resultado: puedes cambiar PostgreSQL por MySQL, o por una lista en memoria para pruebas, sin tocar ni una línea de los servicios.

## Patrón repositorio

Un **repositorio** simula una colección de entidades en memoria: se le pide una por su id, se le agrega una, se le quita una. Esconde por completo cómo se guarda. El contrato general es §IRepositorio<T>§, y cada entidad con consultas propias lo **extiende** con una interfaz específica.

- **§IRepositorio<T> where T : Entidad§** es una interfaz **genérica**: §T§ es un tipo que se indica al usarla. La restricción §where T : Entidad§ exige que §T§ sea una entidad del dominio, así que §IRepositorio<string>§ no compila.
- **§IProductoRepositorio : IRepositorio<Producto>§** hereda todo el contrato general y añade lo propio de productos, como buscar con filtros.

> [oop Sustitución de Liskov] Cualquier código que espere un §IRepositorio<Producto>§ puede recibir un §IProductoRepositorio§ y funcionar igual, porque este es una extensión del anterior. Una subinterfaz o subclase nunca debe romper lo que prometió la base: solo agregar.

> [oop Segregación de interfaces] En lugar de un único §IRepositorio§ gigante con métodos para productos, pedidos y clientes, hay contratos pequeños y específicos. Un servicio de categorías no está obligado a depender de métodos de pedidos que nunca usará.

## Unidad de trabajo

Los repositorios **no guardan** por sí mismos. Solo agregan o quitan cosas en memoria. Quien decide cuándo grabar es la **unidad de trabajo** (§IUnidadDeTrabajo§) con su método §GuardarCambiosAsync§. Así, un caso de uso como "crear un pedido" puede modificar un pedido, varios productos y una línea, y confirmarlo todo en **una sola transacción**: o se guarda todo o no se guarda nada.

## Programación asíncrona: async, await y Task

Leer de una base de datos tarda. Si el hilo que atiende la petición se queda esperando sin hacer nada, un servidor con muchas peticiones agota sus hilos rápidamente. Con **§async§/§await§** el hilo se libera mientras la base responde y vuelve a trabajar cuando hay resultado.

- Un método asíncrono devuelve §Task§ (sin resultado) o §Task<T>§ (con un resultado de tipo T).
- Por convención su nombre termina en **§Async§**.
- Se invoca con §await§: §var p = await repo.ObtenerPorIdAsync(5);§

## CancellationToken

Si el usuario cierra el navegador a mitad de una petición, seguir consultando la base es trabajo perdido. ASP.NET entrega un §CancellationToken§ que se activa cuando la petición se cancela. Si lo pasas hacia abajo por todos los métodos, la consulta a la base se interrumpe. Por eso **todos los métodos asíncronos del material lo reciben**, con valor por defecto para no estorbar.

namespace Tienda.Application.Comun;

public sealed record ResultadoPaginado<T>(IReadOnlyList<T> Items, int Pagina, int TamanoPagina, int Total)
{
    public int TotalPaginas => TamanoPagina <= 0 ? 0 : (int)Math.Ceiling(Total / (double)TamanoPagina);

    public ResultadoPaginado<TSalida> Transformar<TSalida>(Func<T, TSalida> convertir) =>
        new(Items.Select(convertir).ToList(), Pagina, TamanoPagina, Total);
}
::

Un listado de miles de productos nunca se devuelve completo: se entrega por **páginas**. Este record lleva los elementos de la página actual, el número de página, su tamaño y el total de elementos. §Transformar§ permite convertir una página de entidades en una página de DTOs reutilizando los mismos números, sin repetir el cálculo.

§FiltroProductos§ usa una novedad de **C# 14**: la palabra clave **§field§**. Dentro de un accessor, §field§ es el campo oculto que respalda la propiedad. Antes tenías que declarar a mano ese campo para poder añadir lógica. Aquí normaliza lo que llegue por la URL: la página nunca baja de 1 y el tamaño nunca pasa de 100.

::code csharp nuevo src/Tienda.Application/Productos/FiltroProductos.cs
namespace Tienda.Application.Productos;

public sealed record FiltroProductos
{
    public string? Texto { get; init; }

    public int? CategoriaId { get; init; }

    public decimal? PrecioMinimo { get; init; }

    public decimal? PrecioMaximo { get; init; }

    public bool SoloActivos { get; init; } = true;

    public int Pagina { get; init => field = Math.Max(1, value); } = 1;

    public int TamanoPagina { get; init => field = Math.Clamp(value, 1, 100); } = 20;
}
::

- §init§ permite asignar la propiedad al crear el objeto (por ejemplo, cuando ASP.NET lee la URL) pero no después.
- §{ get; init => field = ...; }§ mezcla un §get§ automático con un §init§ propio que valida. El valor inicial §= 1§ se asigna directamente al campo oculto.
- Los signos de interrogación (§int?§, §decimal?§) marcan filtros **opcionales**: si el cliente no los envía, valen §null§ y no se aplican.

# Teoría

## Qué es PostgreSQL y qué vamos a hacer con él

**PostgreSQL** es un sistema gestor de bases de datos relacional de código abierto. Es un **servidor**: un programa que queda escuchando en un **puerto** de red (el 5432 por defecto) y al que otros programas, como nuestra API, se conectan para guardar y leer datos.

Un servidor PostgreSQL puede contener varias **bases de datos**. Dentro de cada base hay **esquemas** (el predeterminado se llama §public§) y dentro de cada esquema están las **tablas**. El acceso se controla con **roles** (usuarios): cada rol tiene un nombre y una contraseña.

| Concepto | Analogía | En este proyecto |
|---|---|---|
| Servidor | El edificio | El contenedor §tienda-db§ |
| Base de datos | Un departamento del edificio | §tienda§ |
| Esquema | Una habitación | §public§ |
| Tabla | Un mueble con cajones | §productos§, §pedidos§... (se crean en el paso 11) |
| Rol | La llave de entrada | Usuario §tienda§ |

## Por qué Docker

Instalar PostgreSQL directamente en tu equipo funciona, pero cada aprendiz termina con una versión distinta, con rutas distintas y con restos de instalaciones anteriores. **Docker** resuelve eso con contenedores:

- Una **imagen** es un paquete inmutable con el programa y todo lo que necesita (por ejemplo §postgres:17§). Se descarga una vez.
- Un **contenedor** es una instancia en ejecución de una imagen: un proceso aislado, con su propio sistema de archivos. Se crea, se detiene y se destruye en segundos.
- Un **volumen** es una carpeta administrada por Docker que **sobrevive** aunque el contenedor se destruya. Ahí viven los datos de la base.
- El **mapeo de puertos** §5432:5432§ conecta el puerto 5432 de tu equipo con el puerto 5432 del contenedor. Se lee "puerto del equipo : puerto del contenedor".

**Docker Compose** permite describir uno o varios contenedores en un archivo de texto (§docker-compose.yml§) y levantarlos con un solo comando. Ese archivo se guarda en Git: quien clone el repositorio obtiene exactamente el mismo entorno.

> [info] Si prefieres no usar Docker, al final de este paso hay una alternativa con PostgreSQL instalado de forma nativa. El resto del material funciona igual con cualquiera de las dos.

## La cadena de conexión

Una **cadena de conexión** es un texto que le dice a la aplicación cómo llegar a la base de datos. Con el proveedor Npgsql tiene este formato:

| Parte | Significado | Valor aquí |
|---|---|---|
| Host | Dónde está el servidor | localhost |
| Port | Puerto de red | 5432 |
| Database | Base de datos a usar | tienda |
| Username | Rol que se conecta | tienda |
| Password | Contraseña del rol | La que definas en §.env§ |

## Secretos: lo que nunca se sube a Git

Una contraseña dentro del código o de un §appsettings.json§ versionado queda **para siempre** en el historial de Git, aunque la borres después. Cualquiera que pueda leer el repositorio la verá. Por eso se separan dos tipos de información:

- **Configuración**: lo que puede ser público (el nombre de la base, el puerto). Va en §appsettings.json§.
- **Secretos**: contraseñas, claves, tokens. Van **fuera** del repositorio.

En este material usamos dos mecanismos, cada uno en su lugar:

1. Un archivo §.env§ en la raíz, que lee Docker Compose y que **está en §.gitignore§**.
2. Los **secretos de usuario** de .NET (§dotnet user-secrets§), que guardan valores en una carpeta de tu perfil de usuario, fuera de la solución. ASP.NET Core los lee automáticamente en entorno §Development§.

> [ojo] Los secretos de usuario **no están cifrados**: solo están fuera del repositorio. Sirven para desarrollo. En un servidor real se usan variables de entorno o un almacén de secretos del proveedor de nube. La contraseña de este material (§tienda_dev_pw§) es solo para tu equipo de práctica; nunca uses una parecida en producción.

Cada línea es §NOMBRE=valor§, sin espacios alrededor del §=§ y sin comillas. Compose reemplazará esos nombres dentro del archivo YAML.

## Crear docker-compose.yml

También en la raíz del repositorio. En YAML **la sangría es parte de la sintaxis**: usa espacios (nunca tabuladores) y dos espacios por nivel.

::code yaml nuevo docker-compose.yml
services:
  db:
    image: postgres:17
    container_name: tienda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${'$'}{POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${'$'}{POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${'$'}{POSTGRES_DB:?Falta POSTGRES_DB en .env}
    ports:
      - "${'$'}{POSTGRES_PORT:-5432}:5432"
    volumes:
      - tienda-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${'$'}{POSTGRES_USER} -d ${'$'}{POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tienda-datos:
::

Línea por línea:

- §services§ lista los contenedores. Tenemos uno, llamado §db§.
- §image: postgres:17§ usa la imagen oficial, versión mayor 17. Fijar la versión evita que una actualización inesperada cambie el comportamiento.
- §container_name§ le da un nombre fijo, para escribir §docker exec tienda-db§ sin buscar identificadores.
- §restart: unless-stopped§ lo reinicia si el equipo se reinicia, salvo que tú lo hayas detenido.
- Las variables §POSTGRES_USER§, §POSTGRES_PASSWORD§ y §POSTGRES_DB§ son las que la imagen oficial lee **la primera vez** que arranca con el volumen vacío: crea ese rol y esa base.
- §${'$'}{NOMBRE:?mensaje}§ toma el valor de §.env§ y **aborta con el mensaje** si falta. §${'$'}{NOMBRE:-5432}§ usa 5432 si no está definida.
- §volumes§ dentro del servicio enlaza el volumen §tienda-datos§ con la carpeta donde PostgreSQL guarda sus archivos. El bloque §volumes§ del final declara ese volumen.
- §healthcheck§ ejecuta §pg_isready§ cada 5 segundos. Mientras PostgreSQL arranca el estado es §starting§; cuando responde pasa a §healthy§. Es la señal fiable de que ya puedes conectarte.

> [ojo] Si en tu equipo ya hay algo usando el puerto 5432 (por ejemplo otro PostgreSQL), Docker fallará con un error de puerto en uso. Solución: cambia §POSTGRES_PORT=5433§ en el §.env§. Entonces **también** debes usar 5433 en la cadena de conexión más abajo.

# Teoría

## Qué es un ORM y qué es Entity Framework Core

Las bases de datos relacionales guardan **filas en tablas**; el código orientado a objetos trabaja con **objetos con propiedades**. Pasar de uno a otro a mano (escribir SQL, leer columnas, armar objetos) es largo y repetitivo. Un **ORM** (Object-Relational Mapper) automatiza esa traducción. **Entity Framework Core** (EF Core) es el ORM oficial de .NET:

- Convierte consultas escritas en C# (LINQ) en SQL.
- Convierte filas en objetos y objetos en filas.
- Detecta qué cambió en los objetos y genera los §INSERT§, §UPDATE§ y §DELETE§ necesarios.
- Genera y aplica **migraciones**: scripts que crean y modifican las tablas (paso 11).

EF Core no habla con PostgreSQL directamente. Necesita un **proveedor**, un paquete que sabe hablar el dialecto de cada base. Para PostgreSQL es **Npgsql.EntityFrameworkCore.PostgreSQL**.

## Las piezas centrales

| Pieza | Qué es | Dónde la verás |
|---|---|---|
| DbContext | Una **sesión de trabajo** con la base. Consulta, rastrea cambios y guarda | §TiendaDbContext§ |
| DbSet<T> | Una "tabla" accesible desde C#, sobre la que se hacen consultas | §Productos§, §Pedidos§ |
| Change Tracker | Lista interna de objetos que el contexto conoce y de su estado (Added, Modified, Deleted, Unchanged) | Se usa al guardar |
| Fluent API | Código que describe cómo se mapea cada clase a su tabla | Las clases de configuración |
| Migración | Un archivo de C# que describe un cambio de esquema | Paso 11 |

El flujo básico de trabajo es siempre el mismo: **cargar** objetos, **modificarlos** con sus métodos de negocio y **guardar**. En el momento de guardar, el Change Tracker compara los objetos con la copia que tenía al cargarlos y emite solo el SQL necesario.

## Consultas con seguimiento y sin seguimiento

Por omisión, todo lo que lees queda **rastreado**: si luego cambias una propiedad, EF lo detectará al guardar. El seguimiento cuesta memoria y tiempo. Cuando solo vas a **mostrar** datos y no a modificarlos, se agrega §AsNoTracking()§ y la consulta es más liviana.

| Situación | Usar |
|---|---|
| Listar productos para mostrar en el catálogo | §AsNoTracking()§ |
| Cargar un producto para cambiarle el precio y guardar | Con seguimiento (por omisión) |
| Cargar un pedido para cancelarlo | Con seguimiento |

## Mapear sin ensuciar el dominio

Hay dos formas de decirle a EF cómo se guarda una clase:

1. **Atributos** sobre las propiedades (§[MaxLength(100)]§, §[Key]§). Es corto, pero el dominio pasa a depender de EF Core: tendría que referenciar su paquete.
2. **Fluent API** en clases de configuración dentro de Infrastructure. El dominio queda limpio y desconoce la base de datos.

Usamos la segunda. Es la consecuencia directa de la regla de dependencias del paso 2.

> [oop Responsabilidad única] Cada clase de configuración se ocupa de **una sola entidad**. Si cambia la tabla de productos, tocas un único archivo. Un §DbContext§ con cien líneas de configuración mezclada tendría muchas razones para cambiar.

> [oop Abierto y cerrado] El contexto llama a §ApplyConfigurationsFromAssembly§, que busca por reflexión todas las clases de configuración del proyecto. Agregar una entidad nueva significa **crear** un archivo; no hay que **modificar** el contexto. El código existente queda cerrado a cambios y abierto a extensión.

## Una clase base para las configuraciones

Todas las entidades heredan de §Entidad§, así que todas necesitan mapear lo mismo: clave primaria y fechas de auditoría. Para no repetirlo cinco veces se crea una clase base abstracta con el patrón **Template Method** (método plantilla): la base define el esqueleto del algoritmo y las derivadas completan los pasos que varían.

> [oop Herencia] El método §Configure§ de la base está **fijo**: aplica lo común y al final llama a §ConfigurarEntidad§, que cada derivada implementa. La base decide **cuándo** se ejecuta cada parte; la derivada decide **qué** hacer en su parte. Ese reparto es el uso más sano de la herencia: compartir un flujo, no solo copiar código.

## Repositorios concretos

En el paso 8 definimos las interfaces. Aquí escribimos sus clases con EF. Se aplica de nuevo la herencia: una clase base §RepositorioBase<T>§ implementa las cuatro operaciones comunes y cada repositorio específico agrega solo sus consultas propias.

> [oop Polimorfismo] La API pedirá un §IProductoRepositorio§ y el contenedor le entregará un §ProductoRepositorio§. Un mismo contrato, una implementación elegida en tiempo de ejecución. En las pruebas podrás entregar otra implementación (una lista en memoria) sin cambiar ni una línea del consumidor.

> [oop Inversión de dependencias] Mira el sentido de la referencia: **Infrastructure referencia a Application** y no al revés. Los repositorios de EF dependen de las interfaces definidas en la capa de negocio. La flecha se invirtió, tal como se explicó en el paso 8.

> [oop Encapsulamiento] Los repositorios, las configuraciones y la unidad de trabajo se declaran §internal§: nadie fuera de Infrastructure puede usarlos directamente ni escribir §new ProductoRepositorio()§. Solo se alcanzan por sus interfaces, y el único tipo público de registro es la extensión §AddInfraestructura§.

## Vida útil del DbContext

En el paso 3 viste los tres tiempos de vida. El §DbContext§ es **Scoped**: se crea una instancia por petición HTTP y se descarta al terminar. Razones:

- Guarda el estado de los objetos rastreados; compartirlo entre peticiones mezclaría datos de usuarios distintos.
- **No es seguro para hilos**: dos peticiones simultáneas no pueden usar el mismo contexto.
- Los repositorios y la unidad de trabajo también son Scoped y reciben **la misma instancia** del contexto dentro de una petición. Por eso lo que cargas con un repositorio puede guardarse con la unidad de trabajo.

## Fechas: UTC siempre

Npgsql guarda §DateTime§ en columnas §timestamp with time zone§ y **exige** que el valor sea UTC al escribir; si no, lanza una excepción. Por eso la auditoría usa §TimeProvider§, el reloj abstracto de .NET: se pide la hora al proveedor en vez de llamar a §DateTime.UtcNow§ directamente. En producción se registra el reloj del sistema (§TimeProvider.System§) y en las pruebas se puede reemplazar por uno fijo.

## Nombres en snake_case

PostgreSQL pone en minúsculas los nombres que no van entre comillas. Si las columnas se llamaran §CreadoEnUtc§ habría que escribir siempre §"CreadoEnUtc"§ con comillas dobles en el SQL. La convención habitual es **snake_case**: §creado_en_utc§. Escribiremos una pequeña clase que convierta los nombres de todas las columnas automáticamente.
