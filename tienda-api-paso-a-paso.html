Qué significa cada llamada:

- §Property<uint>("Version")§ declara una propiedad **sombra** de tipo entero sin signo llamada §Version§. No existe en la clase §Producto§; solo en el modelo.
- §HasColumnName("xmin")§ y §HasColumnType("xid")§ la asocian con la columna de sistema de PostgreSQL y su tipo.
- §ValueGeneratedOnAddOrUpdate()§ avisa a EF que es la **base de datos** quien produce el valor cada vez que se inserta o modifica la fila; EF solo lo lee.
- §IsConcurrencyToken()§ ordena incluir ese valor en la condición §WHERE§ de todo §UPDATE§ y §DELETE§.

> [info] En versiones recientes del proveedor existe el atajo §IsRowVersion()§ para propiedades §uint§, que hace lo mismo. Usamos la forma larga porque deja explícito cada detalle y funciona en todas las versiones.

### Traducir el conflicto a una excepción de negocio

La unidad de trabajo debe atrapar la nueva excepción. Agrega el primer bloque §catch§ (el de §DbUpdateConcurrencyException§) antes de los otros dos.

::code csharp editar src/Tienda.Infrastructure/Persistencia/UnidadDeTrabajo.cs
        try
        {
            return await contexto.SaveChangesAsync(cancellationToken);
        }
»        catch (DbUpdateConcurrencyException)
»        {
»            throw new ConflictoException(
»                "Los datos cambiaron mientras se procesaba la operación. Vuelve a intentarlo.");
»        }
        catch (DbUpdateException ex) when (ex.InnerException is PostgresException { SqlState: PostgresErrorCodes.UniqueViolation })
        {
            throw new ConflictoException("Ya existe un registro con ese valor, que debe ser único.");
        }
::

El orden importa: §DbUpdateConcurrencyException§ **hereda** de §DbUpdateException§. Si el bloque general estuviera primero, atraparía también al específico. Con las excepciones se escribe siempre del caso más particular al más general.

### Crear y aplicar la migración

::cmd Raíz del repositorio
dotnet ef migrations add AgregarVersionDeConcurrencia --project src/Tienda.Infrastructure --startup-project src/Tienda.Api
::

Abre la migración generada. Verás una operación §AddColumn§ de §xmin§ en las tablas §productos§ y §pedidos§. Npgsql **reconoce que §xmin§ es una columna de sistema** y no genera SQL para crearla, así que al aplicar la migración no se altera ninguna tabla: lo que cambia es el modelo, no la base. Puedes comprobarlo viendo el script.

::cmd Raíz del repositorio
dotnet ef migrations script Inicial --project src/Tienda.Infrastructure --startup-project src/Tienda.Api
::

Aplica la migración:

::cmd Raíz del repositorio
dotnet ef database update --project src/Tienda.Infrastructure --startup-project src/Tienda.Api
::

> [ojo] Si §database update§ falla con un mensaje que dice que la columna §xmin§ entra en conflicto con una columna de sistema, la migración intenta crearla. Como todavía no se aplicó (y no la has compartido), puedes editarla: borra las instrucciones §AddColumn§ y §DropColumn§ que mencionen §xmin§ y repite el comando.

Mira el valor de §xmin§ en una fila; debes pedirlo por nombre porque no aparece en §SELECT *§:

## Cómo diagnosticar problemas

| Síntoma | Posible causa | Qué revisar |
|---|---|---|
| 500 al crear el pedido | Excepción no esperada | Lee el log de la API: el manejador registra el detalle |
| Siempre 409 de concurrencia con una sola petición | El token no se actualiza | Confirma que la migración se aplicó y que la columna se llama §xmin§ |

| 422 "No existen los productos: ..." | Ids inexistentes | Comprueba los ids con §GET /api/productos§ |

# Teoría

## Qué es un origen

Un **origen** es la combinación de tres datos de una dirección: **esquema** (§http§ o §https§), **host** (el nombre del servidor) y **puerto**. Dos direcciones tienen el mismo origen solo si coinciden los tres.

| Dirección A | Dirección B | ¿Mismo origen? | Motivo |
|---|---|---|---|
| http://localhost:5080/api/productos | http://localhost:5080/scalar | Sí | Solo cambia la ruta |
| http://localhost:5080 | http://localhost:5173 | **No** | Puerto distinto |
| http://localhost:5080 | https://localhost:5080 | **No** | Esquema distinto |
| http://localhost:5080 | http://127.0.0.1:5080 | **No** | Host distinto, aunque sea la misma máquina |
| https://tienda.com | https://api.tienda.com | **No** | Subdominio distinto |

Cuando más adelante construyas el frontend con React, el servidor de desarrollo correrá en un puerto (por ejemplo 5173) y la API en otro (5080). **Son dos orígenes.** Aunque ambos estén en tu equipo y los hayas escrito tú.

## La política del mismo origen

Los navegadores aplican una regla de seguridad llamada **política del mismo origen** (*same-origin policy*): el JavaScript de una página solo puede leer respuestas del **mismo origen** del que se descargó la página.

Existe para protegerte. Sin ella, una página maliciosa que abras en otra pestaña podría hacer que tu navegador consulte tu banco o tu correo (donde ya iniciaste sesión) y leer los resultados.

**CORS** (*Cross-Origin Resource Sharing*, "compartir recursos entre orígenes") es el mecanismo para **relajar esa regla de forma controlada**: la API le dice al navegador, mediante cabeceras HTTP, "este otro origen tiene mi permiso".

## Lo que hay que entender bien

> [ojo] **CORS lo hace cumplir el navegador, no el servidor.** La API no rechaza peticiones por CORS: responde con cabeceras, y el navegador decide si entrega o no la respuesta al JavaScript. Tiene tres consecuencias prácticas:

- §curl§, Postman, una aplicación móvil o otro servidor **ignoran CORS por completo**. CORS no es un control de acceso: no sustituye a la autenticación.
- Una petición "simple" (por ejemplo un GET) **sí llega al servidor y se ejecuta**; el navegador solo impide que la página lea la respuesta.
- Cuando ves "CORS error" en el navegador, el servidor casi siempre respondió bien. Falta una cabecera.

## Peticiones simples y peticiones con preflight

Para no romper la web existente, el navegador distingue dos tipos:

- **Simples:** GET, HEAD o POST, con solo cabeceras básicas y con un tipo de contenido de formulario o texto. Se envían directamente; el navegador revisa la respuesta.
- **Con preflight:** todas las demás. Antes de enviar la petición real, el navegador manda automáticamente una consulta previa §OPTIONS§ preguntando "¿me permites hacer esto?". Solo si la respuesta autoriza, envía la petición real.

Para nuestra API **casi todo requiere preflight**, porque:

- Enviamos JSON (§Content-Type: application/json§ no es un tipo simple).
- Usamos §PUT§, §PATCH§ y §DELETE§.
- Con JWT se enviará la cabecera §Authorization§, tampoco simple.

::diagram cors

## Las cabeceras de CORS

| Cabecera | La envía | Significado |
|---|---|---|
| Origin | Navegador | Desde qué origen se hace la petición |
| Access-Control-Request-Method | Navegador (preflight) | Qué método usará la petición real |
| Access-Control-Request-Headers | Navegador (preflight) | Qué cabeceras especiales enviará |
| Access-Control-Allow-Origin | API | El origen autorizado |
| Access-Control-Allow-Methods | API | Métodos autorizados |
| Access-Control-Allow-Headers | API | Cabeceras autorizadas |
| Access-Control-Max-Age | API | Cuántos segundos puede recordar el navegador la respuesta del preflight |
| Access-Control-Expose-Headers | API | Cabeceras de la respuesta que el JavaScript puede leer |
| Access-Control-Allow-Credentials | API | Permite enviar cookies o credenciales |
| Vary: Origin | API | Avisa a cachés intermedias que la respuesta depende del origen |

Un detalle poco conocido: por defecto, el JavaScript de otro origen solo puede leer unas pocas cabeceras de la respuesta (las "seguras", como §Content-Type§). Si el frontend necesita leer la cabecera §Location§ que devuelve el POST de creación, la API debe **exponerla** explícitamente.

## Credenciales y JWT

- Si algún día usas **cookies**, necesitas §AllowCredentials()§ y, entonces, los orígenes deben listarse **uno por uno**. Combinar §AllowAnyOrigin()§ con credenciales es inválido e inseguro.
- Con **JWT en la cabecera §Authorization§** (el plan para el material siguiente) no se necesitan credenciales de CORS: basta con permitir esa cabecera. Por eso la política que escribiremos ya incluye §Authorization§ entre las cabeceras permitidas y no usa credenciales.

## Reglas para una política segura

1. **Lista explícita de orígenes.** Nunca §AllowAnyOrigin()§ en una API que, tarde o temprano, tendrá datos de usuarios.
2. **Orígenes por configuración**, no escritos en el código: en desarrollo son direcciones de §localhost§; en producción, el dominio real. Cambiarlos no requiere recompilar.
3. **Por omisión, ninguno.** Si no se configura ningún origen, no se permite nada (falla de forma segura).
4. **Solo lo necesario**: los métodos y cabeceras que de verdad se usan.

> [oop Abierto y cerrado] Agregar el dominio de producción o el de una aplicación móvil web nueva se hace **editando la configuración**, sin tocar el código. El programa está cerrado a modificación y abierto a extensión.

> [oop Responsabilidad única] La definición de la política vive en un solo lugar (una constante para el nombre y un bloque de registro). Quien lea §Program.cs§ ve en un vistazo qué permite la API.

## Un detalle de las direcciones

El origen en la configuración debe escribirse **exactamente** como lo envía el navegador: sin barra final y con el puerto cuando no es el predeterminado. §http://localhost:5173/§ (con barra) **no coincide** con §http://localhost:5173§.

Cada decisión, explicada:

- **§.Get<string[]>() ?? []§** lee el arreglo JSON como una lista de textos; si la sección no existe, usa una lista vacía (con la sintaxis de colección de C# 12). Con lista vacía, §WithOrigins§ no autoriza a nadie.
- **§WithMethods§** limita a los cinco verbos que usa la API. El preflight de un §TRACE§ o un §OPTIONS§ propio sería rechazado.
- **§WithHeaders("Content-Type", "Authorization")§**: el JSON necesita §Content-Type§, y §Authorization§ queda listo para el material de JWT. Los nombres de cabecera no distinguen mayúsculas.
- **§WithExposedHeaders("Location")§** permite que la página lea la dirección del recurso creado.
- **§SetPreflightMaxAge§** le dice al navegador que recuerde la respuesta del preflight durante 10 minutos. Sin esto, el navegador repetiría el §OPTIONS§ antes de **cada** petición real.
- **Orden del pipeline.** §UseCors§ va **antes** de §UseAuthorization§. Cuando agregues JWT, una petición sin credenciales recibirá un 401; si CORS estuviera después, ese 401 llegaría sin cabeceras CORS y el navegador lo mostraría como "error de CORS", ocultando el problema real.
- **La redirección HTTPS solo fuera de desarrollo.** Si el perfil §https§ está activo y el frontend llama a §http://localhost:5080§, §UseHttpsRedirection§ respondería al preflight con una redirección, y **los navegadores no permiten redirecciones en el preflight**: la petición fallaría con un error confuso. En desarrollo evitamos el problema; en producción el servidor debe aceptar solo HTTPS.

> [ojo] El nombre de la política es solo una etiqueta: lo importante es que la **misma** constante se use al registrar y al activar. Si las dos no coinciden, ASP.NET Core lanza una excepción en el primer request.

### Que los errores también lleven las cabeceras

Hay una trampa sutil. Cuando un controlador lanza una excepción, el middleware de excepciones **limpia la respuesta** antes de llamar a nuestro manejador, para no mezclar una respuesta a medias con el error. Esa limpieza elimina las cabeceras CORS que ya se habían puesto. El resultado sería catastrófico para el frontend: un 409 "stock insuficiente" aparecería en el navegador como "error de CORS" y el usuario no vería el mensaje.

La solución es que el manejador **vuelva a aplicar la política** al construir su respuesta. Reemplaza el archivo completo; las líneas marcadas son las nuevas.

### Simulando al navegador con curl

Como §curl§ no hace preflight por su cuenta, lo construimos a mano con las mismas cabeceras que enviaría el navegador. Es la mejor manera de entender qué ocurre y no depende de ninguna herramienta extra. En PowerShell usa §curl.exe§ y las mismas comillas dobles.

**1. Preflight desde un origen permitido**

::cmd macOS, Linux, Git Bash o PowerShell (curl.exe)
curl -i -X OPTIONS http://localhost:5080/api/productos -H "Origin: http://localhost:5173" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type"
::

::result Cabeceras esperadas (el orden puede variar)
HTTP/1.1 204 No Content
Access-Control-Allow-Origin: http://localhost:5173
Access-Control-Allow-Headers: content-type
Access-Control-Allow-Methods: POST
Access-Control-Max-Age: 600
Vary: Origin
::

**2. Preflight desde un origen que no está en la lista**

::cmd macOS, Linux, Git Bash o PowerShell (curl.exe)
curl -i -X OPTIONS http://localhost:5080/api/productos -H "Origin: http://sitio-malicioso.example" -H "Access-Control-Request-Method: POST"
::

::result Sin ninguna cabecera Access-Control-Allow-*
HTTP/1.1 204 No Content
Vary: Origin
::

El servidor responde con 204 igualmente. **No rechaza a nadie**: simplemente no da su permiso, y es el navegador quien, al no ver la cabecera, bloquea la petición real.

**3. Una petición real con origen permitido**

::cmd macOS, Linux, Git Bash o PowerShell (curl.exe)
curl -i http://localhost:5080/api/categorias -H "Origin: http://localhost:5173"
::

Entre las cabeceras debe aparecer §Access-Control-Allow-Origin: http://localhost:5173§ y §Access-Control-Expose-Headers: Location§.

**4. Un error con origen permitido**

::cmd macOS, Linux, Git Bash o PowerShell (curl.exe)
curl -i http://localhost:5080/api/categorias/9999 -H "Origin: http://localhost:5173"
::

Debe devolver 404 **y** la cabecera §Access-Control-Allow-Origin§. Si el 404 llegara sin ella, revisa los cambios al manejador de excepciones.

**5. La misma petición sin origen**

::cmd macOS, Linux, Git Bash o PowerShell (curl.exe)
curl -i http://localhost:5080/api/categorias
::

Funciona y **no** trae cabeceras CORS: sin §Origin§ no hay nada que evaluar. Es la prueba de que CORS solo afecta a los navegadores.

| Qué cambias | Qué esperas |
|---|---|
| Origen §http://localhost:5173/§ con barra final en el §Origin§ del curl | No coincide: sin cabecera |
| Origen §http://127.0.0.1:5173§ | No coincide con §localhost§: sin cabecera |

## Problemas frecuentes

| Síntoma | Causa probable | Solución |
|---|---|---|
| Sigue el error de CORS tras agregar la política | Falta reiniciar la API; la configuración se lee al arrancar | Detén y vuelve a ejecutar §dotnet run§ |
| Funciona el GET pero falla el POST | Falta permitir §Content-Type§ o el método | Revisa §WithHeaders§ y §WithMethods§ |
| El error menciona una redirección en el preflight | Se llama al puerto http mientras corre el perfil https | Usa la misma dirección que la API publica, o el perfil http |
| La política existe pero no se aplica | §UseCors§ está después de §MapControllers§ o falta | Debe ir antes de §UseAuthorization§ y de §MapControllers§ |
| Funciona en la página pero no en producción | El origen de producción no está en la configuración | Agrega el dominio exacto, con esquema y sin barra final |
| En Network aparece "(blocked:other)" o "CORS error" para un 500 | El error de servidor no llevaba cabeceras | Mira el log de la API: el problema real es la excepción, no CORS |

> [ojo] **No uses §AllowAnyOrigin()§ para "salir del paso".** Es la solución que aparece en muchos tutoriales y es peligrosa: permite que cualquier sitio web lea las respuestas de la API en nombre de tus usuarios. Si algo falla, el origen que falta casi siempre es un error de escritura en la lista.

## Qué NO resuelve CORS

CORS decide qué **páginas web** pueden leer las respuestas. No decide **quién** puede usar la API ni protege los datos. Cualquiera con §curl§ puede llamar hoy a todos los endpoints. Eso se resuelve con autenticación y autorización, que es lo que el paso siguiente deja preparado.

# Teoría

## Por qué este paso existe

En el material siguiente la API exigirá que las personas se identifiquen. Si esa seguridad se "pega" al final sobre un diseño que no la previó, se terminan reescribiendo servicios y controladores. Este paso hace **solo el trabajo que no cambia** cuando llegue la seguridad: el modelo de datos, la configuración y el punto de acceso al usuario actual. Ni una línea de código de tokens.

## Autenticación y autorización

| Concepto | Pregunta que responde | Ejemplo | Falla con |
|---|---|---|---|
| **Autenticación** | ¿Quién eres? | Iniciar sesión con correo y contraseña | 401 Unauthorized |
| **Autorización** | ¿Qué puedes hacer? | Solo un administrador cambia precios | 403 Forbidden |

Los nombres de los códigos HTTP confunden: **401** significa "no sé quién eres" (falta el token o es inválido) y **403** significa "sé quién eres, pero no tienes permiso".

## Qué es un JWT

Un **JSON Web Token** es un texto compacto que la API entrega al iniciar sesión y que el cliente devuelve en cada petición. Tiene tres partes separadas por puntos: §cabecera.contenido.firma§.

| Parte | Qué lleva |
|---|---|
| Cabecera | El algoritmo de firma (por ejemplo HS256) |
| Contenido (*payload*) | Las **declaraciones** (*claims*): quién es, su rol, cuándo vence |
| Firma | Un código calculado con una clave secreta que solo conoce la API |

El contenido, una vez decodificado, es un JSON como este:

::code json ver Contenido de un JWT (ejemplo ilustrativo)
{
  "sub": "7",
  "email": "ana@example.com",
  "role": "Cliente",
  "iss": "Tienda.Api",
  "aud": "Tienda.Frontend",
  "iat": 1760000000,
  "exp": 1760003600
}
::

| Claim | Significado |
|---|---|
| sub | *Subject*: el identificador del usuario |
| role | El rol, usado para autorizar |
| iss | *Issuer*: quién emitió el token (la API) |
| aud | *Audience*: para quién está destinado |
| iat, exp | Momento de emisión y de vencimiento (segundos desde 1970) |

Dos ideas esenciales:

1. **Está firmado, no cifrado.** Cualquiera puede leer el contenido (basta decodificar base64). Lo que nadie puede hacer es **modificarlo** sin que la firma deje de coincidir. Por eso **jamás** se guardan contraseñas ni datos sensibles dentro de un token.
2. **Es sin estado** (*stateless*). La API no guarda una lista de sesiones: para saber quién eres, valida la firma y el vencimiento. Escala bien, pero un token ya emitido no se puede "cancelar" antes de que venza; por eso duran poco.

::diagram jwt

## Contraseñas: hash, nunca texto

Una base de datos puede filtrarse. Si guardas contraseñas legibles (o cifradas con una clave que también se filtra), todas las cuentas caen. Por eso se guarda un **hash**: el resultado de una función matemática de **un solo sentido**. Al iniciar sesión se calcula el hash de lo que escribió la persona y se compara con el guardado. Nadie, ni los administradores, puede recuperar la contraseña original.

Reglas que se cumplen en el siguiente material:

- Usar algoritmos **lentos a propósito**, hechos para contraseñas (PBKDF2, bcrypt, Argon2). Nunca MD5, SHA-1 ni un SHA-256 simple.
- Cada hash lleva una **sal** (*salt*) aleatoria propia, para que dos personas con la misma contraseña tengan hashes distintos.
- .NET incluye un servicio listo para esto, que no se escribe a mano.

En este paso solo reservamos el **campo** donde se guardará el hash.

## Qué prepararemos

| Pieza | Capa | Para qué |
|---|---|---|
| §RolUsuario§ y §Usuario§ | Domain | Quién existe y qué rol tiene |
| Tabla §usuarios§ | Infrastructure | Persistir usuarios |
| §OpcionesJwt§ | Infrastructure | Configuración tipada: clave, emisor, audiencia, vigencia |
| §IUsuarioActual§ | Application | Que los servicios sepan quién hace la petición sin conocer HTTP |
| §UsuarioActual§ | Api | Lee la identidad desde la petición HTTP |

> [oop Inversión de dependencias] Cuando un servicio necesite saber "¿quién está haciendo esto?", pedirá un §IUsuarioActual§ por constructor. No leerá §HttpContext§ ni claims: eso ataría la capa de negocio a ASP.NET. La interfaz vive en Application; la implementación, que sí conoce HTTP, vive en Api.

> [oop Encapsulamiento] La clase §OpcionesJwt§ concentra la configuración de seguridad en un objeto con validación. El resto del código recibe un objeto tipado y válido, no busca textos sueltos en el archivo de configuración.

## El mapa de lo que se protegerá

Hoy cualquiera puede llamar a todo. Así quedará:

| Endpoint | Hoy | Con JWT |
|---|---|---|
| GET categorías y productos | Abierto | Abierto (catálogo público) |
| Crear, editar, borrar categorías y productos | Abierto | Solo Administrador |
| POST /api/clientes (registro) | Abierto | Abierto |
| GET /api/clientes/{id} | Abierto | El propio cliente o un Administrador |
| POST /api/pedidos | Abierto | Cliente autenticado |
| GET pedidos, pagar, cancelar | Abierto | El dueño del pedido o un Administrador |

> [ojo] Hay una vulnerabilidad clásica que este diseño deberá evitar: hoy el cuerpo del POST de pedidos trae un §clienteId§. Con seguridad, si se confía en él, **cualquier usuario autenticado podría comprar a nombre de otro** cambiando ese número. Con JWT, el cliente dueño del pedido se debe tomar **del token**, no del cuerpo. Esta falla se conoce como IDOR o BOLA (*Broken Object Level Authorization*) y encabeza las listas de riesgos de seguridad en APIs.

## Parte 2 · El usuario en el dominio

### El rol

::code csharp nuevo src/Tienda.Domain/Entities/RolUsuario.cs

### La entidad Usuario

::code csharp nuevo src/Tienda.Domain/Entities/Usuario.cs
using Tienda.Domain.Common;
using Tienda.Domain.Exceptions;

namespace Tienda.Domain.Entities;

public class Usuario : Entidad
{
    public const int LongitudMaximaEmail = 200;
    public const int LongitudMaximaHash = 500;

    private Usuario() { }

    public Usuario(string email, string hashContrasena, RolUsuario rol, int? clienteId = null)
    {
        if (!Enum.IsDefined(rol))
            throw new ReglaDeNegocioException("El rol no es válido.");

        switch (rol)
        {
            case RolUsuario.Cliente when clienteId is null:
                throw new ReglaDeNegocioException("Un usuario con rol Cliente debe estar asociado a un cliente.");
            case RolUsuario.Administrador when clienteId is not null:
                throw new ReglaDeNegocioException("Un administrador no se asocia a un cliente.");
        }

        Email = Guard.Correo(email, "El correo", LongitudMaximaEmail);
        Rol = rol;
        ClienteId = clienteId;
        Activo = true;
        CambiarHashContrasena(hashContrasena);
    }

    public string Email { get; private set; } = null!;

    public string HashContrasena { get; private set; } = null!;

    public RolUsuario Rol { get; private set; }

    public int? ClienteId { get; private set; }

    public bool Activo { get; private set; }

    public void CambiarHashContrasena(string nuevoHash)
    {
        HashContrasena = Guard.TextoRequerido(nuevoHash, "El hash de la contraseña", LongitudMaximaHash);
    }

    public void Activar() => Activo = true;

    public void Desactivar() => Activo = false;
}
::

Cómo leerlo:

- La propiedad se llama §HashContrasena§ y el método §CambiarHashContrasena§: el dominio **nunca ve una contraseña en texto**. Recibe un hash ya calculado por otra pieza. Cómo se calcula es asunto de infraestructura.
- §switch§ con cláusulas §when§ expresa dos reglas de consistencia: un usuario cliente debe apuntar a un cliente, un administrador no. Un administrador que "compra" a nombre de un cliente sería una ambigüedad en los datos.
- §Enum.IsDefined(rol)§ protege contra valores inventados: en C# un enum acepta cualquier número con una conversión (§(RolUsuario)99§), aunque no esté declarado.
- §Desactivar§ es el equivalente de **bloquear una cuenta** sin borrarla. Borrar usuarios rompería el rastro de lo que hicieron.
- Reutiliza §Guard.Correo§ y §Guard.TextoRequerido§: la regla vive en un solo lugar.

## Parte 4 · Configuración de JWT

### La clase de opciones

Crea la carpeta y la clase. Será la fuente de verdad de la configuración de seguridad.

::cmd macOS, Linux o Git Bash
mkdir -p src/Tienda.Infrastructure/Seguridad
::

::cmd Windows (PowerShell)
New-Item -ItemType Directory -Force src/Tienda.Infrastructure/Seguridad

::code csharp nuevo src/Tienda.Infrastructure/Seguridad/OpcionesJwt.cs
using System.ComponentModel.DataAnnotations;

namespace Tienda.Infrastructure.Seguridad;

public sealed class OpcionesJwt
{
    public const string Seccion = "Jwt";

    [Required, MinLength(32)]
    public string ClaveSecreta { get; set; } = string.Empty;

    [Required]
    public string Emisor { get; set; } = string.Empty;

    [Required]
    public string Audiencia { get; set; } = string.Empty;

    [Range(1, 1440)]
    public int MinutosDeVigencia { get; set; } = 60;
}
::

- Es el **patrón de opciones** de .NET: una clase con propiedades que se rellena desde una sección de la configuración. Evita escribir cadenas como §configuration["Jwt:Emisor"]§ por todo el código.
- Los atributos son **validaciones declarativas**: la clave debe existir y tener al menos 32 caracteres (el algoritmo HMAC-SHA256 pide una clave de 256 bits), el emisor y la audiencia son obligatorios, y la vigencia se limita entre 1 minuto y 24 horas.
- §Seccion§ es una constante para no repetir el texto "Jwt".
- Esta clase pertenece a Infrastructure porque será ahí donde, en el siguiente material, se implemente el emisor de tokens. La API, que referencia a Infrastructure, también podrá leerla.

### Los valores no secretos

Agrega la sección al archivo base de configuración.

::code json editar src/Tienda.Api/appsettings.json
  "AllowedHosts": "*",
  "Cors": {
    "OrigenesPermitidos": []
  },
»  "Jwt": {
»    "Emisor": "Tienda.Api",
»    "Audiencia": "Tienda.Frontend",
»    "MinutosDeVigencia": 60
»  }
}
::

Fíjate en lo que **no** está: la clave secreta. Se guarda en los secretos de usuario, igual que la cadena de conexión.

### La clave secreta

Genera una clave aleatoria de 48 bytes (64 caracteres en base 64):

::cmd macOS, Linux o Git Bash
openssl rand -base64 48
::

::cmd Windows (PowerShell)
$bytes = New-Object byte[] 48; [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes); [Convert]::ToBase64String($bytes)
::

Copia el texto que imprime y guárdalo (reemplaza el marcador por tu clave, entre comillas):

::cmd Raíz del repositorio
dotnet user-secrets set "Jwt:ClaveSecreta" "PEGA-AQUI-LA-CLAVE-GENERADA" --project src/Tienda.Api
dotnet user-secrets list --project src/Tienda.Api
::

> [ojo] Esa clave es la que firma los tokens. **Quien la conozca puede fabricar tokens válidos para cualquier usuario**, incluidos administradores. Nunca la subas a Git, no la pegues en chats ni en capturas de pantalla, y usa una distinta en cada entorno. Si se filtra, se cambia y todos los tokens emitidos dejan de valer.

### La abstracción en Application

::code csharp nuevo src/Tienda.Application/Comun/IUsuarioActual.cs
namespace Tienda.Application.Comun;

{
    bool EstaAutenticado { get; }

    int? Id { get; }

    string? Email { get; }

    bool EsAdministrador { get; }
}
::

Es un contrato mínimo: lo justo para tomar decisiones de negocio. Más adelante un servicio dirá cosas como "si no es administrador, solo puede ver sus propios pedidos".

### La implementación en Api

::code csharp nuevo src/Tienda.Api/Seguridad/UsuarioActual.cs
using System.Security.Claims;
using Tienda.Application.Comun;
using Tienda.Domain.Entities;

namespace Tienda.Api.Seguridad;

internal sealed class UsuarioActual(IHttpContextAccessor accesor) : IUsuarioActual
{
    private ClaimsPrincipal? Principal => accesor.HttpContext?.User;

    public bool EstaAutenticado => Principal?.Identity?.IsAuthenticated ?? false;

    public int? Id =>
        int.TryParse(Principal?.FindFirstValue(ClaimTypes.NameIdentifier), out var id) ? id : null;

    public string? Email => Principal?.FindFirstValue(ClaimTypes.Email);

    public bool EsAdministrador => Principal?.IsInRole(nameof(RolUsuario.Administrador)) ?? false;
}
::

- §IHttpContextAccessor§ da acceso a la petición actual desde fuera de un controlador. Es la única pieza que "sabe de HTTP".
- §ClaimsPrincipal§ es el objeto de .NET que representa a la persona identificada; sus *claims* son los datos del token. Hoy, sin autenticación, siempre estará vacío y todas las propiedades devolverán "anónimo".
- §nameof(RolUsuario.Administrador)§ produce el texto "Administrador", así el nombre del rol se escribe una sola vez y se renombra con el compilador.
- Las propiedades usan el operador §?.§ en cadena: si cualquier eslabón es nulo, todo el resultado es nulo en lugar de lanzar una excepción.

### Un método de registro para la seguridad

::code csharp nuevo src/Tienda.Api/Seguridad/DependenciasSeguridad.cs
using Tienda.Application.Comun;
using Tienda.Infrastructure.Seguridad;

namespace Tienda.Api.Seguridad;

public static class DependenciasSeguridad
{
    public static IServiceCollection AddSeguridad(this IServiceCollection servicios)
    {
        servicios.AddOptions<OpcionesJwt>()
            .BindConfiguration(OpcionesJwt.Seccion)
            .ValidateDataAnnotations()
            .ValidateOnStart();

        servicios.AddHttpContextAccessor();
        servicios.AddScoped<IUsuarioActual, UsuarioActual>();

        return servicios;
    }
}
::

- §BindConfiguration§ enlaza la clase con la sección §Jwt§ del archivo de configuración y de los secretos.
- §ValidateDataAnnotations§ aplica los atributos de §OpcionesJwt§.
- §ValidateOnStart§ hace esa validación **al arrancar** y no en el primer uso. Es el mismo criterio de *fail fast* que usamos con la cadena de conexión: si falta la clave, la aplicación no inicia.

# Teoría

## Monitoreo: el endpoint de salud

Cuando la API esté desplegada, otros sistemas necesitan saber si está funcionando: un balanceador de carga que decide a qué servidor enviar tráfico, un orquestador como Kubernetes que reinicia contenedores caídos, una herramienta de alertas. Todos hacen lo mismo: llaman periódicamente a una dirección y miran el código de respuesta.

| Respuesta | Significado |
|---|---|
| 200 y el texto Healthy | Todo funciona |
| 503 y el texto Unhealthy | Algo esencial falla (por ejemplo, la base de datos) |

ASP.NET Core trae un sistema de **comprobaciones de salud** (*health checks*): cada comprobación es una clase que implementa §IHealthCheck§. El framework las ejecuta y resume el resultado.

> [oop Polimorfismo] Una vez más, un contrato con muchas implementaciones posibles: puedes registrar una comprobación de base de datos, otra de espacio en disco, otra de un servicio externo. El framework las trata a todas igual.

## Por qué probamos un servicio sin base de datos

En el paso 8 invertimos la dependencia: los servicios dependen de **interfaces**. Ahora cobramos el beneficio. Para probar la lógica de §CategoriaServicio§ no hace falta PostgreSQL, ni Docker, ni EF Core: basta pasarle **objetos falsos** que cumplan los mismos contratos.

Estas pruebas son:

- **Rápidas:** milisegundos, sin red ni disco.
- **Deterministas:** no dependen del estado de ninguna base.
- **Enfocadas:** si fallan, el problema está en la lógica del servicio, no en la infraestructura.

Un objeto falso que reemplaza a otro en una prueba se llama *test double*. Hay varios tipos; usaremos un **falso** (*fake*): una implementación simplificada pero funcional, aquí un repositorio que guarda las categorías en una lista en memoria.

> [oop Sustitución de Liskov] Para que el reemplazo funcione, el falso debe poder usarse **en cualquier sitio donde se espera el contrato**, comportándose como el verdadero: si pides una categoría que no existe devuelve nulo, si agregas una le asigna un id. Si el falso violara el contrato, las pruebas pasarían y el sistema real fallaría. Eso es el principio de sustitución de Liskov aplicado a la práctica.

## La pirámide de pruebas

| Nivel | Qué prueba | Velocidad | En este proyecto |
|---|---|---|---|
| Unitarias de dominio | Una entidad aislada | Muy rápida | Paso 7 y 17 (28 pruebas) |
| Unitarias de servicios | Un caso de uso con falsos | Rápida | Este paso (6 pruebas) |
| De integración | La API real con una base real | Más lenta | Quedan como mejora propuesta |

Cuanto más abajo, más pruebas debe haber. Las de integración son pocas pero valiosas: verifican que las piezas encajan con la base real.

using Microsoft.Extensions.Diagnostics.HealthChecks;
using Tienda.Infrastructure.Persistencia;

namespace Tienda.Api.Salud;

public sealed class SaludBaseDeDatos(TiendaDbContext contexto) : IHealthCheck
{
    public async Task<HealthCheckResult> CheckHealthAsync(
        HealthCheckContext context,
        CancellationToken cancellationToken = default)
    {
        try
        {
            return await contexto.Database.CanConnectAsync(cancellationToken)
                ? HealthCheckResult.Healthy("PostgreSQL responde.")
                : HealthCheckResult.Unhealthy("No hay conexión con PostgreSQL.");
        }
        catch (Exception ex)
        {
            return HealthCheckResult.Unhealthy("Falló la comprobación de PostgreSQL.", ex);
        }
    }
}
::

- §contexto.Database.CanConnectAsync§ intenta abrir una conexión y responde verdadero o falso.
- Una comprobación de salud **no debe lanzar excepciones**: las atrapa y las convierte en un resultado §Unhealthy§ que incluye la causa.
- Se pide §TiendaDbContext§ por constructor como en cualquier otra clase.

{

::code csharp nuevo tests/Tienda.Application.Tests/Falsos/CategoriaRepositorioFalso.cs
using Tienda.Application.Categorias;
using Tienda.Domain.Common;
using Tienda.Domain.Entities;

namespace Tienda.Application.Tests.Falsos;

internal sealed class CategoriaRepositorioFalso : ICategoriaRepositorio
{
    private readonly List<Categoria> _categorias = [];
    private int _ultimoId;

    public HashSet<int> CategoriasConProductos { get; } = [];

    public Task<Categoria?> ObtenerPorIdAsync(int id, CancellationToken cancellationToken = default) =>
        Task.FromResult(_categorias.FirstOrDefault(c => c.Id == id));

    public Task<IReadOnlyList<Categoria>> ListarAsync(CancellationToken cancellationToken = default) =>
        Task.FromResult<IReadOnlyList<Categoria>>(_categorias.ToList());

    public void Agregar(Categoria entidad)
    {
        AsignarId(entidad, ++_ultimoId);
        _categorias.Add(entidad);
    }

    public void Eliminar(Categoria entidad) => _categorias.Remove(entidad);

    public Task<bool> ExisteNombreAsync(string nombre, int? excluirId, CancellationToken cancellationToken = default) =>
        Task.FromResult(_categorias.Any(c =>
            string.Equals(c.Nombre, nombre, StringComparison.OrdinalIgnoreCase) && c.Id != excluirId));

    public Task<bool> TieneProductosAsync(int categoriaId, CancellationToken cancellationToken = default) =>
        Task.FromResult(CategoriasConProductos.Contains(categoriaId));

    private static void AsignarId(Entidad entidad, int id) =>
        typeof(Entidad).GetProperty(nameof(Entidad.Id))!.SetValue(entidad, id);
}
::

Observa los detalles:

- La clase implementa **el mismo contrato** que el repositorio de EF (§ICategoriaRepositorio§): seis métodos, uno por cada uno definido en el paso 8. Por eso el servicio no nota la diferencia.
- §_categorias§ es la "base de datos" en memoria. §Agregar§ asigna un id, igual que haría PostgreSQL al insertar.
- §AsignarId§ usa **reflexión** porque §Id§ tiene setter protegido en el dominio. Es una trampa legítima y confinada a la prueba: el código de producción nunca la usa.
- §CategoriasConProductos§ deja decidir a cada prueba si una categoría "tiene productos", sin necesidad de armar el repositorio de productos.
- §Task.FromResult§ envuelve un valor ya conocido en una tarea completada: el falso cumple la firma asíncrona sin hacer nada asíncrono.

### Las pruebas

::code csharp nuevo tests/Tienda.Application.Tests/CategoriaServicioTests.cs
using Tienda.Application.Categorias;
using Tienda.Application.Tests.Falsos;
using Tienda.Domain.Exceptions;
using Xunit;

namespace Tienda.Application.Tests;

public class CategoriaServicioTests
{
    private readonly CategoriaRepositorioFalso _repositorio = new();
    private readonly UnidadDeTrabajoFalsa _unidad = new();
    private readonly ICategoriaServicio _servicio;

    public CategoriaServicioTests()
    {
        _servicio = new CategoriaServicio(_repositorio, _unidad);
    }

    [Fact]
    public async Task Crear_ConDatosValidos_GuardaUnaVezYDevuelveElDto()
    {
        var dto = await _servicio.CrearAsync(new CategoriaSolicitud { Nombre = "  Hogar " });

        Assert.Equal("Hogar", dto.Nombre);
        Assert.Equal(1, dto.Id);
        Assert.Equal(1, _unidad.VecesGuardado);
    }

    [Fact]
    public async Task Crear_ConNombreRepetido_LanzaConflictoYNoGuarda()
    {
        await _servicio.CrearAsync(new CategoriaSolicitud { Nombre = "Hogar" });

        await Assert.ThrowsAsync<ConflictoException>(
            () => _servicio.CrearAsync(new CategoriaSolicitud { Nombre = "HOGAR" }));

        Assert.Equal(1, _unidad.VecesGuardado);
    }

    [Fact]
    public async Task Crear_ConNombreVacio_LanzaReglaDeNegocio()
    {
        await Assert.ThrowsAsync<ReglaDeNegocioException>(
            () => _servicio.CrearAsync(new CategoriaSolicitud { Nombre = "   " }));
    }

    [Fact]
    public async Task Obtener_Inexistente_LanzaNoEncontrado()
    {
        await Assert.ThrowsAsync<NoEncontradoException>(() => _servicio.ObtenerAsync(99));
    }

    [Fact]
    public async Task Eliminar_ConProductos_LanzaConflictoYNoGuarda()
    {
        var creada = await _servicio.CrearAsync(new CategoriaSolicitud { Nombre = "Libros" });
        _repositorio.CategoriasConProductos.Add(creada.Id);

        await Assert.ThrowsAsync<ConflictoException>(() => _servicio.EliminarAsync(creada.Id));

        Assert.Equal(1, _unidad.VecesGuardado);
    }

    [Fact]
    public async Task Eliminar_SinProductos_LaCategoriaDejaDeExistir()
    {
        var creada = await _servicio.CrearAsync(new CategoriaSolicitud { Nombre = "Juguetes" });

        await _servicio.EliminarAsync(creada.Id);

        await Assert.ThrowsAsync<NoEncontradoException>(() => _servicio.ObtenerAsync(creada.Id));
    }
}
::

Cómo leerlas:

- **Constructor de la clase de pruebas.** xUnit crea una instancia nueva por cada prueba, así que cada una parte con un repositorio vacío y un contador en cero. Las pruebas no se contaminan entre sí.
- **Nombres descriptivos.** §Crear_ConNombreRepetido_LanzaConflictoYNoGuarda§ dice qué se hace, en qué condición y qué se espera. Cuando falle, el nombre ya cuenta la historia.
- **§async Task§ y §await Assert.ThrowsAsync§.** Las pruebas de métodos asíncronos son también asíncronas. §ThrowsAsync§ recibe una función que debe lanzar la excepción esperada.
- **Qué NO se prueba aquí:** que el nombre vacío falle por reglas del dominio ya está cubierto en el paso 7. Esta prueba comprueba que el servicio **deja pasar** esa excepción y no la oculta. Cada nivel prueba su propia responsabilidad.
- **Verificar efectos:** §_unidad.VecesGuardado§ confirma que, ante un error, **no se llamó** a guardar. Las pruebas no solo miran lo que se devuelve, también lo que se hizo.

MySQL no tiene §ILIKE§. Con el cotejamiento (*collation*) por omisión de las bases de MySQL 8 las comparaciones ya ignoran mayúsculas, así que basta §LIKE§. En §ProductoRepositorio.BuscarAsync§ cambia las dos llamadas:

## Fechas siempre en UTC

MySQL guarda §datetime§ sin zona y, al leerlo, entrega un §DateTime§ de tipo "no especificado". Al convertirlo a JSON no llevaría la letra §Z§ (UTC) y el navegador lo interpretaría como hora local, desplazando las fechas. Se soluciona con un convertidor que marca siempre el tipo como UTC.

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/ConvertidoresDeFecha.cs
using Microsoft.EntityFrameworkCore.Storage.ValueConversion;

namespace Tienda.Infrastructure.Persistencia;

internal sealed class FechaUtcConvertidor() : ValueConverter<DateTime, DateTime>(
    valor => valor,
    valor => DateTime.SpecifyKind(valor, DateTimeKind.Utc));

internal sealed class FechaUtcNulableConvertidor() : ValueConverter<DateTime?, DateTime?>(
    valor => valor,
    valor => valor.HasValue ? DateTime.SpecifyKind(valor.Value, DateTimeKind.Utc) : valor);
::

Y se aplica a **todas** las propiedades de fecha del modelo con una convención, dentro de §TiendaDbContext§:

»        configuracion.Properties<DateTime>().HaveConversion<FechaUtcConvertidor>();
»        configuracion.Properties<DateTime?>().HaveConversion<FechaUtcNulableConvertidor>();
»    }

# Paso 15 con MySQL: concurrencia sin xmin

MySQL no tiene una columna de sistema equivalente a §xmin§. La solución es un **contador propio**: una columna §version§ que la aplicación incrementa en cada modificación, y que EF incluye en la condición del §UPDATE§.

En las configuraciones de **Producto** y de **Pedido** reemplaza el bloque de §Version§ (el de §HasColumnName("xmin")§) por una sola línea:

::code csharp editar src/Tienda.Infrastructure/Persistencia/Configuraciones/ProductoConfiguracion.cs
»        builder.Property<uint>("Version").IsConcurrencyToken();
::

Y en §TiendaDbContext§ agrega el incremento dentro del método de auditoría:

::code csharp editar src/Tienda.Infrastructure/Persistencia/TiendaDbContext.cs
    private void AplicarAuditoria()
    {
        var ahora = reloj.GetUtcNow().UtcDateTime;

        foreach (var entrada in ChangeTracker.Entries<Entidad>())
        {
            if (entrada.State == EntityState.Added)
                entrada.Property(e => e.CreadoEnUtc).CurrentValue = ahora;
            else if (entrada.State == EntityState.Modified)
                entrada.Property(e => e.ActualizadoEnUtc).CurrentValue = ahora;
        }

»        foreach (var entrada in ChangeTracker.Entries().Where(e => e.State == EntityState.Modified))
»        {
»            var version = entrada.Properties.FirstOrDefault(p => p.Metadata.Name == "Version");
»            if (version is { CurrentValue: uint actual })
»                version.CurrentValue = actual + 1;
»        }
    }
::

- Se busca la propiedad sombra §Version§ en las entradas **modificadas**. Si existe, se aumenta en uno.
- EF genera §UPDATE ... SET version = 6 WHERE id = 3 AND version = 5§. Si otra transacción ya la subió, la condición no coincide, afecta 0 filas y EF lanza §DbUpdateConcurrencyException§, que la unidad de trabajo convierte en un 409. El mecanismo es el mismo del paso 15; solo cambia de dónde sale el número.
- Esta técnica **también funciona en PostgreSQL**; usamos §xmin§ allí porque evita mantener una columna propia.

# Cómo diagnosticar

La mayoría de los problemas se resuelven con una rutina corta, en este orden:

1. **Lee el mensaje completo**, de arriba a abajo. La causa real suele estar en la primera o en la última línea, no en la del medio.
2. **Identifica en qué capa ocurre.** ¿Falla al compilar, al arrancar, al llamar a un endpoint o solo en el navegador?
3. **Aísla.** ¿Funciona con §curl§? ¿Funciona en Scalar? Cada respuesta descarta una parte del sistema.
4. **Busca el error exacto**, entre comillas, en tu buscador. Copia el texto del mensaje, no tu interpretación.
5. **Cambia una cosa a la vez** y vuelve a probar. Dos cambios simultáneos hacen imposible saber cuál arregló o rompió algo.
6. **Mira el log de la API.** El manejador de excepciones del paso 12 registra el detalle completo de cada error 500.

> [tip] Si un comando que funcionaba deja de funcionar, ejecuta §git status§ y §git diff§. Un archivo modificado sin querer es la causa más frecuente.

# Glosario

| Término | Significado |

| Agregado | Conjunto de objetos que se tratan como una unidad; tiene una raíz por la que se accede |
| API REST | Interfaz que expone recursos mediante HTTP y verbos estándar |
| Async y await | Forma de esperar operaciones lentas sin bloquear el hilo |
| Autenticación | Comprobar quién es alguien |
| Autorización | Decidir qué puede hacer alguien identificado |
| Cadena de conexión | Texto que indica cómo llegar a la base de datos |
| Change Tracker | Mecanismo de EF que detecta qué objetos cambiaron |
| Claim | Dato sobre el usuario dentro de un token (identificador, rol, vencimiento) |
| Composición | Un objeto contiene a otros para construir comportamiento |
| Concurrencia optimista | Detectar al guardar que otro cambió el dato, sin bloquear |
| Contenedor de dependencias | Componente que crea los objetos y entrega a cada uno lo que necesita |
| Controlador | Clase que recibe peticiones HTTP y delega en los servicios |
| CORS | Mecanismo para que un navegador permita llamadas entre orígenes |
| DbContext | Sesión de trabajo con la base de datos en EF Core |
| DTO | Objeto simple para transportar datos entre capas o por la red |
| Encapsulamiento | Proteger el estado de un objeto y exponer solo operaciones válidas |
| Entidad | Objeto con identidad propia que persiste en el tiempo |
| Fail fast | Fallar de inmediato y con claridad ante una mala configuración |
| Fluent API | Configuración del mapeo mediante llamadas encadenadas en código |
| Herencia | Una clase reutiliza y extiende a otra con una relación "es un" |
| Idempotente | Repetir la operación produce el mismo estado final que hacerla una vez |
| Inyección de dependencias | Entregar a un objeto sus colaboradores desde fuera, normalmente por constructor |
| JWT | Token firmado que lleva la identidad del usuario |
| Middleware | Pieza del pipeline que procesa cada petición y respuesta |
| Migración | Archivo versionado que describe un cambio de esquema |
| ORM | Herramienta que traduce entre objetos y tablas |
| Objeto de valor | Objeto sin identidad definido por sus datos, normalmente inmutable |
| Origen | Combinación de esquema, host y puerto de una dirección |
| Paginación | Devolver resultados por partes, con el total |
| Polimorfismo | Usar objetos distintos a través de un mismo contrato |
| Preflight | Consulta OPTIONS previa que hace el navegador en CORS |
| ProblemDetails | Formato estándar de respuesta de error en JSON |
| Repositorio | Objeto que simula una colección de entidades y esconde la base de datos |
| Servicio de aplicación | Clase que coordina un caso de uso sin contener reglas de negocio |
| SOLID | Cinco principios de diseño orientado a objetos |
| Unidad de trabajo | Agrupa los cambios para guardarlos en una sola transacción |
| Volumen | Almacenamiento de Docker que sobrevive a los contenedores |
