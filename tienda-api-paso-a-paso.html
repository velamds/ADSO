## La convención snake_case

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/ConvencionSnakeCase.cs
using System.Text;
using Microsoft.EntityFrameworkCore;
using Microsoft.EntityFrameworkCore.Metadata;

namespace Tienda.Infrastructure.Persistencia;

internal static class ConvencionSnakeCase
{
    public static void Aplicar(ModelBuilder modelo)
    {
        foreach (var entidad in modelo.Model.GetEntityTypes())
        {
            var tabla = StoreObjectIdentifier.Create(entidad, StoreObjectType.Table);
            if (tabla is null)
                continue;

            foreach (var propiedad in entidad.GetProperties())
            {
                var actual = propiedad.GetColumnName(tabla.Value);
                if (actual is not null)
                    propiedad.SetColumnName(Convertir(actual));
            }
        }
    }

    public static string Convertir(string nombre)
    {
        var resultado = new StringBuilder(nombre.Length + 4);

        for (var i = 0; i < nombre.Length; i++)
        {
            var letra = nombre[i];

            if (char.IsUpper(letra))
            {
                var anterior = i > 0 ? nombre[i - 1] : '_';
                if (anterior != '_' && !char.IsUpper(anterior))
                    resultado.Append('_');

                resultado.Append(char.ToLowerInvariant(letra));
            }
            else
            {
                resultado.Append(letra);
            }
        }

        return resultado.ToString();
    }
}
::

Cómo leerlo:

- Recorre cada tipo de entidad del modelo y, para cada propiedad, pregunta el nombre de columna que EF le habría puesto y lo reemplaza por su versión en snake_case. Así §CreadoEnUtc§ pasa a §creado_en_utc§ y la dirección del cliente, que EF llama §Direccion_CodigoPostal§, queda como §direccion_codigo_postal§.
- §Convertir§ inserta un guion bajo antes de cada mayúscula que no sea la primera letra ni siga a otra mayúscula o a un guion bajo, y pasa todo a minúsculas.
- Es §static§ porque no guarda estado: es una función pura. Y §internal§, porque es un detalle de esta capa.

> [info] Existe un paquete de la comunidad (§EFCore.NamingConventions§) que hace lo mismo con una línea. Lo evitamos para que el material dependa solo de paquetes oficiales y para que veas cómo funciona por dentro el modelo de EF.

## La configuración base

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/Configuraciones/EntidadConfiguracion.cs
using Microsoft.EntityFrameworkCore;
using Microsoft.EntityFrameworkCore.Metadata.Builders;
using Tienda.Domain.Common;

namespace Tienda.Infrastructure.Persistencia.Configuraciones;

internal abstract class EntidadConfiguracion<T> : IEntityTypeConfiguration<T> where T : Entidad
{
    protected abstract string Tabla { get; }

    public void Configure(EntityTypeBuilder<T> builder)
    {
        builder.ToTable(Tabla);
        builder.HasKey(e => e.Id);
        builder.Property(e => e.CreadoEnUtc).IsRequired();
        builder.Property(e => e.ActualizadoEnUtc);

        ConfigurarEntidad(builder);
    }

    protected abstract void ConfigurarEntidad(EntityTypeBuilder<T> builder);
}
::

- §IEntityTypeConfiguration<T>§ es la interfaz de EF que exige un método §Configure§.
- §where T : Entidad§ es una **restricción genérica**: solo se puede usar con tipos que hereden de §Entidad§. Por eso el compilador permite escribir §e.Id§ y §e.CreadoEnUtc§.
- §Tabla§ es una propiedad abstracta: cada derivada debe indicar el nombre de su tabla.
- §Configure§ no es virtual: ninguna derivada puede cambiar el esqueleto, solo completar §ConfigurarEntidad§.

## Configuración de Categoria

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/Configuraciones/CategoriaConfiguracion.cs
using Microsoft.EntityFrameworkCore;
using Microsoft.EntityFrameworkCore.Metadata.Builders;
using Tienda.Domain.Entities;

namespace Tienda.Infrastructure.Persistencia.Configuraciones;

internal sealed class CategoriaConfiguracion : EntidadConfiguracion<Categoria>
{
    protected override string Tabla => "categorias";

    protected override void ConfigurarEntidad(EntityTypeBuilder<Categoria> builder)
    {
        builder.Property(c => c.Nombre)
            .IsRequired()
            .HasMaxLength(Categoria.LongitudMaximaNombre);

        builder.Property(c => c.Descripcion)
            .HasMaxLength(Categoria.LongitudMaximaDescripcion);

        builder.HasIndex(c => c.Nombre).IsUnique();
    }
}
::

Aquí se cumple lo que prometió el paso 5: los largos máximos vienen de las mismas constantes del dominio. Si cambias §LongitudMaximaNombre§, la validación y la columna cambian juntas.

§HasIndex(...).IsUnique()§ crea un **índice único**: la base de datos misma impide dos categorías con el mismo nombre. La validación del código es amable (da un mensaje claro); el índice es la **garantía final** frente a dos peticiones simultáneas.

## Configuración de Producto

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/Configuraciones/ProductoConfiguracion.cs
using Microsoft.EntityFrameworkCore;
using Microsoft.EntityFrameworkCore.Metadata.Builders;
using Tienda.Domain.Entities;

namespace Tienda.Infrastructure.Persistencia.Configuraciones;

internal sealed class ProductoConfiguracion : EntidadConfiguracion<Producto>
{
    protected override string Tabla => "productos";

    protected override void ConfigurarEntidad(EntityTypeBuilder<Producto> builder)
    {
        builder.Property(p => p.Nombre)
            .IsRequired()
            .HasMaxLength(Producto.LongitudMaximaNombre);

        builder.Property(p => p.Sku)
            .IsRequired()
            .HasMaxLength(Producto.LongitudMaximaSku);

        builder.Property(p => p.Descripcion)
            .HasMaxLength(Producto.LongitudMaximaDescripcion);

        builder.Property(p => p.Precio).HasPrecision(18, 2);

        builder.HasIndex(p => p.Sku).IsUnique();
        builder.HasIndex(p => p.CategoriaId);

        builder.HasOne(p => p.Categoria)
            .WithMany()
            .HasForeignKey(p => p.CategoriaId)
            .OnDelete(DeleteBehavior.Restrict);
    }
}
::

- §HasPrecision(18, 2)§ crea una columna §numeric(18,2)§: hasta 18 dígitos en total, 2 de ellos decimales. Es el tipo exacto que corresponde al §decimal§ de C#.
- §HasOne(...).WithMany().HasForeignKey(...)§ se lee "un producto tiene una categoría; una categoría tiene muchos productos; la clave foránea es §CategoriaId§". §WithMany()§ queda vacío porque la clase §Categoria§ no tiene una lista de productos.
- §DeleteBehavior.Restrict§ prohíbe borrar una categoría que aún tiene productos: la base lo rechaza. La alternativa, §Cascade§, borraría en cadena todos los productos, algo peligroso para un catálogo.
- El índice sobre §CategoriaId§ acelera la consulta "productos de una categoría". PostgreSQL **no** crea índices automáticos para las claves foráneas.

## Configuración de Cliente

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/Configuraciones/ClienteConfiguracion.cs
using Microsoft.EntityFrameworkCore;
using Microsoft.EntityFrameworkCore.Metadata.Builders;
using Tienda.Domain.Entities;

namespace Tienda.Infrastructure.Persistencia.Configuraciones;

internal sealed class ClienteConfiguracion : EntidadConfiguracion<Cliente>
{
    protected override string Tabla => "clientes";

    protected override void ConfigurarEntidad(EntityTypeBuilder<Cliente> builder)
    {
        builder.Property(c => c.Nombre)
            .IsRequired()
            .HasMaxLength(Cliente.LongitudMaximaNombre);

        builder.Property(c => c.Email)
            .IsRequired()
            .HasMaxLength(Cliente.LongitudMaximaEmail);

        builder.Property(c => c.Telefono)
            .HasMaxLength(Cliente.LongitudMaximaTelefono);

        builder.HasIndex(c => c.Email).IsUnique();

        builder.OwnsOne(c => c.Direccion, direccion =>
        {
            direccion.Property(d => d.Linea).IsRequired().HasMaxLength(Direccion.LongitudMaximaLinea);
            direccion.Property(d => d.Ciudad).IsRequired().HasMaxLength(Direccion.LongitudMaximaCiudad);
            direccion.Property(d => d.Departamento).IsRequired().HasMaxLength(Direccion.LongitudMaximaDepartamento);
            direccion.Property(d => d.CodigoPostal).IsRequired().HasMaxLength(Direccion.LongitudMaximaCodigoPostal);
        });

        builder.Navigation(c => c.Direccion).IsRequired();
    }
}
::

§OwnsOne§ declara que §Direccion§ es un **tipo poseído**: el objeto de valor del paso 6. No tiene tabla propia ni Id; sus cuatro propiedades se guardan como **columnas de la tabla §clientes§** (§direccion_linea§, §direccion_ciudad§...). Al leer un cliente, EF reconstruye el objeto §Direccion§ con esas columnas. Es la forma estándar de persistir un objeto de valor.

## Configuración de Pedido y de LineaPedido

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/Configuraciones/PedidoConfiguracion.cs
using Microsoft.EntityFrameworkCore;
using Microsoft.EntityFrameworkCore.Metadata.Builders;
using Tienda.Domain.Entities;

namespace Tienda.Infrastructure.Persistencia.Configuraciones;

internal sealed class PedidoConfiguracion : EntidadConfiguracion<Pedido>
{
    protected override string Tabla => "pedidos";

    protected override void ConfigurarEntidad(EntityTypeBuilder<Pedido> builder)
    {
        builder.Property(p => p.Estado)
            .HasConversion<string>()
            .HasMaxLength(20)
            .IsRequired();

        builder.Ignore(p => p.Total);

        builder.HasIndex(p => p.ClienteId);

        builder.HasOne<Cliente>()
            .WithMany()
            .HasForeignKey(p => p.ClienteId)
            .OnDelete(DeleteBehavior.Restrict);

        builder.HasMany(p => p.Lineas)
            .WithOne()
            .HasForeignKey(l => l.PedidoId)
            .OnDelete(DeleteBehavior.Cascade);

        builder.Navigation(p => p.Lineas).UsePropertyAccessMode(PropertyAccessMode.Field);
    }
}
::

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/Configuraciones/LineaPedidoConfiguracion.cs
using Microsoft.EntityFrameworkCore;
using Microsoft.EntityFrameworkCore.Metadata.Builders;
using Tienda.Domain.Entities;

namespace Tienda.Infrastructure.Persistencia.Configuraciones;

internal sealed class LineaPedidoConfiguracion : EntidadConfiguracion<LineaPedido>
{
    protected override string Tabla => "lineas_pedido";

    protected override void ConfigurarEntidad(EntityTypeBuilder<LineaPedido> builder)
    {
        builder.Property(l => l.NombreProducto)
            .IsRequired()
            .HasMaxLength(Producto.LongitudMaximaNombre);

        builder.Property(l => l.PrecioUnitario).HasPrecision(18, 2);

        builder.Ignore(l => l.Subtotal);

        builder.HasIndex(l => new { l.PedidoId, l.ProductoId }).IsUnique();

        builder.HasOne(l => l.Producto)
            .WithMany()
            .HasForeignKey(l => l.ProductoId)
            .OnDelete(DeleteBehavior.Restrict);
    }
}
::

Puntos que merecen atención:

- **Estado como texto.** §HasConversion<string>()§ guarda el enum como §'Pendiente'§, §'Pagado'§ o §'Cancelado'§ en lugar de 1, 2 o 3. Al mirar la tabla se entiende sin tabla de equivalencias, y reordenar el enum no corrompe los datos.
- **§Ignore§ para propiedades calculadas.** §Total§ y §Subtotal§ no se guardan: se calculan sumando las líneas. Duplicarlas en la base abriría la puerta a que se desincronicen.
- **El pedido no conoce a su cliente como objeto.** Solo guarda §ClienteId§. §HasOne<Cliente>()§ sin expresión le dice a EF que existe la relación (y por tanto la clave foránea) aunque la clase §Pedido§ no tenga una propiedad §Cliente§.
- **Cascada dentro del agregado.** §DeleteBehavior.Cascade§ en las líneas significa que, si se borra un pedido, se borran sus líneas: son parte de él. Es el comportamiento correcto **dentro** de un agregado.
- **Acceso por campo.** §Lineas§ es de solo lectura y por detrás hay una lista privada §_lineas§. §UsePropertyAccessMode(PropertyAccessMode.Field)§ le indica a EF que llene directamente ese campo (que encuentra por convención: nombre de la propiedad con guion bajo y minúscula). Así el encapsulamiento del paso 6 se mantiene intacto: EF no necesita un método público para agregar líneas.
- **Índice único (pedido, producto).** Refleja la regla de §AgregarLinea§: un mismo producto aparece una sola vez por pedido, con la cantidad sumada.
- **Sin DbSet para LineaPedido.** Las líneas solo se alcanzan a través del pedido (la raíz del agregado). No se agrega un acceso directo que invite a saltarse sus reglas.

## El DbContext

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/TiendaDbContext.cs
using Microsoft.EntityFrameworkCore;
using Tienda.Domain.Common;
using Tienda.Domain.Entities;

namespace Tienda.Infrastructure.Persistencia;

public class TiendaDbContext(DbContextOptions<TiendaDbContext> opciones, TimeProvider reloj)
    : DbContext(opciones)
{
    public DbSet<Categoria> Categorias => Set<Categoria>();

    public DbSet<Producto> Productos => Set<Producto>();

    public DbSet<Cliente> Clientes => Set<Cliente>();

    public DbSet<Pedido> Pedidos => Set<Pedido>();

    protected override void OnModelCreating(ModelBuilder modelo)
    {
        modelo.ApplyConfigurationsFromAssembly(typeof(TiendaDbContext).Assembly);
        ConvencionSnakeCase.Aplicar(modelo);
    }

    public override Task<int> SaveChangesAsync(bool acceptAllChangesOnSuccess, CancellationToken cancellationToken = default)
    {
        AplicarAuditoria();
        return base.SaveChangesAsync(acceptAllChangesOnSuccess, cancellationToken);
    }

    private void AplicarAuditoria()
    {
        var ahora = reloj.GetUtcNow().UtcDateTime;

        foreach (var entrada in ChangeTracker.Entries<Entidad>())
        {
            if (entrada.State == EntityState.Added)
                entrada.Property(e => e.CreadoEnUtc).CurrentValue = ahora;
            else if (entrada.State == EntityState.Modified)
                entrada.Property(e => e.ActualizadoEnUtc).CurrentValue = ahora;
        }
    }
}
::

Qué hace cada parte:

- La clase es §public§ porque las herramientas de migraciones (paso 11) y, más adelante, las pruebas necesitan verla. Recibe las opciones (cadena de conexión y proveedor) y el reloj **por constructor**: inyección de dependencias otra vez.
- Las propiedades §DbSet§ son la puerta de entrada a cada tabla. §Set<T>()§ obtiene el conjunto del tipo indicado.
- §OnModelCreating§ se ejecuta una vez, al construir el modelo. Primero aplica todas las configuraciones del ensamblado y después convierte los nombres de columna.
- §SaveChangesAsync§ se **sobrescribe** (*override*): antes de guardar, recorre los objetos rastreados que son §Entidad§ y llena las fechas de auditoría. Las entidades nuevas reciben §CreadoEnUtc§; las modificadas, §ActualizadoEnUtc§. Se usa §entrada.Property(...)§ y no el setter de la clase porque en el dominio esos setters son privados: EF sí puede escribirlos, el resto del código no.
- Sobrescribimos la versión con el parámetro §acceptAllChangesOnSuccess§ porque la versión corta del método la invoca internamente.

> [oop Polimorfismo] Esto es polimorfismo por sobrescritura: quien llama a §SaveChangesAsync§ sobre un §DbContext§ ejecuta, sin saberlo, nuestra versión extendida. Agregamos un comportamiento transversal (auditar) sin que ninguna entidad ni repositorio tenga que acordarse de hacerlo.

## La unidad de trabajo

Implementa §IUnidadDeTrabajo§. Además de guardar, traduce los errores técnicos de la base a las excepciones de negocio que el dominio ya conoce, de modo que las capas superiores nunca vean un tipo de Npgsql.

::code csharp nuevo src/Tienda.Infrastructure/Persistencia/UnidadDeTrabajo.cs
using Microsoft.EntityFrameworkCore;
using Npgsql;
using Tienda.Application.Comun;
using Tienda.Domain.Exceptions;

namespace Tienda.Infrastructure.Persistencia;

internal sealed class UnidadDeTrabajo(TiendaDbContext contexto) : IUnidadDeTrabajo
{
    public async Task<int> GuardarCambiosAsync(CancellationToken cancellationToken = default)
    {
        try
        {
            return await contexto.SaveChangesAsync(cancellationToken);
        }
        catch (DbUpdateException ex) when (ex.InnerException is PostgresException { SqlState: PostgresErrorCodes.UniqueViolation })
        {
            throw new ConflictoException("Ya existe un registro con ese valor, que debe ser único.");
        }
        catch (DbUpdateException ex) when (ex.InnerException is PostgresException { SqlState: PostgresErrorCodes.ForeignKeyViolation })
        {
            throw new ConflictoException("La operación no es posible porque hay datos relacionados.");
        }
    }
}
::

- §DbUpdateException§ es la excepción con la que EF envuelve los fallos al guardar. Su §InnerException§ es el error original de PostgreSQL.
- §when (...)§ es un **filtro de excepción**: el §catch§ solo se activa si la condición es verdadera. Los demás errores siguen su camino sin tocarse.
- §PostgresException { SqlState: ... }§ es un **patrón de propiedad**: comprueba el tipo y, a la vez, el valor de una propiedad. Los códigos §23505§ (violación de unicidad) y §23503§ (violación de clave foránea) están como constantes en §PostgresErrorCodes§.
- Es la red de seguridad de la que hablamos antes: si dos personas crean el mismo SKU en el mismo instante, la validación previa de ambas dirá "libre", pero el índice único rechazará la segunda y el usuario recibirá un 409 en lugar de un error 500.

## El repositorio base

::code csharp nuevo src/Tienda.Infrastructure/Repositorios/RepositorioBase.cs
using Microsoft.EntityFrameworkCore;
using Tienda.Application.Comun;
using Tienda.Domain.Common;
using Tienda.Infrastructure.Persistencia;

namespace Tienda.Infrastructure.Repositorios;

internal abstract class RepositorioBase<T>(TiendaDbContext contexto) : IRepositorio<T> where T : Entidad
{
    protected TiendaDbContext Contexto { get; } = contexto;

    protected DbSet<T> Conjunto => Contexto.Set<T>();

    public async Task<T?> ObtenerPorIdAsync(int id, CancellationToken cancellationToken = default) =>
        await Conjunto.FindAsync(new object[] { id }, cancellationToken);

    public async Task<IReadOnlyList<T>> ListarAsync(CancellationToken cancellationToken = default) =>
        await Conjunto.AsNoTracking().OrderBy(e => e.Id).ToListAsync(cancellationToken);

    public void Agregar(T entidad) => Conjunto.Add(entidad);

    public void Eliminar(T entidad) => Conjunto.Remove(entidad);
}
::

- §abstract§: nunca se instancia sola; existe para ser heredada.
- §protected§: los miembros son visibles para las clases derivadas pero no para el exterior (encapsulamiento con herencia).
- §FindAsync§ busca por clave primaria y **primero mira lo que el contexto ya tiene en memoria**, evitando una consulta repetida.
- §Agregar§ y §Eliminar§ no son asíncronos y no tocan la base: solo **marcan** el objeto en el Change Tracker. El §INSERT§ o §DELETE§ real ocurre al llamar a la unidad de trabajo.
- §ListarAsync§ usa §AsNoTracking§ y ordena por §Id§: un orden explícito hace los resultados predecibles.

## Repositorio de categorías

::code csharp nuevo src/Tienda.Infrastructure/Repositorios/CategoriaRepositorio.cs
using Microsoft.EntityFrameworkCore;
using Tienda.Application.Categorias;
using Tienda.Domain.Entities;
using Tienda.Infrastructure.Persistencia;

namespace Tienda.Infrastructure.Repositorios;

internal sealed class CategoriaRepositorio(TiendaDbContext contexto)
    : RepositorioBase<Categoria>(contexto), ICategoriaRepositorio
{
    public Task<bool> ExisteNombreAsync(string nombre, int? excluirId, CancellationToken cancellationToken = default)
    {
        var normalizado = nombre.Trim().ToLowerInvariant();

        return Contexto.Categorias.AnyAsync(
            c => c.Nombre.ToLower() == normalizado && (excluirId == null || c.Id != excluirId),
            cancellationToken);
    }

    public Task<bool> TieneProductosAsync(int categoriaId, CancellationToken cancellationToken = default) =>
        Contexto.Productos.AnyAsync(p => p.CategoriaId == categoriaId, cancellationToken);
}
::

Observa la cabecera: la clase **hereda** de §RepositorioBase<Categoria>§ e **implementa** §ICategoriaRepositorio§. La herencia le da las cuatro operaciones comunes; la interfaz la compromete con las dos específicas.

- §normalizado§ se calcula en C# **antes** de la consulta. Dentro de la expresión solo entra lo que EF debe traducir a SQL (§lower(nombre) = 'valor'§).
- §excluirId§ sirve para el caso de editar: al validar el nombre de la categoría 3 hay que ignorar a la propia categoría 3.
- §AnyAsync§ se traduce a §SELECT EXISTS(...)§: responde sí o no sin traer filas.

## Repositorio de productos

::code csharp nuevo src/Tienda.Infrastructure/Repositorios/ProductoRepositorio.cs
using Microsoft.EntityFrameworkCore;
using Tienda.Application.Comun;
using Tienda.Application.Productos;
using Tienda.Domain.Entities;
using Tienda.Infrastructure.Persistencia;

namespace Tienda.Infrastructure.Repositorios;

internal sealed class ProductoRepositorio(TiendaDbContext contexto)
    : RepositorioBase<Producto>(contexto), IProductoRepositorio
{
    public async Task<ResultadoPaginado<Producto>> BuscarAsync(FiltroProductos filtro, CancellationToken cancellationToken = default)
    {
        IQueryable<Producto> consulta = Contexto.Productos
            .AsNoTracking()
            .Include(p => p.Categoria);

        if (filtro.SoloActivos)
            consulta = consulta.Where(p => p.Activo);

        if (!string.IsNullOrWhiteSpace(filtro.Texto))
        {
            var patron = $"%{EscaparComodines(filtro.Texto.Trim())}%";
            consulta = consulta.Where(p => EF.Functions.ILike(p.Nombre, patron) || EF.Functions.ILike(p.Sku, patron));
        }

        if (filtro.CategoriaId is int categoriaId)
            consulta = consulta.Where(p => p.CategoriaId == categoriaId);

        if (filtro.PrecioMinimo is decimal minimo)
            consulta = consulta.Where(p => p.Precio >= minimo);

        if (filtro.PrecioMaximo is decimal maximo)
            consulta = consulta.Where(p => p.Precio <= maximo);

        var total = await consulta.CountAsync(cancellationToken);

        var items = await consulta
            .OrderBy(p => p.Nombre)
            .ThenBy(p => p.Id)
            .Skip((filtro.Pagina - 1) * filtro.TamanoPagina)
            .Take(filtro.TamanoPagina)
            .ToListAsync(cancellationToken);

        return new ResultadoPaginado<Producto>(items, filtro.Pagina, filtro.TamanoPagina, total);
    }

    public Task<bool> ExisteSkuAsync(string sku, int? excluirId, CancellationToken cancellationToken = default)
    {
        var normalizado = sku.Trim().ToUpperInvariant();

        return Contexto.Productos.AnyAsync(
            p => p.Sku == normalizado && (excluirId == null || p.Id != excluirId),
            cancellationToken);
    }

    public async Task<IReadOnlyList<Producto>> ObtenerPorIdsAsync(IReadOnlyCollection<int> ids, CancellationToken cancellationToken = default)
    {
        var lista = ids.ToArray();

        return await Contexto.Productos
            .Where(p => lista.Contains(p.Id))
            .ToListAsync(cancellationToken);
    }

    private static string EscaparComodines(string texto) =>
        texto.Replace("\\", "\\\\").Replace("%", "\\%").Replace("_", "\\_");
}
::

La búsqueda es el método más rico del proyecto:

- La variable se declara como §IQueryable<Producto>§ y **se va ampliando** con §Where§ según los filtros recibidos. Una consulta §IQueryable§ **no se ejecuta** al construirla: es una descripción. Solo se envía a la base cuando se materializa con §CountAsync§ o §ToListAsync§. Por eso agregar filtros no cuesta nada hasta el final.
- §filtro.CategoriaId is int categoriaId§ es un patrón de declaración: si el valor nulable tiene valor, lo extrae en una variable.
- §EF.Functions.ILike§ es la búsqueda por patrón **sin distinguir mayúsculas** propia de PostgreSQL. El patrón §%texto%§ significa "contiene el texto".
- §EscaparComodines§ neutraliza los caracteres §%§, §_§ y §\§ que escriba el usuario. Sin eso, buscar "50%" o "a_b" se comportaría como un comodín. Es una defensa de calidad, no de seguridad: los valores igualmente viajan como **parámetros** y nunca se concatenan al SQL, que es lo que evita la inyección.
- §Include(p => p.Categoria)§ le pide a EF unir (§JOIN§) la tabla de categorías para que el nombre de la categoría llegue en la misma consulta. Sin él, §p.Categoria§ vendría nulo.
- Se hacen **dos consultas**: una para contar el total y otra para traer la página. §Skip§ salta los registros de las páginas anteriores y §Take§ limita la cantidad. Como el orden es explícito (§OrderBy§ más §ThenBy§ por §Id§ para desempatar), páginas consecutivas nunca repiten ni omiten filas.
- §ObtenerPorIdsAsync§ **sí rastrea** los productos: se usa al crear un pedido, donde el stock de esos productos va a cambiar y debe guardarse.

> [ojo] Las comparaciones de texto con §ToLower()§ dentro de una expresión LINQ se convierten en la función §lower()§ de SQL. Funciona, pero no usa un índice normal. Para un catálogo pequeño no importa; en una tabla grande se resolvería con un índice sobre la expresión o con una columna de tipo §citext§.

::code csharp nuevo src/Tienda.Infrastructure/Repositorios/PedidoRepositorio.cs
using Microsoft.EntityFrameworkCore;
using Tienda.Application.Pedidos;
using Tienda.Domain.Entities;
using Tienda.Infrastructure.Persistencia;

namespace Tienda.Infrastructure.Repositorios;

internal sealed class PedidoRepositorio(TiendaDbContext contexto)
    : RepositorioBase<Pedido>(contexto), IPedidoRepositorio
{
    public Task<Pedido?> ObtenerConLineasAsync(int id, CancellationToken cancellationToken = default) =>
        Contexto.Pedidos
            .Include(p => p.Lineas)
            .ThenInclude(l => l.Producto)
            .FirstOrDefaultAsync(p => p.Id == id, cancellationToken);

    public async Task<IReadOnlyList<Pedido>> ListarPorClienteAsync(int clienteId, CancellationToken cancellationToken = default) =>
        await Contexto.Pedidos
            .AsNoTracking()
            .Include(p => p.Lineas)
            .Where(p => p.ClienteId == clienteId)
            .OrderByDescending(p => p.CreadoEnUtc)
            .ToListAsync(cancellationToken);
}

- §ObtenerConLineasAsync§ carga **el agregado completo**: el pedido, sus líneas y el producto de cada línea (§ThenInclude§ baja un nivel). Se usa con seguimiento porque quien lo pida lo va a modificar (pagar o cancelar, que devuelve stock a los productos).
- §ListarPorClienteAsync§ es solo de lectura: sin seguimiento y sin cargar los productos, porque cada línea ya guarda el nombre y el precio como copia.
- No hay un repositorio de líneas: se llega a ellas a través del pedido.

## Registrar todo en el contenedor

Un solo método de extensión concentra el registro de la capa. Así la API no necesita conocer las clases §internal§ de Infrastructure.

::code csharp nuevo src/Tienda.Infrastructure/DependenciasInfraestructura.cs
using Microsoft.EntityFrameworkCore;
using Microsoft.Extensions.DependencyInjection;
using Tienda.Application.Categorias;
using Tienda.Application.Clientes;
using Tienda.Application.Comun;
using Tienda.Application.Pedidos;
using Tienda.Application.Productos;
using Tienda.Infrastructure.Persistencia;
using Tienda.Infrastructure.Repositorios;

namespace Tienda.Infrastructure;

public static class DependenciasInfraestructura
{
    public static IServiceCollection AddInfraestructura(this IServiceCollection servicios, string cadenaConexion)
    {
        servicios.AddSingleton(TimeProvider.System);

        servicios.AddDbContext<TiendaDbContext>(opciones => opciones.UseNpgsql(cadenaConexion));

        servicios.AddScoped<IUnidadDeTrabajo, UnidadDeTrabajo>();
        servicios.AddScoped<ICategoriaRepositorio, CategoriaRepositorio>();
        servicios.AddScoped<IProductoRepositorio, ProductoRepositorio>();
        servicios.AddScoped<IClienteRepositorio, ClienteRepositorio>();
        servicios.AddScoped<IPedidoRepositorio, PedidoRepositorio>();

        return servicios;
    }
}
::

- §this IServiceCollection servicios§ convierte el método en una **extensión**: se invoca como si fuera un método de §IServiceCollection§, igual que §AddControllers()§.
- Cada línea §AddScoped<Interfaz, Implementación>()§ dice "cuando alguien pida la interfaz, entrégale una instancia de esta clase, una por petición".
- §AddDbContext§ registra el contexto como Scoped y le entrega las opciones con la cadena de conexión y el proveedor Npgsql.
- Recibe la cadena como texto en lugar de leer la configuración: Infrastructure no necesita saber **de dónde** vino. Ese es trabajo de la API.

# Teoría

## El problema que resuelven las migraciones

El código evoluciona: hoy el producto tiene nombre y precio, mañana tendrá un peso. La base de datos tiene que cambiar **a la par** y de la misma forma en el equipo de cada integrante, en el servidor de pruebas y en producción. Hacerlo a mano ("ejecuta este SQL en tu base") es una receta para que cada entorno quede distinto.

Una **migración** es un archivo de código, versionado en Git, que describe **un cambio de esquema**: qué crear, qué modificar y cómo deshacerlo. Se aplican en orden y la base recuerda cuáles ya recibió.

## Anatomía de una migración

Cada migración genera dos archivos y mantiene un tercero:

| Archivo | Qué contiene |
|---|---|
| §20260101120000_Inicial.cs§ | Dos métodos: §Up§ (aplicar el cambio) y §Down§ (revertirlo). El prefijo numérico es la fecha y hora de creación y define el orden |
| §20260101120000_Inicial.Designer.cs§ | Metadatos internos de EF. No se toca |
| §TiendaDbContextModelSnapshot.cs§ | Una **fotografía del modelo completo** tal como quedó tras la última migración |

La instantánea es la clave: cuando pides una migración nueva, EF compara tu modelo actual contra esa fotografía y deduce **solo la diferencia**. Por eso la instantánea se genera sola y nunca se edita a mano.

En la base, EF crea una tabla §__EFMigrationsHistory§ donde anota el identificador de cada migración aplicada. Al ejecutar §database update§ aplica las que falten.

## El ciclo de trabajo

1. Cambias el modelo (una entidad o su configuración).
2. Creas una migración: §dotnet ef migrations add Nombre§.
3. **Lees** el archivo generado. EF puede equivocarse, por ejemplo interpretar un cambio de nombre como "borrar columna y crear otra", lo que perdería datos.
4. Aplicas: §dotnet ef database update§.
5. Haces commit del modelo, de la migración y de la instantánea **juntos**.

> [ojo] **Una migración que ya se aplicó en otro entorno nunca se edita.** Si descubres un error, crea una migración nueva que lo corrija. Editar historia compartida deja a cada base en un estado distinto sin que nadie se entere. La única excepción es una migración que solo existe en tu equipo y que no has subido: esa se puede quitar con §migrations remove§ y rehacer.

## Las herramientas de línea de comandos

Los comandos §dotnet ef§ vienen en una herramienta llamada **dotnet-ef**. Se puede instalar de forma global (para todo el equipo de cómputo) o **local al repositorio** mediante un archivo manifiesto. Usamos la opción local: la versión queda escrita en el repositorio y todo el grupo usa la misma.

Los comandos necesitan saber dos cosas:

- **--project**: dónde está el §DbContext§ y dónde se guardarán las migraciones (Infrastructure).
- **--startup-project**: qué proyecto arrancar para obtener la configuración y la cadena de conexión (Api).

## Datos iniciales: dos formas

| Forma | Cómo funciona | Ventaja | Problema |
|---|---|---|---|
| §HasData§ en el modelo | Los datos viajan dentro de una migración | Forman parte del historial de esquema | Exige Ids fijos y valores para todas las columnas, incluso las privadas; es rígido con un modelo rico |
| Sembrador en código | Una clase que inserta si la tabla está vacía | Usa los constructores del dominio, así que **los datos de ejemplo pasan por las mismas reglas** | Hay que ejecutarlo explícitamente |

Elegimos el sembrador. Si alguien cambia una regla del dominio y los datos de ejemplo la incumplen, el sembrador falla de inmediato, lo que es una forma barata de detectarlo.

> [oop Encapsulamiento] Observa que el sembrador no puede escribir §Precio = 189900§ directamente, porque el setter es privado. Está **obligado** a crear productos con el constructor, que valida. El encapsulamiento protege incluso a los datos de ejemplo.

::code csharp ver Fragmento ilustrativo del método Up
migrationBuilder.CreateTable(
    name: "categorias",
    columns: table => new
    {
        id = table.Column<int>(type: "integer", nullable: false)
            .Annotation("Npgsql:ValueGenerationStrategy", NpgsqlValueGenerationStrategy.IdentityByDefaultColumn),
        nombre = table.Column<string>(type: "character varying(100)", maxLength: 100, nullable: false),
        descripcion = table.Column<string>(type: "character varying(500)", maxLength: 500, nullable: true),
        creado_en_utc = table.Column<DateTime>(type: "timestamp with time zone", nullable: false),
        actualizado_en_utc = table.Column<DateTime>(type: "timestamp with time zone", nullable: true)
    },
    constraints: table =>
    {
        table.PrimaryKey("PK_categorias", x => x.id);
    });
::

Compara con lo que escribiste. Cada pieza es traducible:

- §HasMaxLength(100)§ se convirtió en §character varying(100)§.
- §IsRequired()§ se convirtió en §nullable: false§; una propiedad §string?§ quedó §nullable: true§.
- §IdentityByDefaultColumn§ hace que PostgreSQL asigne el §id§ automáticamente con una secuencia (el equivalente a "autoincremental").
- Los nombres ya están en snake_case gracias a la convención del paso anterior.

Revisa también que **no** haya instrucciones §DropTable§ ni §DropColumn§: en una migración inicial solo debe haber creaciones.

using Tienda.Domain.Entities;

internal static class SembradoDeDatos
{
    public static async Task SembrarAsync(TiendaDbContext contexto, CancellationToken cancellationToken = default)
    {
        if (await contexto.Categorias.AnyAsync(cancellationToken))
            return;

        var electronica = new Categoria("Electrónica", "Dispositivos y accesorios");
        var hogar = new Categoria("Hogar", "Artículos para la casa");
        var libros = new Categoria("Libros", "Libros impresos y digitales");

        contexto.Categorias.AddRange(electronica, hogar, libros);
        await contexto.SaveChangesAsync(cancellationToken);

        contexto.Productos.AddRange(
            new Producto("Audífonos inalámbricos", "ELE-001", 189900m, 25, electronica.Id, "Bluetooth 5.3 y 30 horas de batería"),
            new Producto("Cargador USB-C 65 W", "ELE-002", 79900m, 40, electronica.Id),
            new Producto("Teclado mecánico", "ELE-003", 249900m, 12, electronica.Id, "Interruptores táctiles, distribución en español"),
            new Producto("Lámpara de escritorio LED", "HOG-001", 99900m, 30, hogar.Id),
            new Producto("Juego de sábanas doble", "HOG-002", 139900m, 18, hogar.Id, "Algodón, 180 hilos"),
            new Producto("Cafetera de goteo", "HOG-003", 159900m, 3, hogar.Id, "Capacidad de 12 tazas"),
            new Producto("Cien años de soledad", "LIB-001", 54900m, 50, libros.Id, "Edición de bolsillo"),
            new Producto("Clean Code", "LIB-002", 129900m, 8, libros.Id, "Robert C. Martin"),
            new Producto("Manual de C# 14", "LIB-003", 99900m, 0, libros.Id, "Agotado temporalmente"));

        contexto.Clientes.AddRange(
            new Cliente("Ana Gómez", "ana@example.com", "3001234567",
                new Direccion("Calle 10 # 5-20", "Medellín", "Antioquia", "050001")),
            new Cliente("Luis Pérez", "luis@example.com", null,
                new Direccion("Carrera 7 # 32-16", "Bogotá", "Cundinamarca", "110111")));

- La primera línea hace al sembrador **idempotente**: si ya existen categorías no hace nada. Se puede ejecutar mil veces con el mismo resultado.
- Primero se guardan las categorías porque necesitamos sus §Id§, que PostgreSQL asigna al insertar. Tras el primer §SaveChangesAsync§, §electronica.Id§ ya tiene su valor real.
- Hay productos pensados para casos que probaremos más adelante: la cafetera con solo 3 unidades (stock bajo) y el manual con 0 (agotado).

::code csharp nuevo src/Tienda.Infrastructure/Inicializacion/InicializacionBaseDeDatos.cs
using Microsoft.Extensions.DependencyInjection;
using Tienda.Infrastructure.Persistencia;

namespace Tienda.Infrastructure.Inicializacion;

public static class InicializacionBaseDeDatos
{
    public static async Task InicializarBaseDeDatosAsync(this IServiceProvider servicios, CancellationToken cancellationToken = default)
    {
        await using var alcance = servicios.CreateAsyncScope();
        var contexto = alcance.ServiceProvider.GetRequiredService<TiendaDbContext>();

        await SembradoDeDatos.SembrarAsync(contexto, cancellationToken);
    }
}
::

- Fuera de una petición HTTP no existe un "alcance" (*scope*) automático. Como el §DbContext§ es Scoped, hay que **crear uno a mano** con §CreateAsyncScope()§. El §await using§ lo libera al terminar.
- La clase pública expone un solo método; el sembrador queda §internal§. La API no necesita saber cómo se siembra, solo pedir que se inicialice.

> [oop Responsabilidad única] Sembrar datos no es tarea del contexto, ni de las migraciones, ni de la API: tiene su propia clase. Cada pieza tiene una sola razón para cambiar.

| Comando | Para qué sirve |
|---|---|
| dotnet ef migrations add Nombre | Crea una migración con los cambios del modelo |
| dotnet ef migrations list | Lista las migraciones y cuáles están aplicadas |
| dotnet ef migrations remove | Elimina la **última** migración, si no se aplicó |
| dotnet ef database update | Aplica las migraciones pendientes |
| dotnet ef database update NombreAnterior | Revierte hasta la migración indicada (ejecuta los §Down§) |

| dotnet ef migrations script | Genera el SQL para revisarlo o ejecutarlo en otro entorno |

# Teoría

## Los tres actores de un endpoint

Una petición HTTP atraviesa tres piezas, cada una con un trabajo distinto:

| Pieza | Capa | Trabajo | Lo que NO hace |
|---|---|---|---|
| Controlador | Api | Recibir la petición, llamar al servicio y traducir el resultado a una respuesta HTTP | Reglas de negocio, consultas, transacciones |
| Servicio de aplicación | Application | Coordinar un caso de uso: buscar, pedirle al dominio que actúe, guardar | Saber de HTTP o de SQL |
| Entidad | Domain | Aplicar las reglas y mantenerse válida | Saber de bases de datos o de HTTP |

Por eso decimos que un controlador debe ser **delgado**. Si un controlador contiene un §if§ de negocio, esa regla no se podrá reutilizar desde otro punto de entrada (un trabajo programado, una consola, una prueba).

> [oop Responsabilidad única] Cada pieza tiene una sola razón para cambiar. El controlador cambia si cambia el protocolo (una ruta, un código HTTP). El servicio cambia si cambia el caso de uso. La entidad cambia si cambia la regla. Cuando una regla nueva obliga a editar solo la entidad, el diseño está funcionando.

## Qué es un DTO y por qué no devolvemos entidades

Un **DTO** (Data Transfer Object) es un objeto simple cuyo único propósito es **viajar** entre capas o por la red. Nunca devolvemos las entidades directamente en la API por tres razones:

1. **El contrato público queda congelado.** Si renombras una propiedad de la entidad, el DTO protege a los clientes (el frontend) de ese cambio interno.
2. **Controlas qué se expone.** Una entidad podría tener datos internos que no deben salir; el DTO incluye solo lo que decides.
3. **Evitas problemas técnicos.** Las entidades con referencias circulares (un pedido que apunta a líneas que apuntan al pedido) rompen la conversión a JSON.

Del mismo modo, los datos que **entran** se reciben en objetos de solicitud, no en entidades. Si se aceptara la entidad directamente, un cliente malintencionado podría enviar campos que nunca debió poder establecer (*over-posting*).

## Dos tipos de validación

| Tipo | Pregunta | Quién lo valida | Código HTTP |
|---|---|---|---|
| Forma de la petición | ¿Llegó un JSON legible con los campos obligatorios? | ASP.NET Core, antes de llamar al controlador | 400 |
| Reglas de negocio | ¿Tiene sentido para el negocio? (nombre vacío, precio negativo) | El dominio | 422 |
| Estado actual | ¿Choca con lo que ya existe? (nombre repetido) | El servicio, consultando el repositorio | 409 |

Distinguirlos le permite al frontend reaccionar bien: un 400 es un error de programación del cliente; un 422 o un 409 es un mensaje que se muestra al usuario.

## Manejo de errores centralizado

Si cada acción del controlador tuviera su propio §try/catch§, el código se llenaría de repeticiones y se olvidaría alguno. En su lugar el dominio **lanza** excepciones con significado y un único componente las traduce a respuestas HTTP. ASP.NET Core ofrece para eso la interfaz §IExceptionHandler§: una cadena de manejadores; cada uno decide si se hace cargo de la excepción.

El formato de la respuesta es el estándar **ProblemDetails** (RFC 9457): un JSON con campos conocidos (§status§, §title§, §detail§, §type§). Cualquier cliente que conozca el estándar lo entiende.

> [oop Polimorfismo] §IExceptionHandler§ es un contrato. ASP.NET Core llama a cada manejador registrado sin conocer su clase concreta. Puedes agregar uno nuevo (por ejemplo, para errores de base de datos) y el resto del programa no se entera.

> [info] La traducción de excepción a código HTTP se hace con un §switch§ por **tipo**, nunca leyendo el texto del mensaje. Por eso en el paso 4 creamos una jerarquía de excepciones: el tipo es el contrato; el mensaje es solo para humanos.

{

::code csharp nuevo src/Tienda.Application/Categorias/CategoriaDto.cs
using Tienda.Domain.Entities;

namespace Tienda.Application.Categorias;

public sealed record CategoriaDto(int Id, string Nombre, string? Descripcion)
{
    public static CategoriaDto Desde(Categoria categoria) =>
        new(categoria.Id, categoria.Nombre, categoria.Descripcion);
}
::

- §required§ (C# 11) obliga a que quien cree el objeto asigne esa propiedad. Con el convertidor JSON de .NET, si el JSON recibido **no trae** §nombre§, la petición se rechaza con 400 antes de llegar al servicio.
- §init§ permite asignar el valor al crear el objeto y lo bloquea después: la solicitud es **inmutable**.
- §Descripcion§ es §string?§: opcional, puede faltar o ser §null§.
- §Desde§ es un **método de fábrica estático**: concentra la conversión entidad a DTO en un único lugar. Si el DTO gana un campo, solo se edita aquí.
- La solicitud se usa tanto para crear como para actualizar, porque en esta tienda ambas operaciones reciben los mismos datos.

### La implementación del servicio

::code csharp nuevo src/Tienda.Application/Categorias/CategoriaServicio.cs
using Tienda.Application.Comun;
using Tienda.Domain.Entities;
using Tienda.Domain.Exceptions;

namespace Tienda.Application.Categorias;

internal sealed class CategoriaServicio(ICategoriaRepositorio categorias, IUnidadDeTrabajo unidadDeTrabajo)
    : ICategoriaServicio
{
    public async Task<IReadOnlyList<CategoriaDto>> ListarAsync(CancellationToken cancellationToken = default)
    {
        var lista = await categorias.ListarAsync(cancellationToken);
        return lista.Select(CategoriaDto.Desde).ToList();
    }

    public async Task<CategoriaDto> ObtenerAsync(int id, CancellationToken cancellationToken = default)
    {
        var categoria = await BuscarOFallarAsync(id, cancellationToken);
        return CategoriaDto.Desde(categoria);
    }

    public async Task<CategoriaDto> CrearAsync(CategoriaSolicitud solicitud, CancellationToken cancellationToken = default)
    {
        var categoria = new Categoria(solicitud.Nombre, solicitud.Descripcion);
        await ExigirNombreLibreAsync(categoria.Nombre, null, cancellationToken);

        categorias.Agregar(categoria);
        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);

        return CategoriaDto.Desde(categoria);
    }

    public async Task<CategoriaDto> ActualizarAsync(int id, CategoriaSolicitud solicitud, CancellationToken cancellationToken = default)
    {
        var categoria = await BuscarOFallarAsync(id, cancellationToken);

        categoria.Actualizar(solicitud.Nombre, solicitud.Descripcion);
        await ExigirNombreLibreAsync(categoria.Nombre, id, cancellationToken);

        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);

        return CategoriaDto.Desde(categoria);
    }

    public async Task EliminarAsync(int id, CancellationToken cancellationToken = default)
    {
        var categoria = await BuscarOFallarAsync(id, cancellationToken);

        if (await categorias.TieneProductosAsync(id, cancellationToken))
            throw new ConflictoException($"La categoría '{categoria.Nombre}' tiene productos y no se puede eliminar.");

        categorias.Eliminar(categoria);
        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);
    }

    private async Task<Categoria> BuscarOFallarAsync(int id, CancellationToken cancellationToken) =>
        await categorias.ObtenerPorIdAsync(id, cancellationToken)
        ?? throw new NoEncontradoException(nameof(Categoria), id);

    private async Task ExigirNombreLibreAsync(string nombre, int? excluirId, CancellationToken cancellationToken)
    {
        if (await categorias.ExisteNombreAsync(nombre, excluirId, cancellationToken))
            throw new ConflictoException($"Ya existe una categoría llamada '{nombre}'.");
    }
}
::

Cómo leerlo:

- El constructor primario recibe **interfaces**: el repositorio y la unidad de trabajo. El servicio no sabe que existe EF Core ni PostgreSQL. Esto es **composición**: el servicio *tiene* sus colaboradores, no hereda de ellos.
- Fíjate en el patrón de cada caso de uso: **1)** buscar, **2)** pedirle al dominio que actúe (§new Categoria§, §Actualizar§), **3)** comprobar lo que depende de otros datos, **4)** guardar. Las reglas internas (nombre vacío, largo máximo) las aplica la entidad; el servicio solo agrega la que requiere consultar la base (nombre repetido).
- En §CrearAsync§ la entidad se construye **primero**: si el nombre es vacío, el dominio lanza la excepción (422) sin hacer ninguna consulta. Después se usa §categoria.Nombre§, ya limpio de espacios, para la comprobación de unicidad.
- §?? throw ...§ significa "si el resultado es nulo, lanza esta excepción". Es la forma compacta de "buscar o fallar".
- §nameof(Categoria)§ produce el texto "Categoria" y se actualiza solo si renombras la clase.
- En §ActualizarAsync§ no se llama a §Agregar§ ni a ningún "update": la entidad está **rastreada** (la cargó el repositorio con seguimiento). Cuando §Actualizar§ cambia sus propiedades, el Change Tracker lo detecta y emite el §UPDATE§ al guardar.

> [oop Inversión de dependencias] Mira el §using§ del servicio: solo aparecen Application y Domain. No hay ninguna referencia a Infrastructure. Para probar este servicio podrías crear un repositorio falso en memoria y pasárselo al constructor.

> [oop Abstracción] El controlador ve cinco operaciones con nombres de negocio. Detrás hay repositorios, transacciones, consultas SQL, y nada de eso asoma. Una buena abstracción deja ver **qué** se hace y esconde **cómo**.

## Parte 2 · La capa Api

### El manejador de excepciones

::code csharp nuevo src/Tienda.Api/Errores/ManejadorDeExcepciones.cs
using Microsoft.AspNetCore.Diagnostics;
using Microsoft.AspNetCore.Mvc;
using Tienda.Domain.Exceptions;

namespace Tienda.Api.Errores;

public sealed class ManejadorDeExcepciones(
    IProblemDetailsService problemas,
    ILogger<ManejadorDeExcepciones> registro) : IExceptionHandler
{
    public async ValueTask<bool> TryHandleAsync(
        HttpContext contexto,
        Exception excepcion,
        CancellationToken cancellationToken)
    {
        var (estado, titulo) = excepcion switch
        {
            NoEncontradoException => (StatusCodes.Status404NotFound, "Recurso no encontrado"),
            ConflictoException => (StatusCodes.Status409Conflict, "Conflicto con el estado actual"),
            ReglaDeNegocioException => (StatusCodes.Status422UnprocessableEntity, "Regla de negocio incumplida"),
            _ => (StatusCodes.Status500InternalServerError, "Error inesperado")
        };

        if (estado == StatusCodes.Status500InternalServerError)
            registro.LogError(excepcion, "Error no controlado en {Metodo} {Ruta}", contexto.Request.Method, contexto.Request.Path);
        else
            registro.LogInformation("{Titulo}: {Mensaje}", titulo, excepcion.Message);

        contexto.Response.StatusCode = estado;

        return await problemas.TryWriteAsync(new ProblemDetailsContext
        {
            HttpContext = contexto,
            Exception = excepcion,
            ProblemDetails = new ProblemDetails
            {
                Status = estado,
                Title = titulo,
                Detail = estado == StatusCodes.Status500InternalServerError
                    ? "Ocurrió un error inesperado. Intenta de nuevo más tarde."
                    : excepcion.Message
            }
        });
    }
}
::

Qué hace cada parte:

- Implementa §IExceptionHandler§: su único método devuelve §true§ si manejó la excepción y §false§ si prefiere que lo intente el siguiente manejador.
- La expresión §excepcion switch { Tipo => ... }§ elige por **tipo**. Como §StockInsuficienteException§ hereda de §ConflictoException§, cae en la rama 409 sin que la nombremos: es polimorfismo por herencia trabajando.
- La rama §_§ (cualquier otra excepción) es un error inesperado: un fallo de programación o de infraestructura. Se registra con **todos sus detalles** en el log (§LogError§) pero al cliente se le devuelve un mensaje genérico. **Jamás** se envía al exterior el texto interno de una excepción inesperada: podría revelar rutas, nombres de tablas o cadenas de conexión.
- Los errores de negocio se registran a nivel informativo y sí devuelven su mensaje, que está escrito para personas.
- §{Metodo}§ y §{Ruta}§ en el mensaje de log son **plantillas con nombre**: el sistema de logging guarda cada valor como dato estructurado, no solo como texto.

> [ojo] En el manejador la desviación del principio abierto/cerrado es visible: para una nueva categoría de error habría que editar el §switch§. Es un compromiso aceptable aquí por claridad. Una alternativa más extensible sería que cada excepción de dominio declarase su propio código HTTP; el dominio quedaría entonces contaminado con conceptos de HTTP, que es lo que quisimos evitar.

### El controlador

::code csharp nuevo src/Tienda.Api/Controllers/CategoriasController.cs
using Microsoft.AspNetCore.Mvc;
using Tienda.Application.Categorias;

namespace Tienda.Api.Controllers;

[ApiController]
[Route("api/[controller]")]
[Produces("application/json")]
public class CategoriasController(ICategoriaServicio servicio) : ControllerBase
{
    [HttpGet]
    public async Task<ActionResult<IReadOnlyList<CategoriaDto>>> Listar(CancellationToken cancellationToken) =>
        Ok(await servicio.ListarAsync(cancellationToken));

    [HttpGet("{id:int}")]
    [ProducesResponseType<CategoriaDto>(StatusCodes.Status200OK)]
    [ProducesResponseType<ProblemDetails>(StatusCodes.Status404NotFound)]
    public async Task<ActionResult<CategoriaDto>> Obtener(int id, CancellationToken cancellationToken) =>
        Ok(await servicio.ObtenerAsync(id, cancellationToken));

    [HttpPost]
    [ProducesResponseType<CategoriaDto>(StatusCodes.Status201Created)]
    [ProducesResponseType<ProblemDetails>(StatusCodes.Status409Conflict)]
    [ProducesResponseType<ProblemDetails>(StatusCodes.Status422UnprocessableEntity)]
    public async Task<ActionResult<CategoriaDto>> Crear(CategoriaSolicitud solicitud, CancellationToken cancellationToken)
    {
        var creada = await servicio.CrearAsync(solicitud, cancellationToken);
        return CreatedAtAction(nameof(Obtener), new { id = creada.Id }, creada);
    }

    [HttpPut("{id:int}")]
    [ProducesResponseType<CategoriaDto>(StatusCodes.Status200OK)]
    [ProducesResponseType<ProblemDetails>(StatusCodes.Status404NotFound)]
    [ProducesResponseType<ProblemDetails>(StatusCodes.Status409Conflict)]
    [ProducesResponseType<ProblemDetails>(StatusCodes.Status422UnprocessableEntity)]
    public async Task<ActionResult<CategoriaDto>> Actualizar(int id, CategoriaSolicitud solicitud, CancellationToken cancellationToken) =>
        Ok(await servicio.ActualizarAsync(id, solicitud, cancellationToken));

    [HttpDelete("{id:int}")]
    [ProducesResponseType(StatusCodes.Status204NoContent)]
    [ProducesResponseType<ProblemDetails>(StatusCodes.Status404NotFound)]
    [ProducesResponseType<ProblemDetails>(StatusCodes.Status409Conflict)]
    public async Task<IActionResult> Eliminar(int id, CancellationToken cancellationToken)
    {
        await servicio.EliminarAsync(id, cancellationToken);
        return NoContent();
    }
}
::

Cómo leerlo:

- **Ni un solo §if§ de negocio.** Cada acción llama al servicio y da forma a la respuesta. Eso es un controlador delgado.
- **Verbos y rutas.** §[HttpGet]§, §[HttpPost]§, §[HttpPut]§, §[HttpDelete]§ asocian cada método con un verbo HTTP. §"{id:int}"§ es un parámetro de ruta con **restricción**: solo coincide si es un entero, así §/api/categorias/abc§ ni siquiera llega a la acción (responde 404).
- **Origen de los datos.** Gracias a §[ApiController]§, ASP.NET deduce que §solicitud§ viene del **cuerpo JSON**, §id§ de la **ruta** y §cancellationToken§ del cierre de la conexión por parte del cliente.
- **§CreatedAtAction§** devuelve 201 con la cabecera §Location§ apuntando a §Obtener§: la dirección del recurso recién creado. Es la convención REST para los POST que crean.
- **§NoContent()§** es el 204: la operación salió bien y no hay contenido que devolver.
- **§[ProducesResponseType]§** no cambia el comportamiento. Documenta qué respuestas puede dar cada acción, y el documento OpenAPI (y por tanto Scalar) las muestra. Las versiones genéricas (§<ProblemDetails>§) son de C# 11.
- **§[ApiController]§** también valida automáticamente la forma de la petición: si el JSON es inválido o falta un campo §required§, responde 400 con un ProblemDetails de validación sin ejecutar el método.
- Ya no hay §try/catch§: lo que lance el servicio lo atrapa el manejador global.

> [oop Inversión de dependencias] El controlador pide §ICategoriaServicio§ por constructor. No sabe quién lo implementa, ni cómo se construye, ni qué repositorio usa. El contenedor de dependencias ensambla toda la cadena: controlador, servicio, repositorio, contexto.

### Conectar todo en Program.cs

Esta es ya la versión casi definitiva del archivo. Fíjate en el **orden** del pipeline: el manejador de excepciones va primero, para envolver a todo lo que viene después.

::code csharp editar src/Tienda.Api/Program.cs
using Scalar.AspNetCore;
»using Tienda.Api.Errores;
»using Tienda.Application;
using Tienda.Infrastructure;
using Tienda.Infrastructure.Inicializacion;

var builder = WebApplication.CreateBuilder(args);

var cadenaConexion = builder.Configuration.GetConnectionString("Tienda")
    ?? throw new InvalidOperationException(
        "Falta la cadena de conexión 'Tienda'. Revisa el paso 9 (dotnet user-secrets).");

»builder.Services.AddRouting(opciones => opciones.LowercaseUrls = true);
builder.Services.AddControllers();
builder.Services.AddOpenApi();
»builder.Services.AddProblemDetails();
»builder.Services.AddExceptionHandler<ManejadorDeExcepciones>();
»builder.Services.AddAplicacion();
builder.Services.AddInfraestructura(cadenaConexion);

var app = builder.Build();

»app.UseExceptionHandler();
»app.UseStatusCodePages();

if (app.Environment.IsDevelopment())
{
    app.MapOpenApi();
    app.MapScalarApiReference();
    await app.Services.InicializarBaseDeDatosAsync();
}

app.UseHttpsRedirection();
app.UseAuthorization();
app.MapControllers();

app.Run();
::

- §AddRouting(... LowercaseUrls = true)§ hace que las direcciones que la API **genera** (como la cabecera §Location§) salgan en minúsculas: §/api/categorias/4§.
- §AddProblemDetails()§ registra el servicio que escribe respuestas en formato ProblemDetails.
- §AddExceptionHandler<T>()§ añade nuestro manejador a la cadena. §UseExceptionHandler()§ activa el middleware que invoca esa cadena.
- §UseStatusCodePages()§ completa los casos en que la respuesta tiene un código de error pero **no tiene cuerpo** (una ruta que no existe, un método no permitido): les agrega un ProblemDetails, de modo que **todos** los errores de la API tengan el mismo formato.

# Teoría

## Recursos, verbos y qué significa cada uno

Una API REST modela **recursos** (cosas) con **sustantivos en plural** en la ruta, y expresa lo que se hace con ellos mediante el **verbo HTTP**. No se escriben verbos en la ruta: se usa §POST /api/productos§, no §/api/crearProducto§.

| Verbo | Significado | ¿Seguro? | ¿Idempotente? | Éxito típico |
|---|---|---|---|---|
| GET | Leer | Sí | Sí | 200 |
| POST | Crear (o ejecutar una acción) | No | No | 201 al crear |
| PUT | Reemplazar los datos editables de un recurso | No | Sí | 200 |
| PATCH | Cambiar una parte del recurso | No | Depende | 200 |
| DELETE | Eliminar | No | Sí | 204 |

- **Seguro** significa que no modifica nada: se puede llamar sin consecuencias.
- **Idempotente** significa que repetir la misma petición varias veces deja el sistema igual que hacerla una sola vez. Borrar el producto 5 diez veces deja el mismo estado final que borrarlo una vez. Crear con POST diez veces crea diez recursos.

La idempotencia importa porque las redes fallan: un cliente que no recibió respuesta puede reintentar un PUT sin miedo, pero reintentar un POST puede duplicar datos.

## PUT frente a PATCH en esta API

- **PUT /api/productos/{id}** envía los datos descriptivos completos (nombre, descripción, categoría) y los reemplaza.
- **PATCH /api/productos/{id}/precio** cambia **un solo atributo**. Existe como operación aparte porque el precio es una decisión de negocio distinta, con su propio método en la entidad (§CambiarPrecio§).
- **POST /api/productos/{id}/activar** y **/desactivar** son **acciones**: no se limitan a asignar un campo; expresan una intención del negocio. Cuando una operación es un verbo del negocio y no se encaja en crear/leer/actualizar, se modela como un POST sobre el recurso con el nombre de la acción.

> [oop Encapsulamiento] Fíjate en cómo la API refleja la entidad. No existe un endpoint "cambia cualquier campo del producto". Hay uno por intención, y cada uno desemboca en un método de la entidad que valida. El stock, por ejemplo, **no** se puede cambiar por la API de productos: solo se mueve al vender o cancelar, a través de las reglas del pedido.

## Por qué paginar

Una tienda real tiene miles de productos. Devolver todos en una sola respuesta tiene varios problemas: la respuesta es enorme y lenta, consume mucha memoria en el servidor y en el navegador, y casi nadie necesita ver todo a la vez. La **paginación** devuelve el resultado por partes: "la página 3, de 20 en 20".

La respuesta incluye además el **total** de elementos y de páginas, para que el frontend pueda dibujar los controles de navegación.

::code http ver Ejemplo de petición
GET /api/productos?pagina=2&tamanoPagina=5
::

En el paso 8 definimos §FiltroProductos§ con límites automáticos: la página nunca baja de 1 y el tamaño siempre queda entre 1 y 100. Un cliente que pida 5000 elementos de golpe no puede tumbar el servidor. Esa protección vive **dentro del objeto**, con la palabra clave §field§ de C# 14.

## Parámetros de consulta

Los filtros viajan en la **query string** de la URL (lo que va después de §?§): §?texto=cafe&categoriaId=2&pagina=1§. Para que ASP.NET llene un objeto con ellos se usa §[FromQuery]§. El nombre de cada parámetro coincide con el de la propiedad del filtro (sin importar mayúsculas).

> [info] Las **consultas** (leer) usan GET con filtros en la URL. Las **órdenes** (crear, cambiar) usan POST/PUT/PATCH con un cuerpo JSON. Esa separación hace que las consultas se puedan guardar en favoritos, cachear y compartir.

## La implementación del servicio

::code csharp nuevo src/Tienda.Application/Productos/ProductoServicio.cs
using Tienda.Application.Categorias;
using Tienda.Application.Comun;
using Tienda.Domain.Entities;
using Tienda.Domain.Exceptions;

namespace Tienda.Application.Productos;

internal sealed class ProductoServicio(
    IProductoRepositorio productos,
    ICategoriaRepositorio categorias,
    IUnidadDeTrabajo unidadDeTrabajo) : IProductoServicio
{
    public async Task<ResultadoPaginado<ProductoDto>> BuscarAsync(FiltroProductos filtro, CancellationToken cancellationToken = default)
    {
        var pagina = await productos.BuscarAsync(filtro, cancellationToken);

        return pagina.Transformar(p => ProductoDto.Desde(p, p.Categoria?.Nombre ?? string.Empty));
    }

    public async Task<ProductoDto> ObtenerAsync(int id, CancellationToken cancellationToken = default)
    {
        var producto = await BuscarOFallarAsync(id, cancellationToken);
        return await ADtoAsync(producto, cancellationToken);
    }

    public async Task<ProductoDto> CrearAsync(CrearProductoSolicitud solicitud, CancellationToken cancellationToken = default)
    {
        var producto = new Producto(
            solicitud.Nombre,
            solicitud.Sku,
            solicitud.Precio,
            solicitud.Stock,
            solicitud.CategoriaId,
            solicitud.Descripcion);

        await ExigirCategoriaAsync(producto.CategoriaId, cancellationToken);

        if (await productos.ExisteSkuAsync(producto.Sku, null, cancellationToken))
            throw new ConflictoException($"Ya existe un producto con el SKU '{producto.Sku}'.");

        productos.Agregar(producto);
        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);

        return await ADtoAsync(producto, cancellationToken);
    }

    public async Task<ProductoDto> ActualizarAsync(int id, ActualizarProductoSolicitud solicitud, CancellationToken cancellationToken = default)
    {
        var producto = await BuscarOFallarAsync(id, cancellationToken);

        producto.ActualizarDatos(solicitud.Nombre, solicitud.Descripcion, solicitud.CategoriaId);
        await ExigirCategoriaAsync(producto.CategoriaId, cancellationToken);

        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);
        return await ADtoAsync(producto, cancellationToken);
    }

    public async Task<ProductoDto> CambiarPrecioAsync(int id, CambiarPrecioSolicitud solicitud, CancellationToken cancellationToken = default)
    {
        var producto = await BuscarOFallarAsync(id, cancellationToken);

        producto.CambiarPrecio(solicitud.Precio);

        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);
        return await ADtoAsync(producto, cancellationToken);
    }

    public async Task<ProductoDto> ActivarAsync(int id, CancellationToken cancellationToken = default)
    {
        var producto = await BuscarOFallarAsync(id, cancellationToken);

        producto.Activar();

        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);
        return await ADtoAsync(producto, cancellationToken);
    }

    public async Task<ProductoDto> DesactivarAsync(int id, CancellationToken cancellationToken = default)
    {
        var producto = await BuscarOFallarAsync(id, cancellationToken);

        producto.Desactivar();

        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);
        return await ADtoAsync(producto, cancellationToken);
    }

    private async Task<Producto> BuscarOFallarAsync(int id, CancellationToken cancellationToken) =>
        await productos.ObtenerPorIdAsync(id, cancellationToken)
        ?? throw new NoEncontradoException(nameof(Producto), id);

    private async Task ExigirCategoriaAsync(int categoriaId, CancellationToken cancellationToken)
    {
        if (await categorias.ObtenerPorIdAsync(categoriaId, cancellationToken) is null)
            throw new ReglaDeNegocioException($"La categoría {categoriaId} no existe.");
    }

    private async Task<ProductoDto> ADtoAsync(Producto producto, CancellationToken cancellationToken)
    {
        var categoria = await categorias.ObtenerPorIdAsync(producto.CategoriaId, cancellationToken)
            ?? throw new NoEncontradoException(nameof(Categoria), producto.CategoriaId);

        return ProductoDto.Desde(producto, categoria.Nombre);
    }
}
::

Puntos de diseño:

- **Composición con tres colaboradores.** El servicio recibe dos repositorios y la unidad de trabajo. Para validar que una categoría existe usa el repositorio de categorías; no accede a la tabla directamente.
- **Cada método de cambio es una línea de negocio:** §producto.CambiarPrecio(...)§, §producto.Activar()§. Toda la regla vive en la entidad. Si el precio llega negativo, el dominio lanza la excepción (422) y no se guarda nada.
- **Categoría inexistente: 422 y no 404.** Un 404 significa "la URL que pediste no existe". Aquí la URL (§POST /api/productos§) sí existe; lo que está mal es un **dato dentro del cuerpo**. Por eso se usa una regla de negocio incumplida.
- **Qué hace §ADtoAsync§.** Busca la categoría para incluir su nombre en la respuesta. Como el contexto ya la tiene en memoria cuando acaba de validarse, §ObtenerPorIdAsync§ la entrega sin consultar de nuevo la base.
- Las comparaciones (§ExisteSkuAsync§) usan el SKU **ya normalizado** por la entidad (en mayúsculas y sin espacios sobrantes). Así "ele-001" y "ELE-001" cuentan como el mismo.
- Los métodos §Activar§ y §Desactivar§ son **idempotentes** por diseño: activar un producto ya activo no falla, queda igual.

> [oop Responsabilidad única] Este servicio sigue sin contener ni una regla de precio, de stock o de largo de nombre. Si mañana se exige que el precio mínimo sea 100, se cambia §Guard§ o §CambiarPrecio§ en el dominio, y este archivo no se toca.

## Entidad frente a objeto de valor, otra vez

En el paso 4 se explicó que una **entidad** se define por su identidad (dos clientes distintos pueden llamarse igual) y un **objeto de valor** se define por sus datos. §Direccion§ es un objeto de valor: dos direcciones con la misma línea, ciudad, departamento y código postal son **la misma dirección**.

C# ofrece la herramienta exacta para modelarlos: el §record§. Un record:

- Compara por **valor**: §new Direccion("a","b","c","d") == new Direccion("a","b","c","d")§ es verdadero, aunque sean dos objetos distintos en memoria.
- Es inmutable cuando se declara con parámetros posicionales: para "cambiar" una dirección se crea otra nueva. Eso evita que dos clientes compartan por accidente el mismo objeto y que modificar uno altere al otro.
- Trae §ToString§ y §Equals§ ya escritos.

> [oop Encapsulamiento] La inmutabilidad es encapsulamiento llevado al extremo: si el objeto no puede cambiar después de creado, no hay forma de dejarlo en un estado inválido. §Cliente.ActualizarDatos§ recibe una dirección entera, la valida y la reemplaza.

El dominio usa §Direccion§ (un record con constantes de validación). La API define su propio §DireccionDto§. Podría parecer duplicación, pero responden a necesidades distintas: el DTO es el **contrato público** y se puede cambiar de forma (por ejemplo, agregar un campo "barrio") sin tocar el modelo interno, y el dominio puede reorganizarse sin romper a los clientes de la API.

using Tienda.Application.Comun;

using Tienda.Domain.Exceptions;

namespace Tienda.Application.Clientes;

internal sealed class ClienteServicio(IClienteRepositorio clientes, IUnidadDeTrabajo unidadDeTrabajo)
    : IClienteServicio
{
    public async Task<ClienteDto> ObtenerAsync(int id, CancellationToken cancellationToken = default)
    {
        var cliente = await clientes.ObtenerPorIdAsync(id, cancellationToken)
            ?? throw new NoEncontradoException(nameof(Cliente), id);

        return ClienteDto.Desde(cliente);
    }

    public async Task<ClienteDto> CrearAsync(CrearClienteSolicitud solicitud, CancellationToken cancellationToken = default)
    {
        var cliente = new Cliente(
            solicitud.Nombre,
            solicitud.Email,
            solicitud.Telefono,
            solicitud.Direccion.ADominio());

        if (await clientes.ExisteEmailAsync(cliente.Email, cancellationToken))
            throw new ConflictoException($"Ya existe un cliente registrado con el correo '{cliente.Email}'.");

        clientes.Agregar(cliente);
        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);

        return ClienteDto.Desde(cliente);
    }
}

# Teoría

## El caso de uso más importante

Crear un pedido es la operación donde fallan los sistemas mal diseñados. Tiene que hacer varias cosas a la vez, y **todas o ninguna**:

1. Verificar que el cliente existe.
2. Verificar que cada producto existe, está activo y tiene stock.
3. Descontar el stock de cada producto.
4. Guardar el pedido con sus líneas, con una copia del nombre y el precio de cada producto en ese momento.

El dominio ya sabe hacer el trabajo difícil (§Pedido.AgregarLinea§ valida y descuenta). El servicio de aplicación solo carga los objetos, los entrega y guarda.

## Transacción: todo o nada

Una **transacción** agrupa varias operaciones de base de datos en una unidad indivisible. Las bases relacionales garantizan las propiedades **ACID**:

| Letra | Propiedad | Significado |
|---|---|---|
| A | Atomicidad | Todas las operaciones se aplican, o ninguna |
| C | Consistencia | La base pasa de un estado válido a otro válido |
| I | Aislamiento | Las transacciones simultáneas no se ven a medias |
| D | Durabilidad | Lo confirmado sobrevive a un apagón |

§SaveChangesAsync§ envuelve **todos** los cambios pendientes del contexto en **una sola transacción**. Si el pedido tiene tres líneas y el INSERT de la tercera falla, PostgreSQL deshace también el pedido y las dos primeras líneas, y los descuentos de stock. No tienes que abrir la transacción a mano.

Hay además una segunda defensa, más temprana: si una línea no tiene stock, el dominio lanza la excepción **antes** de llegar a guardar. Como el contexto de esa petición se descarta, los descuentos hechos en memoria a las líneas anteriores se pierden sin tocar la base.

> [oop Composición] El pedido es la **raíz del agregado**: el único punto de entrada para sus líneas. El servicio nunca crea una §LineaPedido§ ni toca el stock de un producto por su cuenta: le dice al pedido "agrega este producto" y el pedido se encarga. A esto se le llama *Tell, Don't Ask*: dar órdenes a los objetos en vez de preguntarles sus datos para decidir por ellos.

## El problema de la concurrencia

Imagina que queda **una** unidad de un producto y dos clientes compran al mismo tiempo. Sin protección ocurre esto:

| Momento | Cliente A | Cliente B |
|---|---|---|
| 1 | Lee el producto: stock = 1 | |
| 2 | | Lee el producto: stock = 1 |
| 3 | El dominio acepta: 1 menos 1 = 0 | |
| 4 | | El dominio también acepta: 1 menos 1 = 0 |
| 5 | Guarda stock = 0 | |
| 6 | | Guarda stock = 0 |

Se vendieron **dos** unidades de un producto que tenía una. A este error se le llama **actualización perdida** (*lost update*). Ninguna validación del dominio lo evita, porque cada cliente trabaja con su propia copia en memoria, y en ambas copias el stock era suficiente.

Hay dos estrategias para resolverlo:

| Estrategia | Cómo funciona | Costo |
|---|---|---|
| **Pesimista** | Se bloquea la fila al leerla (§SELECT ... FOR UPDATE§); los demás esperan | Menos concurrencia y riesgo de bloqueos |
| **Optimista** | Nadie bloquea. Al guardar se comprueba que la fila **no haya cambiado** desde que se leyó; si cambió, se rechaza | Requiere reintentar al perder la carrera |

Usaremos la **optimista**, que es la habitual en APIs web: la mayoría de las veces nadie compite por el mismo registro, y cuando ocurre, se avisa al segundo.

## Cómo se implementa: un token de concurrencia

Se agrega a la fila un valor que **cambia en cada modificación**. Al hacer el UPDATE, EF incluye ese valor en la condición:

::code sql ver SQL que EF genera con un token de concurrencia
UPDATE productos SET stock = 0
WHERE id = 6 AND xmin = 12345;
::

Si otra transacción modificó la fila entretanto, su valor de §xmin§ ya no es 12345, el UPDATE afecta **cero filas**, y EF lanza una §DbUpdateConcurrencyException§. En la tabla anterior, el cliente B habría recibido ese error en el paso 6 y el stock jamás se habría vendido dos veces.

PostgreSQL tiene una ventaja: **toda fila ya tiene una columna de sistema llamada §xmin§** que guarda el identificador de la transacción que la modificó por última vez. No necesitamos crear ni mantener una columna de versión propia. Solo le decimos a EF que use §xmin§ como token.

> [info] Como §xmin§ es una columna de sistema, no aparece en un §SELECT *§ ni ocupa espacio extra. El token lo mapearemos como **propiedad sombra** (*shadow property*): existe en el modelo de EF pero **no** en la clase C#. El dominio queda sin ningún detalle de PostgreSQL.

## Qué entidades necesitan protección

- **Producto**, porque su stock se modifica por pedidos simultáneos.
- **Pedido**, porque dos acciones sobre el mismo pedido pueden competir: uno lo **paga** mientras otro lo **cancela**. Sin token, se podría pagar un pedido y devolver su stock a la vez.

Cuando se detecta el conflicto, la unidad de trabajo lo traduce a un §ConflictoException§, y el manejador del paso 12 responde **409**. El cliente (el frontend) puede mostrar "Otro usuario modificó este dato, intenta de nuevo" o reintentar solo.

> [oop Encapsulamiento] La protección se logró sin que ninguna entidad del dominio cambiara. Es un asunto de infraestructura: las reglas de negocio siguen en su lugar y la base de datos añade la garantía final. Cada capa hace lo que le corresponde.

using Tienda.Application.Clientes;
using Tienda.Application.Comun;
using Tienda.Application.Productos;
using Tienda.Domain.Entities;
using Tienda.Domain.Exceptions;

namespace Tienda.Application.Pedidos;

internal sealed class PedidoServicio(
    IPedidoRepositorio pedidos,
    IProductoRepositorio productos,
    IClienteRepositorio clientes,
    IUnidadDeTrabajo unidadDeTrabajo) : IPedidoServicio
{
    public async Task<PedidoDto> CrearAsync(CrearPedidoSolicitud solicitud, CancellationToken cancellationToken = default)
    {
        if (solicitud.Lineas.Count == 0)
            throw new ReglaDeNegocioException("El pedido debe tener al menos un producto.");

        var cliente = await clientes.ObtenerPorIdAsync(solicitud.ClienteId, cancellationToken)
            ?? throw new ReglaDeNegocioException($"El cliente {solicitud.ClienteId} no existe.");

        var idsSolicitados = solicitud.Lineas.Select(l => l.ProductoId).Distinct().ToList();
        var encontrados = await productos.ObtenerPorIdsAsync(idsSolicitados, cancellationToken);
        var porId = encontrados.ToDictionary(p => p.Id);

        var faltantes = idsSolicitados.Where(id => !porId.ContainsKey(id)).ToList();
        if (faltantes.Count > 0)
            throw new ReglaDeNegocioException($"No existen los productos: {string.Join(", ", faltantes)}.");

        var pedido = new Pedido(cliente.Id);

        foreach (var linea in solicitud.Lineas)
            pedido.AgregarLinea(porId[linea.ProductoId], linea.Cantidad);

        pedidos.Agregar(pedido);
        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);

        return PedidoDto.Desde(pedido);
    }

    public async Task<PedidoDto> ObtenerAsync(int id, CancellationToken cancellationToken = default)
    {
        var pedido = await BuscarOFallarAsync(id, cancellationToken);
        return PedidoDto.Desde(pedido);
    }

    public async Task<IReadOnlyList<PedidoDto>> ListarPorClienteAsync(int clienteId, CancellationToken cancellationToken = default)
    {
        if (await clientes.ObtenerPorIdAsync(clienteId, cancellationToken) is null)
            throw new NoEncontradoException(nameof(Cliente), clienteId);

        var lista = await pedidos.ListarPorClienteAsync(clienteId, cancellationToken);
        return lista.Select(PedidoDto.Desde).ToList();
    }

    public async Task<PedidoDto> PagarAsync(int id, CancellationToken cancellationToken = default)
    {
        var pedido = await BuscarOFallarAsync(id, cancellationToken);

        pedido.MarcarComoPagado();

        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);
        return PedidoDto.Desde(pedido);
    }

    public async Task<PedidoDto> CancelarAsync(int id, CancellationToken cancellationToken = default)
    {
        var pedido = await BuscarOFallarAsync(id, cancellationToken);

        pedido.Cancelar();

        await unidadDeTrabajo.GuardarCambiosAsync(cancellationToken);
        return PedidoDto.Desde(pedido);
    }

    private async Task<Pedido> BuscarOFallarAsync(int id, CancellationToken cancellationToken) =>
        await pedidos.ObtenerConLineasAsync(id, cancellationToken)
        ?? throw new NoEncontradoException(nameof(Pedido), id);
}
::

Léelo con calma, es el servicio más importante del proyecto:

- **Orden de las comprobaciones.** Primero lo barato y que no requiere la base (¿vienen líneas?), después el cliente, después los productos. Se falla temprano con el mensaje más específico.
- **Una consulta para todos los productos.** §ObtenerPorIdsAsync§ trae todos de una vez con §WHERE id IN (...)§. Hacer una consulta por línea sería el clásico problema **N+1**: con 20 líneas, 20 viajes a la base.
- **§Distinct()§ sobre los ids.** Si el cliente envía el mismo producto dos veces (dos líneas), se consulta una sola vez; §AgregarLinea§ del dominio se encarga de **sumar** las cantidades en una única línea.
- **El bucle §foreach§ solo da órdenes.** Cada §AgregarLinea§ valida que el pedido siga pendiente, que el producto esté activo, que haya stock, descuenta y arma la línea. Si cualquiera falla, la excepción sale y **no se llega a §GuardarCambiosAsync§**: no se guarda nada.
- **Cliente inexistente: 422.** Igual que la categoría del producto: el error es un dato dentro del cuerpo, no la URL.
- **§PagarAsync§ y §CancelarAsync§** son dos líneas de negocio: cargar el agregado completo y pedirle al pedido que cambie de estado. Cancelar devuelve el stock porque el pedido, a través de sus líneas y sus productos, lo hace por sí mismo. El servicio no sabe cómo.
- **Pago simulado.** §MarcarComoPagado§ solo cambia el estado. Cobrar de verdad con una pasarela de pagos queda fuera de este material.

> [oop Abstracción] Compara el tamaño del servicio con la complejidad del problema. Es corto porque las reglas están en el dominio. Si hubieran estado en el servicio, tendría decenas de condiciones, y habría que repetirlas en cualquier otro caso de uso que tocara pedidos.
